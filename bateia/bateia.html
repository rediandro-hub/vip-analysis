    else dataImagem();

    const ro = B.$('#readout');
    map.on('mousemove', (e) => {
      const { lat, lng } = e.latlng;
      if (Math.abs(lat) > 84) { ro.textContent = ''; return; }
      const u = B.toUTM(lat, ((lng + 540) % 360) - 180);
      ro.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)} · UTM ${u.zone}${u.band} ${Math.round(u.E)} ${Math.round(u.N)}`;
    });
    map.on('mouseout', () => (ro.textContent = ''));
    // clique simples: atalho para analisar; o menu completo fica no botão direito (ou toque longo)
    map.on('click', (e) => {
      if (B.ctx && B.ctx.busy()) return; // desenho de polígono, medida ou perfil em andamento
      const lat = e.latlng.lat, lon = ((e.latlng.lng + 540) % 360) - 180;
      const div = document.createElement('div');
      div.innerHTML = `<div class="mono xs">${lat.toFixed(6)}, ${lon.toFixed(6)}</div><div class="actions" style="margin:6px 0 4px"><button class="btn btn-primary btn-sm" type="button" data-p="go">Analisar este ponto</button><button class="btn btn-sm" type="button" data-p="mais">Mais opções</button></div><div class="xs muted">Botão direito (ou toque longo) abre o menu completo.</div>`;
      div.querySelector('[data-p="go"]').onclick = () => { map.closePopup(); B.app.runPoint(lat, lon); };
      div.querySelector('[data-p="mais"]').onclick = (ev) => { const r = ev.currentTarget.getBoundingClientRect(); map.closePopup(); B.ctx.openMenu(lat, lon, r.left, r.bottom + 4); };
      L.popup({ closeButton: true }).setLatLng(e.latlng).setContent(div).openOn(map);
    });
  };

  M.buildPanel = function () {
    const body = B.$('#layerBody'), tog = B.$('#layerToggle');
    tog.onclick = () => { const o = body.hidden; body.hidden = !o; tog.setAttribute('aria-expanded', String(o)); };
    let h = '<h5>Mapa-base</h5>';
    const radio = (k) => `<label><input type="radio" name="base" value="${B.esc(k)}" ${k === M.base ? 'checked' : ''}> ${B.esc(k)}</label>`;
    h += Object.keys(M.bases).map(radio).join('') + '<div class="base-sub">Google · com a sua chave da Map Tiles API</div>' + Object.keys(M.googleDefs).map(radio).join('');
    h += `<p class="base-nota"><a href="#" id="gKey">${M.googleKey() ? 'Chave do Google configurada · trocar' : 'Imagens do Google: configurar a chave'}</a></p>`;
    h += '<h5>Resultados da análise</h5><label><input type="checkbox" id="lyrRes" checked> Pontos, polígonos e linhas</label><div id="lyrLocal"></div>';
    let g = '';
    M.overlays.forEach((o) => {
      if (o.grupo !== g) { g = o.grupo; h += `<h5>${B.esc(g)}</h5>`; }
      h += `<label><input type="checkbox" data-ov="${o.id}"> ${B.esc(o.nome)}</label>`;
    });
    h += '<div class="opacity"><span>Opacidade</span><input type="range" id="ovOpacity" min="0.1" max="1" step="0.05" value="0.7" aria-label="Opacidade das camadas"></div>';
    body.innerHTML = h;
    body.addEventListener('change', (e) => {
      const t = e.target;
      if (t.name === 'base') M.setBase(t.value);
      if (t.id === 'lyrRes') { if (t.checked) M.res.addTo(M.L); else M.L.removeLayer(M.res); }
      if (t.dataset.ov) { const o = M.overlays.find((x) => x.id === t.dataset.ov); if (t.checked) o.layer.addTo(M.L); else M.L.removeLayer(o.layer); }
      if (t.dataset.local) M.toggleLocal(t.dataset.local, t.checked);
    });
    body.addEventListener('click', (e) => {
      if (e.target.id !== 'gKey') return;
      e.preventDefault();
      B.ctx.chaveGoogle(M.googleDefs[M.base] ? M.base : 'Google — satélite');
    });
    body.addEventListener('input', (e) => {
      if (e.target.id !== 'ovOpacity') return;
      const v = +e.target.value;
      M.overlays.forEach((o) => M.L.hasLayer(o.layer) && o.layer.setOpacity(v));
      Object.values(M.local).forEach((l) => l.layer.setOpacity(v));
    });
  };
  /* ---------- mapa-base: troca, Google (Map Tiles API) e data da imagem Esri ---------- */
  const marcaBase = (nome) => B.$$('#layerBody input[name="base"]').forEach((r) => (r.checked = r.value === nome));
  M.googleKey = () => String(B.store.get('googleKey', '') || '').trim();
  M.setGoogleKey = (k) => {
    B.store.set('googleKey', (k || '').trim());
    Object.keys(M.googleDefs).forEach((n) => B.store.set('gs:' + n, null));
    Object.keys(gLayers).forEach((n) => delete gLayers[n]);
    const a = B.$('#gKey');
    if (a) a.textContent = M.googleKey() ? 'Chave do Google configurada · trocar' : 'Imagens do Google: configurar a chave';
  };
  M.setBase = async function (nome, silencioso) {
    const ant = M.base;
    let layer = M.bases[nome];
    if (!layer && M.googleDefs[nome]) {
      try { layer = await googleLayer(nome); }
      catch (e) {
        marcaBase(ant);
        if (!silencioso || e.semChave) B.ctx.chaveGoogle(nome, e.semChave ? null : e.message);
        else B.toast('Imagens do Google indisponíveis (' + e.message + '). Usando o satélite Esri.', 6000);
        return false;
      }
    }
    if (!layer) { marcaBase(ant); return false; }
    if (M.baseLayer && M.baseLayer !== layer) M.L.removeLayer(M.baseLayer);
    M.baseLayer = layer; M.base = nome;
    if (!M.L.hasLayer(layer)) layer.addTo(M.L);
    layer.bringToBack();
    marcaBase(nome);
    B.store.set('base', nome);
    googleAttr(!!M.googleDefs[nome]);
    M.L.getContainer().classList.toggle('g-on', !!M.googleDefs[nome]);
    dataImagem();
    return true;
  };

  const gLayers = {};
  const gErro = (j, st) => {
    const m = (j && j.error && j.error.message) || 'erro ' + st;
    if (/API key not valid|invalid/i.test(m)) return 'a chave não é válida';
    if (/has not been used|is disabled|not enabled|SERVICE_DISABLED/i.test(m)) return 'a Map Tiles API não está ativada no projeto dessa chave';
    if (/billing/i.test(m)) return 'o faturamento do projeto no Google Cloud não está ativo';
    if (/referer|referrer|blocked/i.test(m)) return 'a chave está restrita a outro endereço ou a outra API';
    return m;
  };
  async function sessao(nome, nova) {
    const key = M.googleKey();
    if (!key) { const e = new Error('falta a chave do Google'); e.semChave = true; throw e; }
    const ck = 'gs:' + nome;
    let s = B.store.get(ck, null);
    if (nova || !s || s.k !== key.slice(-6) || +s.expiry * 1000 < Date.now() + 3600e3) {
      const pede = async (hd) => {
        const corpo = Object.assign({ language: 'pt-BR', region: 'BR' }, M.googleDefs[nome], hd ? { scale: 'scaleFactor2x', highDpi: true } : {});
        let r, j;
        try {
          r = await fetch('https://tile.googleapis.com/v1/createSession?key=' + encodeURIComponent(key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
          j = await r.json().catch(() => null);
        } catch (e) { throw new Error('não consegui falar com o Google (' + e.message + ')'); }
        return { r, j };
      };
      const hd = (window.devicePixelRatio || 1) > 1.4; // tela de alta densidade: blocos 512 px, mais nítidos
      let { r, j } = await pede(hd);
      if (hd && r.status === 400 && !/key/i.test((j && j.error && j.error.message) || '')) ({ r, j } = await pede(false));
      if (!r.ok || !j || !j.session) throw new Error(gErro(j, r.status));
      s = { session: j.session, expiry: j.expiry, k: key.slice(-6) };
      B.store.set(ck, s);
    }
    return s;
  }
  async function googleLayer(nome) {
    const s = await sessao(nome);
    const g = gLayers[nome];
    if (g && g._sess === s.session) return g;
    const key = M.googleKey();
    const layer = L.tileLayer(`https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=${encodeURIComponent(s.session)}&key=${encodeURIComponent(key)}`, { maxZoom: 21, maxNativeZoom: 20 });
    layer._sess = s.session;
    // a sessão vale cerca de duas semanas; se muitos blocos falharem, pede outra (no máximo a cada 10 min)
    let falhas = 0, renovando = false, ultima = 0;
    layer.on('tileload', () => { falhas = 0; });
    layer.on('tileerror', async () => {
      if (++falhas < 12 || renovando || M.base !== nome || Date.now() - ultima < 600e3) return;
      renovando = true; ultima = Date.now();
      try { const n = await sessao(nome, true); layer._sess = n.session; layer.setUrl(`https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=${encodeURIComponent(n.session)}&key=${encodeURIComponent(M.googleKey())}`); falhas = 0; }
      catch (e) { B.toast('Imagens do Google indisponíveis: ' + e.message); }
      renovando = false;
    });
    gLayers[nome] = layer;
    return layer;
  }
  /* atribuição exigida pelo Google: logotipo no canto inferior esquerdo + texto de copyright da área visível */
  let gAttr = '', gT = null;
  const logo = L.control({ position: 'bottomleft' });
  logo.onAdd = () => {
    const d = L.DomUtil.create('div', 'glogo');
    const img = new Image();
    img.alt = 'Google Maps'; img.src = 'https://maps.gstatic.com/mapfiles/api-3/images/google_white5.png';
    img.onerror = () => { d.textContent = 'Google Maps'; };
    d.appendChild(img);
    return d;
  };
  const wrapLon = (v) => Math.max(-179.9999, Math.min(179.9999, ((v + 540) % 360) - 180));
  function googleAttr(on) {
    const map = M.L;
    if (!on) { if (gAttr) map.attributionControl.removeAttribution(gAttr); gAttr = ''; if (logo._map) logo.remove(); return; }
    if (!logo._map) { logo.addTo(map); const el = logo.getContainer(); el.parentNode.appendChild(el); } // logotipo abaixo da escala
    gViewport();
  }
  function gViewport() {
    clearTimeout(gT);
    gT = setTimeout(async () => {
      const nome = M.base, s = B.store.get('gs:' + nome, null);
      if (!M.googleDefs[nome] || !s) return;
      const b = M.L.getBounds(), lat = (v) => Math.max(-85, Math.min(85, v));
      const span = b.getEast() - b.getWest() >= 359;
      const url = 'https://tile.googleapis.com/tile/v1/viewport?' + B.qs({ session: s.session, key: M.googleKey(), zoom: M.L.getZoom(), north: lat(b.getNorth()), south: lat(b.getSouth()), east: span ? 179.9999 : wrapLon(b.getEast()), west: span ? -179.9999 : wrapLon(b.getWest()) });
      try {
        const j = await (await fetch(url)).json();
        const txt = 'Google Maps' + (j.copyright ? ' · ' + B.esc(j.copyright) : '');
        if (txt !== gAttr) { if (gAttr) M.L.attributionControl.removeAttribution(gAttr); gAttr = txt; M.L.attributionControl.addAttribution(gAttr); }
        // zoom máximo com imagem real nesta área: acima dele o Leaflet amplia o último nível em vez de pedir blocos vazios
        const c = M.L.getCenter(), lng = wrapLon(c.lng), lay = M.baseLayer;
        const zs = (j.maxZoomRects || []).filter((r) => c.lat <= r.north && c.lat >= r.south && (r.west <= r.east ? lng >= r.west && lng <= r.east : lng >= r.west || lng <= r.east)).map((r) => +r.maxZoom).filter((z) => z > 0);
        const mz = zs.length ? Math.min(21, Math.max(...zs)) : null;
        if (mz && M.base === nome && lay && lay.options.maxNativeZoom !== mz) { lay.options.maxNativeZoom = mz; lay.redraw(); }
      } catch (e) { /* atribuição mínima já exibida */ if (!gAttr) { gAttr = 'Google Maps'; M.L.attributionControl.addAttribution(gAttr); } }
    }, 600);
  }

  /* data da imagem da Esri no centro do mapa (serviço de metadados do World Imagery) */
  let metaSvc = null, dAttr = '', dT = null;
  M.imagemEsri = async function (lat, lon) {
    if (!metaSvc) {
      const j = await B.fetchJSON('https://metadata.maptiles.arcgis.com/arcgis/rest/services?f=json', { timeout: 15000 });
      const s = (j.services || []).map((x) => x.name).filter((n) => /^World_Imagery_Metadata_\d{4}_r\d+$/.test(n)).sort();
      if (!s.length) throw new Error('metadados indisponíveis');
      metaSvc = 'https://metadata.maptiles.arcgis.com/arcgis/rest/services/' + s[s.length - 1] + '/MapServer';
    }
    const r = await B.ags.identifyPt(metaSvc, lat, lon, { tolPx: 0, extentDeg: 0.002, timeout: 15000 });
    const best = r.filter((x) => x.attributes && /^\d{8}$/.test(String(x.attributes.SRC_DATE))).sort((a, b) => a.layerId - b.layerId)[0];
    if (!best) return null;
    const a = best.attributes, d = String(a.SRC_DATE);
    const res = B.num(a.SRC_RES);
    return { data: `${d.slice(6, 8)}/${d.slice(4, 6)}/${d.slice(0, 4)}`, dt: new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)), res, resTxt: res == null ? null : res < 1 ? B.fmt(res * 100, 0) + ' cm' : B.fmt(res, 1) + ' m', fonte: B.clean(a.NICE_DESC), produto: B.clean(a.NICE_NAME) };
  };
  function dataImagem() {
    clearTimeout(dT);
    dT = setTimeout(async () => {
      const map = M.L, ativa = M.base === 'Satélite (Esri)' && map.getZoom() >= 10;
      if (!ativa) { if (dAttr) map.attributionControl.removeAttribution(dAttr); dAttr = ''; return; }
      const c = map.getCenter();
      let txt = '';
      try { const i = await M.imagemEsri(c.lat, ((c.lng + 540) % 360) - 180); if (i) txt = `Imagem do centro: ${i.data}${i.resTxt ? ' · ' + i.resTxt : ''}${i.fonte ? ' · ' + B.esc(i.fonte) : ''}`; } catch (e) { txt = ''; }
      if (M.base !== 'Satélite (Esri)') txt = '';
      if (txt !== dAttr) { if (dAttr) map.attributionControl.removeAttribution(dAttr); dAttr = txt; if (txt) map.attributionControl.addAttribution(txt); }
    }, 700);
  }
  M.dataImagem = dataImagem;

  M.showOverlay = function (id, on = true) {
    const o = M.overlays.find((x) => x.id === id);
    if (!o) return;
    const cb = B.$(`[data-ov="${id}"]`);
    if (on && !M.L.hasLayer(o.layer)) o.layer.addTo(M.L);
    if (!on && M.L.hasLayer(o.layer)) M.L.removeLayer(o.layer);
    if (cb) cb.checked = on;
  };

  /* sobreposições calculadas localmente (canvas → imagem georreferenciada) */
  M.setLocal = function (id, nome, canvas, bbox) {
    if (M.local[id]) { M.L.removeLayer(M.local[id].layer); }
    const url = canvas.toDataURL('image/png');
    const layer = L.imageOverlay(url, [[bbox[1], bbox[0]], [bbox[3], bbox[2]]], { opacity: 0.8, zIndex: 6 });
    M.local[id] = { nome, layer, url };
    M.renderLocalList();
  };
  M.toggleLocal = function (id, on) {
    const l = M.local[id]; if (!l) return;
    if (on) l.layer.addTo(M.L); else M.L.removeLayer(l.layer);
    const cb = B.$(`[data-local="${id}"]`); if (cb) cb.checked = on;
  };
  M.soloLocal = function (id) {
    Object.keys(M.local).forEach((k) => M.toggleLocal(k, k === id));
    B.$('#layerBody').hidden = false;
    B.$('#layerToggle').setAttribute('aria-expanded', 'true');
  };
  M.renderLocalList = function () {
    const el = B.$('#lyrLocal'); if (!el) return;
    el.innerHTML = Object.entries(M.local).map(([k, l]) => `<label><input type="checkbox" data-local="${k}" ${M.L.hasLayer(l.layer) ? 'checked' : ''}> ${B.esc(l.nome)}</label>`).join('');
  };
  M.clearLocal = function () { Object.values(M.local).forEach((l) => M.L.removeLayer(l.layer)); M.local = {}; M.renderLocalList(); };

  /* ---------- camadas de resultado ---------- */
  const pop = (title, rows) => `<h6>${B.esc(title)}</h6>` + rows.filter((r) => r[1] != null && r[1] !== '').map(([k, v]) => `<div><span class="muted">${B.esc(k)}:</span> ${B.esc(v)}</div>`).join('');
  M.drawAOI = function (aoi) {
    M.res.clearLayers();
    M.clearLocal();
    const st = { color: cssVar('var(--accent)'), weight: 2.5, fill: false, dashArray: '6 5' };
    if (aoi.tipo === 'poligono') L.polygon(aoi.ring, st).addTo(M.res);
    else if (aoi.tipo === 'linha') { L.polyline(aoi.line, { color: st.color, weight: 3 }).addTo(M.res); L.rectangle([[aoi.bbox[1], aoi.bbox[0]], [aoi.bbox[3], aoi.bbox[2]]], st).addTo(M.res); }
    else L.circle([aoi.lat, aoi.lon], { radius: aoi.raioKm * 1000, ...st }).addTo(M.res);
    (aoi.features || []).filter((f) => f.type === 'Point').forEach((f) => L.circleMarker(f.coords[0], { radius: 4, color: '#fff', weight: 1, fillColor: st.color, fillOpacity: 1 }).bindTooltip(f.name).addTo(M.res));
    M.center = L.marker([aoi.lat, aoi.lon], { title: 'Centro da análise', keyboard: false }).addTo(M.res);
    M.L.fitBounds([[aoi.bbox[1], aoi.bbox[0]], [aoi.bbox[3], aoi.bbox[2]]], { padding: [30, 30], maxZoom: 15 });
  };
  M.drawResult = function (id, data, aoi) {
    if (!data) return;
    const g = L.layerGroup().addTo(M.res);
    if (id === 'occ') data.list.forEach((o) => {
      L.circleMarker([o.lat, o.lon], { radius: o.naArea ? 6 : 4, color: '#fff', weight: 1, fillColor: M.cor(o.classe), fillOpacity: o.naArea ? 0.95 : 0.55 })
        .bindPopup(pop(o.subs.join(', '), [['Local', o.top], ['Município', o.mun && o.mun + '/' + (o.uf || '')], ['Classe', o.classe], ['Status', o.status], ['Importância', o.imp], ['Rocha hospedeira', o.host], ['Encaixante', o.encaixante], ['Morfologia', o.morfo], ['Distância do centro', B.km(o.dist)], ['Posicionamento', o.metodo], ['Fonte', 'SGB — GEOBANK']])).addTo(g);
    });
    if (id === 'mrds') data.list.forEach((o) => {
      L.circleMarker([o.lat, o.lon], { radius: 5, color: cssVar('var(--ink)'), weight: 1.5, fillColor: '#fff', fillOpacity: 0.9 })
        .bindPopup(pop(o.nome || 'MRDS', [['Substâncias', o.subs.join(', ')], ['Situação', o.status], ['Distância', B.km(o.dist)], ['Fonte', 'USGS MRDS ' + (o.url || '')]])).addTo(g);
    });
    if (id === 'anm') data.list.forEach((p) => {
      L.polygon(p.rings, { color: cssVar('var(--ochre)'), weight: 1.6, fillOpacity: p.contemCentro ? 0.22 : 0.08 })
        .bindPopup(pop('Processo ' + p.processo, [['Fase', p.fase], ['Substância', p.subs], ['Titular', p.titular], ['Uso', p.uso], ['Área', p.areaHa != null ? B.fmt(p.areaHa, 2) + ' ha' : null], ['Último evento', p.evento]])).addTo(g);
    });
    if (id === 'estr') data.lines.forEach((l) => {
      L.polyline(l.pts, { color: cssVar('var(--hematite)'), weight: l.naArea ? 2.6 : 1.4, opacity: 0.9 }).bindTooltip(`${l.tipo}${l.nome ? ' — ' + l.nome : ''}`).addTo(g);
    });
    if (id === 'aflora') data.list.slice(0, 400).forEach((a) => {
      L.circleMarker([a.lat, a.lon], { radius: 3.5, color: cssVar('var(--ink-2)'), weight: 1, fillColor: cssVar('var(--surface)'), fillOpacity: 1 })
        .bindPopup(pop('Afloramento ' + (a.campo || a.id || ''), [['Local', a.top], ['Rochas', a.rochas], ['Descrição', a.desc], ['Geólogo', a.geologo], ['Projeto', a.projeto], ['Distância', B.km(a.dist)]])).addTo(g);
    });
    if (id === 'grav') data.list.forEach((s) => {
      L.circleMarker([s.lat, s.lon], { radius: 3, color: cssVar('var(--violet)'), weight: 1, fillOpacity: 0.6 }).bindTooltip(`Bouguer ${B.fmt(s.bouguer, 1)} mGal · ar livre ${B.fmt(s.ar, 1)} mGal · ${B.fmt(s.alt, 0)} m`).addTo(g);
    });
    if (id === 'tect' && data.kimberlitos) data.kimberlitos.slice(0, 30).forEach((k) => {
      L.circleMarker([k.lat, k.lon], { radius: 6, color: '#111', weight: 1.5, fillColor: '#6a2c91', fillOpacity: 0.9 }).bindTooltip('Kimberlito' + (k.idade ? ' — ' + k.idade : '')).addTo(g);
    });
    return g;
  };
  M.drawGeochem = function (geoq, G) {
    if (!geoq || !geoq.amostras) return;
    const g = L.layerGroup().addTo(M.res);
    geoq.amostras.forEach((s) => {
      const an = Object.values(G.el).filter((x) => x.anomSamples.includes(s.id)).map((x) => x.e.toUpperCase());
      L.circleMarker([s.lat, s.lon], { radius: an.length ? 5 + Math.min(4, an.length) : 3.5, color: cssVar(an.length ? 'var(--hematite)' : 'var(--ink-2)'), weight: an.length ? 2 : 1, fillColor: an.length ? cssVar('var(--hematite)') : cssVar('var(--surface)'), fillOpacity: an.length ? 0.55 : 0.9 })
        .bindPopup(pop('Sedimento de corrente ' + (s.campo || s.id), [['Projeto', s.projeto], ['Anômalo em', an.join(', ') || 'nenhum elemento'], ['Leitura', s.leitura], ['Abertura', s.abertura], ['Laboratório', s.lab], ['Data', s.data], ['Distância', B.km(s.dist)]])).addTo(g);
    });
    (geoq.concentrados || []).filter((c) => c.pintasAu > 0).forEach((c) => {
      L.circleMarker([c.lat, c.lon], { radius: 6, color: '#7a5200', weight: 2, fillColor: '#f2c230', fillOpacity: 0.95 }).bindTooltip(`Concentrado de bateia: ${c.pintasAu} pinta(s) de ouro`).addTo(g);
    });
  };
  M.flyTo = (lat, lon) => { M.L.setView([lat, lon], Math.max(M.L.getZoom(), 13)); };
})();

/* Bateia — painel de resultados: abas, tabelas, gráficos SVG e interpretação. */
(function () {
  'use strict';
  const B = window.B;
  const e = B.esc;
  const V = (B.view = {});

  /* ---------- pequenos construtores ---------- */
  const sec = (t, html, extra = '') => `<section class="sec" ${extra}><h3>${t}<span class="rule"></span></h3>${html}</section>`;
  const kv = (rows) => '<dl class="kv">' + rows.filter((r) => r && r[1] != null && r[1] !== '' && r[1] !== '—').map(([k, v, raw]) => `<dt>${e(k)}</dt><dd>${raw ? v : e(v)}</dd>`).join('') + '</dl>';
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${e(l)}</span></div>`;
  const tbl = (head, rows, cls = []) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h, i) => `<th class="${cls[i] || ''}">${e(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const tr = (cells, cls = [], attrs = '') => `<tr ${attrs}>${cells.map((c, i) => `<td class="${cls[i] || ''}">${c}</td>`).join('')}</tr>`;
  const empty = (t, s) => `<div class="empty"><strong>${e(t)}</strong>${e(s || '')}</div>`;
  V.helpers = { sec, kv, stat, tbl, tr, empty };

  /* estado de uma fonte (carregando / erro / fora da cobertura) */
  V.status = function (id, quiet) {
    const S = B.state, p = B.PROVIDERS.find((x) => x.id === id);
    const st = S.status[id];
    if (st === 'run' || st === 'wait') return `<p class="muted small"><span class="spinner"></span>Consultando ${e(p.nome)} (${e(p.fonte)})…</p>`;
    if (st === 'err') return `<div class="callout warn small">Não foi possível consultar ${e(p.nome)} (${e(p.fonte)}): ${e(S.errors[id] || 'erro desconhecido')}. As demais fontes seguem válidas; tente analisar de novo em alguns minutos.</div>`;
    if (st === 'off') return quiet ? '' : `<p class="muted small">${e(p.nome)}: fora da cobertura desta base (${e(p.fonte)}). ${B.tag('unk')}</p>`;
    if (st === 'empty') return quiet ? '' : `<p class="muted small">${e(p.nome)}: nenhum registro na área consultada. ${B.tag('unk')}</p>`;
    return null;
  };
  const ok = (id) => B.state.status[id] === 'ok' && B.state.R[id];

  /* ---------- gráficos ---------- */
  V.barsH = function (items, o = {}) {
    if (!items.length) return '';
    const W = 420, rowH = 22, padL = o.padL || 120, padR = 54, H = items.length * rowH + 26;
    const max = Math.max(o.ref || 0, ...items.map((i) => i.v)) * 1.08 || 1;
    const x = (v) => padL + (v / max) * (W - padL - padR);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${e(o.label || 'gráfico de barras')}">`;
    items.forEach((it, i) => {
      const y = 6 + i * rowH;
      s += `<text x="${padL - 8}" y="${y + 13}" text-anchor="end" style="fill:var(--ink-2);font-size:11.5px">${e(it.l)}</text>`;
      s += `<rect x="${padL}" y="${y + 3}" width="${Math.max(2, x(it.v) - padL)}" height="13" rx="3" style="fill:${it.c || 'var(--accent)'}"><title>${e(it.l)}: ${e(it.t || B.fmtSig(it.v))}</title></rect>`;
      s += `<text x="${x(it.v) + 6}" y="${y + 13}" class="num" style="fill:var(--muted);font-size:11px;font-family:var(--f-mono)">${e(it.t || B.fmtSig(it.v))}</text>`;
    });
    if (o.ref) s += `<line x1="${x(o.ref)}" x2="${x(o.ref)}" y1="2" y2="${H - 18}" style="stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3"/><text x="${x(o.ref)}" y="${H - 5}" text-anchor="middle" style="fill:var(--muted);font-size:10.5px">${e(o.refLabel || '')}</text>`;
    return s + '</svg>';
  };
  V.rose = function (bins, o = {}) {
    const S = 220, c = S / 2, R = c - 22, max = Math.max(...bins) || 1;
    let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Diagrama de roseta das estruturas" style="max-width:240px;margin:auto">`;
    [0.25, 0.5, 0.75, 1].forEach((f) => (s += `<circle cx="${c}" cy="${c}" r="${R * f}" style="fill:none;stroke:var(--line);stroke-width:1"/>`));
    s += `<line x1="${c}" y1="${c - R}" x2="${c}" y2="${c + R}" style="stroke:var(--line)"/><line x1="${c - R}" y1="${c}" x2="${c + R}" y2="${c}" style="stroke:var(--line)"/>`;
    const pt = (az, r) => [c + r * Math.sin((az * Math.PI) / 180), c - r * Math.cos((az * Math.PI) / 180)];
    bins.forEach((v, i) => {
      if (!v) return;
      const r = R * Math.sqrt(v / max);
      [0, 180].forEach((off) => {
        const a0 = i * 10 + off + 0.8, a1 = (i + 1) * 10 + off - 0.8;
        const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
        s += `<path d="M${c},${c} L${x0.toFixed(1)},${y0.toFixed(1)} A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" style="fill:var(--hematite);fill-opacity:.82"><title>${i * 10}°–${(i + 1) * 10}°: ${B.fmt(v, 1)} km de traços</title></path>`;
      });
    });
    [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(([t, a]) => { const [x, y] = pt(a, R + 12); s += `<text x="${x}" y="${y + 4}" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-weight:600">${t}</text>`; });
    return s + '</svg>';
  };
  V.profile = function (series) {
    const W = 440, H = 190, pl = 46, pr = 12, pt = 12, pb = 30;
    const all = series.flatMap((s) => s.pts);
    if (!all.length) return '';
    const xmax = Math.max(...all.map((p) => p.d)), zmin = Math.min(...all.map((p) => p.z)), zmax = Math.max(...all.map((p) => p.z));
    const zr = Math.max(10, zmax - zmin), z0 = zmin - zr * 0.08, z1 = zmax + zr * 0.08;
    const X = (d) => pl + (d / xmax) * (W - pl - pr), Y = (z) => pt + (1 - (z - z0) / (z1 - z0)) * (H - pt - pb);
    const nice = (lo, hi, n) => { const st = Math.pow(10, Math.floor(Math.log10((hi - lo) / n))); const m = [1, 2, 5, 10].find((k) => (hi - lo) / (st * k) <= n) * st; const out = []; for (let v = Math.ceil(lo / m) * m; v <= hi; v += m) out.push(v); return out; };
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfis topográficos">`;
    nice(z0, z1, 4).forEach((z) => (s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(z)}" y2="${Y(z)}" style="stroke:var(--line-2)"/><text x="${pl - 6}" y="${Y(z) + 4}" text-anchor="end" style="fill:var(--muted);font-size:10.5px;font-family:var(--f-mono)">${B.fmt(z)}</text>`));
    nice(0, xmax, 5).forEach((d) => (s += `<text x="${X(d)}" y="${H - pb + 15}" text-anchor="middle" style="fill:var(--muted);font-size:10.5px;font-family:var(--f-mono)">${B.fmt(d, d < 10 && d % 1 ? 1 : 0)}</text>`));
    s += `<text x="${W - pr}" y="${H - 3}" text-anchor="end" style="fill:var(--muted);font-size:10.5px">distância (km)</text><text x="4" y="${pt + 2}" style="fill:var(--muted);font-size:10.5px">m</text>`;
    series.forEach((ser) => {
      const d = ser.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.d).toFixed(1)},${Y(p.z).toFixed(1)}`).join('');
      s += `<path d="${d}" style="fill:none;stroke:${ser.c};stroke-width:2;stroke-linejoin:round"/>`;
    });
    return s + '</svg>';
  };
  const legend = (items) => `<div class="chips" style="margin-top:6px">${items.map(([c, t]) => `<span class="chip"><span class="swatch" style="background:${c}"></span>${e(t)}</span>`).join('')}</div>`;

  /* ---------- aba: síntese ---------- */
  V.sintese = function () {
    const S = B.state, R = S.R, D = S.D, a = S.aoi;
    const cf = B.coordFormats(a.lat, a.lon);
    const loc = R.local;
    const u = R.lito && R.lito.pontual && R.lito.pontual[0];
    const mac = R.macro && R.macro.unidades && R.macro.unidades[0];
    const alt = R.alt && R.alt.altitude;
    const subs = D.subs || [];
    // minerais industriais (quartzito, caulim, areia…) existem em quase toda parte: ficam fora do destaque principal
    const top = (D.models || []).filter((m) => m.ajust >= 0.22 && m.m.grupo !== 'industrial').slice(0, 4);
    const ind = (D.models || []).find((m) => m.m.grupo === 'industrial' && m.ajust >= 0.4);
    let lead = '';
    lead += loc && loc.municipio ? `Área em <b>${e(loc.municipio)}${loc.uf ? ' / ' + e(loc.uf) : ''}</b>${loc.pais && loc.cc !== 'br' ? ', ' + e(loc.pais) : ''}` : 'Área analisada';
    lead += alt != null ? `, a ${B.fmt(alt)} m de altitude` : '';
    if (u) lead += `, sobre <b>${e(u.sigla || '')} ${e(u.nome || '')}</b>${u.litotipos ? ' (' + e(u.litotipos.toLowerCase().split(',').slice(0, 4).join(',')) + ')' : ''}`;
    else if (mac) lead += `, sobre ${e(mac.lito || mac.nome)} (${e(mac.de)})`;
    lead += '. ';
    if (subs.length) lead += `Há registro de <b>${e(subs.slice(0, 4).map((x) => x.nome.toLowerCase()).join(', '))}</b> na área. `;
    if (top.length) lead += `O sistema mineral mais compatível com os dados é <b>${e(top[0].m.nome.toLowerCase())}</b> (${B.pct(top[0].ajust)}).`;
    let h = `<p class="lead">${lead}</p>`;
    h += kv([['Decimal (lat, lon)', `<span class="mono">${cf.dec}</span>`, 1], ['Graus, min, seg', `<span class="mono">${cf.dms}</span>`, 1], ['UTM (WGS84/SIRGAS)', `<span class="mono">${cf.utm}</span>`, 1], ['Área analisada', `${B.fmt(a.areaKm2, a.areaKm2 < 10 ? 1 : 0)} km² · ${a.tipo === 'ponto' ? 'raio de ' + B.km(a.raioKm) : a.tipo === 'poligono' ? 'polígono do arquivo' : 'faixa ao longo da linha'}`, 1]]);

    // situação legal
    let legal = '';
    if (ok('anm')) {
      const A = R.anm;
      const c = A.list.find((p) => p.contemCentro);
      legal = c ? `<div class="callout warn"><b>Ponto dentro de processo ANM:</b> ${e(c.processo)} — ${e(c.fase)} · ${e(c.subs)} · ${e(c.titular)}. ${B.tag('obs')}</div>`
        : `<div class="callout good"><b>Ponto central fora de processos ativos</b> no SIGMINE (${A.list.length} processo(s) tocam a área). Confirme no SIGMINE antes de requerer. ${B.tag('obs')}</div>`;
    } else legal = V.status('anm', true) || '';
    if (ok('restr') && R.restr.list.length) legal += `<div class="callout warn"><b>Restrições:</b> ${e(R.restr.list.map((r) => r.tipo + (r.nome !== r.tipo ? ' — ' + r.nome : '')).slice(0, 5).join('; '))}. ${B.tag('obs')}</div>`;
    h += sec('Situação legal', legal || '<p class="muted small">Disponível apenas para o Brasil.</p>');

    // minérios registrados
    let reg = '';
    if (subs.length) {
      reg = '<div class="chips">' + subs.slice(0, 14).map((x) => `<span class="chip ${x.sgb + x.mrds ? 'hot' : ''}" title="SGB ${x.sgb} · MRDS ${x.mrds} · ANM ${x.anm} · bateia ${x.bateia}">${e(x.nome)} <b>${x.total}</b></span>`).join('') + '</div>';
      reg += `<p class="xs muted" style="margin-top:6px">Contagem somada de ocorrências (SGB, USGS), processos ANM e minerais em concentrados de bateia dentro da área. ${B.tag('obs')}</p>`;
    } else reg = ['occ', 'anm', 'geoq'].some((k) => ['run', 'wait'].includes(S.status[k])) ? V.status('occ') : `<p class="muted small">Nenhum minério registrado nas bases consultadas para esta área. ${B.tag('unk')}</p>`;
    h += sec('Minérios registrados na área', reg);

    // potencial inferido
    let pot = '';
    if (D.models) {
      pot = (top.length ? top : D.models.slice(0, 3)).map((r) => `<div style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13.5px"><span><b>${e(r.m.nome)}</b>${r.obs ? ' <span class="chip hot" style="font-size:10.5px;padding:0 6px">registrado</span>' : ''}</span><span class="num">${B.pct(r.ajust)}</span></div><div class="bar" style="margin-top:4px"><i style="width:${B.pct(r.ajust)}"></i></div><div class="xs muted" style="margin-top:3px">${e(r.m.minerios.slice(0, 5).join(', '))} · confiança ${B.pct(r.conf)}</div></div>`).join('');
      if (ind) pot += `<p class="small" style="margin:0 0 8px"><b>Minerais industriais:</b> ${B.classePot(ind.ajust).toLowerCase()} (${B.pct(ind.ajust)}) — ${e(ind.m.minerios.slice(0, 4).join(', '))}.</p>`;
      pot += `<p class="xs muted">Pontuação de compatibilidade entre os dados e cada modelo de depósito. ${B.tag('inf')} <a href="#potencial" data-go="potencial">Ver todos os modelos</a></p>`;
    } else pot = '<p class="muted small"><span class="spinner"></span>Aguardando dados para pontuar os modelos…</p>';
    h += sec('Potencial inferido', pot);

    // cobertura
    const st = Object.values(S.status);
    const nOk = st.filter((x) => x === 'ok').length, nTot = st.length;
    const LT = S.ledgerAll();
    h += sec('Cobertura e evidências', `<div class="stats">${stat(nOk + '/' + nTot, 'fontes com dados')}${stat(LT.filter((x) => x.tipo === 'obs').length, 'observações')}${stat(LT.filter((x) => x.tipo === 'der').length, 'derivações')}${stat(LT.filter((x) => x.tipo === 'unk').length, 'lacunas')}</div><p class="xs muted">Cada afirmação desta análise é rotulada como observada, derivada, inferida ou desconhecida, com a fonte. Lacunas de dados não significam ausência de minério.</p>`);
    return h;
  };

  /* ---------- aba: geologia ---------- */
  V.geologia = function () {
    const R = B.state.R, D = B.state.D, a = B.state.aoi;
    let h = '';
    if (ok('lito')) {
      const L = R.lito;
      const u = L.pontual[0];
      let pt = kv([['Unidade', `${e(u.sigla || '')} — ${e(u.nome || '')}`, 1], ['Hierarquia', u.hierarquia], ['Unidade-mãe', u.pai], ['Litótipos', u.litotipos], ['Descrição da legenda', u.legenda], ['Idade', u.idadeMax != null ? `${B.fmt(u.idadeMin)} a ${B.fmt(u.idadeMax)} Ma` : null], ['Era / período', [u.eraMax, u.perMax].filter(Boolean).join(' · ')], ['Ambiente tectônico', u.ambiente], ['Mapa-fonte', u.mapa], ['Escala', u.escala]]);
      if (L.pontual.length > 1) pt += `<details class="more"><summary>Mesmo ponto em outras escalas (${L.pontual.length - 1})</summary>${L.pontual.slice(1).map((x) => `<p class="small" style="margin-top:6px"><b>${e(x.escala)}:</b> ${e(x.sigla)} — ${e(x.nome)}${x.litotipos ? ' · ' + e(x.litotipos) : ''}</p>`).join('')}</details>`;
      h += sec('Unidade no ponto ' + B.tag('obs'), pt);
      if (L.area.length) {
        const rows = L.area.map((x) => tr([`<span class="swatch" style="background:${x.cor || 'var(--surface-3)'}"></span><b>${e(x.sigla || '')}</b>`, `${e(x.nome || '')}<div class="xs muted">${e((x.litotipos || '').slice(0, 140))}</div>`, x.frac > 0.005 ? B.pct(x.frac) : '<1%', x.idadeMax != null ? `${B.fmt(x.idadeMin)}–${B.fmt(x.idadeMax)}` : '—'], ['', '', 'n', 'n']));
        h += sec('Unidades na área', tbl(['Sigla', 'Unidade e litótipos', 'Área', 'Ma'], rows, ['', '', 'n', 'n']) + `<p class="xs muted">Proporção por amostragem em grade de ${44 * 44} pontos; cores do mapa oficial do SGB (${e(L.escala)}). ${B.tag('der')}</p><div class="actions"><button class="btn btn-sm" data-ov="geo${L.pontual[0].k === '1000000' ? '1m' : L.pontual[0].k === '250000' ? '250' : '100'}">Mostrar mapa geológico</button></div>`);
      }
    } else h += sec('Litoestratigrafia (SGB)', V.status('lito') || '');
    if (ok('macro')) {
      const m = R.macro.unidades[0];
      h += sec('Mapa geológico global ' + B.tag('obs'), kv([['Unidade', m.nome], ['Litologia', m.lito], ['Idade', `${m.de}${m.ate && m.ate !== m.de ? ' a ' + m.ate : ''} (${B.fmt(m.idadeMin)}–${B.fmt(m.idadeMax)} Ma)`], ['Descrição', m.desc], ['Escala', m.escala]]) + '<p class="xs muted">Macrostrat — compilação global; útil fora do Brasil e como contexto regional.</p>');
    }
    if (ok('tect') || B.state.status.tect === 'empty') {
      const T = R.tect || {};
      h += sec('Contexto tectônico ' + B.tag('obs'), kv([['Domínio', T.ambiente], ['Ciclo', T.ciclo], ['Kimberlito mais próximo', T.kimberlitos && T.kimberlitos.length ? B.km(T.kimberlitos[0].dist) : 'nenhum em 120 km'], ['Zona de sutura mais próxima', T.suturaDist != null ? B.km(T.suturaDist) : null], ['Diques no entorno de 40 km', T.diquesN ? `${T.diquesN} (o mais próximo a ${B.km(T.diquesDist)})` : null]]));
    } else h += sec('Contexto tectônico', V.status('tect') || '');
    if (ok('estr')) {
      const E = R.estr;
      const tipos = Object.entries(E.tipos).sort((x, y) => y[1] - x[1]);
      const dom = E.rose.map((v, i) => [v, i]).sort((x, y) => y[0] - x[0])[0];
      const dirs = ['N–S', 'N10E', 'N20E', 'N30E', 'N40E', 'NE', 'N60E', 'N70E', 'N80E', 'E–W', 'N80W', 'N70W', 'N60W', 'NW', 'N40W', 'N30W', 'N20W', 'N10W'];
      let s = `<div class="stats">${stat(E.inAOI, 'traços na área')}${stat(E.nearest ? B.km(E.nearest.dist) : '—', 'estrutura mais próxima')}${stat(B.fmt(E.kmTotal, 0) + ' km', 'traços no entorno')}</div>`;
      s += `<figure class="figure">${V.rose(E.rose)}<figcaption>Roseta das direções dos traços estruturais no entorno (pétalas proporcionais ao comprimento). Direção dominante ≈ ${dirs[dom[1]]}. ${B.tag('der')}</figcaption></figure>`;
      if (tipos.length) s += tbl(['Tipo de estrutura na área', 'Traços'], tipos.map(([t, n]) => tr([e(t), n], ['', 'n'])), ['', 'n']);
      h += sec('Estruturas ' + B.tag('obs'), s + '<div class="actions"><button class="btn btn-sm" data-ov="estr">Mostrar estruturas do SGB no mapa</button></div>');
    } else h += sec('Estruturas', V.status('estr') || '');
    if (ok('aflora')) {
      const A = R.aflora.list;
      const card = (x) => `<li data-ll="${x.lat},${x.lon}" style="cursor:pointer"><div><b>${e(x.rochas || x.tipo || 'Afloramento')}</b> · <span class="muted small">${e(x.top || '')} · ${B.km(x.dist)}</span></div>${x.desc ? `<div class="small">${e(x.desc)}</div>` : ''}<div class="meta">${e([x.campo, x.geologo, x.data, x.projeto].filter(Boolean).join(' · '))}</div></li>`;
      h += sec(`Afloramentos descritos (${A.length}) ` + B.tag('obs'), `<ul class="ledger">${A.slice(0, 6).map(card).join('')}</ul>` + (A.length > 6 ? `<details class="more"><summary>Mais ${A.length - 6} afloramentos</summary><ul class="ledger" style="margin-top:8px">${A.slice(6, 80).map(card).join('')}</ul></details>` : ''));
    } else h += sec('Afloramentos', V.status('aflora') || '');
    return h;
  };

  /* ---------- aba: minérios ---------- */
  V.minerios = function () {
    const R = B.state.R, D = B.state.D;
    let h = '';
    const subs = D.subs || [];
    if (subs.length) h += sec('Substâncias registradas na área ' + B.tag('obs'), tbl(['Substância', 'SGB', 'USGS', 'ANM', 'Bateia', 'Mais próx.'], subs.map((x) => tr([`<b>${e(x.nome)}</b>${x.status.length ? `<div class="xs muted">${e(x.status.slice(0, 3).join(' · '))}</div>` : ''}`, x.sgb || '·', x.mrds || '·', x.anm || '·', x.bateia || '·', isFinite(x.dist) ? B.km(x.dist) : '—'], ['', 'n', 'n', 'n', 'n', 'n'])), ['', 'n', 'n', 'n', 'n', 'n']));
    if (ok('occ')) {
      const O = R.occ.list, na = O.filter((o) => o.naArea);
      const rows = (arr) => arr.map((o) => tr([`<span class="swatch" style="background:${B.map.cor(o.classe)}"></span><b>${e(o.subs.join(', '))}</b><div class="xs muted">${e(o.top || '')}${o.mun ? ' · ' + e(o.mun) : ''}</div>`, e(o.status || o.imp || '—'), e(o.host || o.encaixante || '—'), B.km(o.dist)], ['', '', '', 'n'], `data-ll="${o.lat},${o.lon}"`));
      let s = `<div class="stats">${stat(na.length, 'na área')}${stat(O.length, 'no entorno de ' + B.km(B.state.aoi.ctxKm))}${stat(B.uniq(na.flatMap((o) => o.subs)).length, 'substâncias na área')}</div>`;
      if (na.length) s += tbl(['Substância', 'Status', 'Hospedeira', 'Dist.'], rows(na.slice(0, 60)), ['', '', '', 'n']);
      else s += `<p class="muted small">Nenhuma dentro da área. As mais próximas:</p>` + tbl(['Substância', 'Status', 'Hospedeira', 'Dist.'], rows(O.slice(0, 8)), ['', '', '', 'n']);
      const cls = {};
      na.forEach((o) => (cls[o.classe || 'Não classificada'] = (cls[o.classe || 'Não classificada'] || 0) + 1));
      if (Object.keys(cls).length) s += legend(Object.entries(cls).map(([c, n]) => [B.map.cor(c), `${c} (${n})`]));
      h += sec('Ocorrências minerais — SGB ' + B.tag('obs'), s + '<p class="xs muted">Toque numa linha para localizar no mapa. Posições cadastradas por carta 1:250.000 podem ter centenas de metros de erro.</p>');
    } else h += sec('Ocorrências minerais — SGB', V.status('occ') || '');
    if (ok('mrds')) {
      const O = R.mrds.list;
      h += sec('USGS — Mineral Resources Data System ' + B.tag('obs'), tbl(['Nome', 'Substâncias', 'Situação', 'Dist.'], O.slice(0, 12).map((o) => tr([`${o.url ? `<a href="${e(o.url)}" target="_blank" rel="noopener">${e(o.nome || o.codes.join(' '))}</a>` : e(o.nome)}`, e(o.subs.join(', ')), e(o.status || '—'), B.km(o.dist)], ['', '', '', 'n'], `data-ll="${o.lat},${o.lon}"`)), ['', '', '', 'n']) + `<p class="xs muted">${R.mrds.naArea} registro(s) dentro da área, ${O.length} no entorno. Base mundial, atualizada até 2011.</p>`);
    } else h += sec('USGS MRDS', V.status('mrds') || '');
    if (ok('recmin')) {
      const O = R.recmin.list.slice(0, 8);
      h += sec('Depósitos com recurso mais próximos ' + B.tag('obs'), tbl(['Depósito', 'Substâncias / tipo', 'Situação', 'Dist.'], O.map((d) => tr([`<b>${e(d.nome)}</b><div class="xs muted">${e(d.dono || '')}</div>`, `${e(d.subs.join(', '))}<div class="xs muted">${e([d.tipo, d.porte, d.recurso].filter(Boolean).join(' · '))}</div>`, e(d.status || '—'), B.km(d.dist)], ['', '', '', 'n'], `data-ll="${d.lat},${d.lon}"`)), ['', '', '', 'n']));
    }
    if (ok('anm') || B.state.status.anm === 'empty') {
      const A = (R.anm && R.anm.list) || [];
      const fases = {};
      A.forEach((p) => (fases[p.fase] = (fases[p.fase] || 0) + 1));
      let s = A.length ? `<div class="chips" style="margin-bottom:6px">${Object.entries(fases).map(([f, n]) => `<span class="chip">${e(f)} <b>${n}</b></span>`).join('')}</div>` : '';
      s += A.length ? tbl(['Processo', 'Fase / substância', 'Titular', 'ha'], A.slice(0, 40).map((p) => tr([`<b class="mono">${e(p.processo)}</b>${p.contemCentro ? '<div class="xs" style="color:var(--hematite)">contém o centro</div>' : ''}`, `${e(p.fase)}<div class="xs muted">${e(p.subs || '')} · ${e(p.uso || '')}</div>`, `${e(p.titular || '')}<div class="xs muted">${e((p.evento || '').slice(0, 70))}</div>`, B.fmt(p.areaHa, 1)], ['', '', '', 'n'])), ['', '', '', 'n']) : '<p class="muted small">Nenhum processo minerário ativo toca a área.</p>';
      h += sec('Direitos minerários — ANM ' + B.tag('obs'), s + '<div class="actions"><button class="btn btn-sm" data-ov="anm">Mostrar todos os processos no mapa</button></div>');
    } else h += sec('Direitos minerários — ANM', V.status('anm') || '');
    if (ok('restr') || B.state.status.restr === 'empty') {
      const X = (R.restr && R.restr.list) || [];
      h += sec('Restrições territoriais ' + B.tag('obs'), X.length ? '<div class="chips">' + X.map((r) => `<span class="chip">${e(r.tipo)}${r.nome !== r.tipo ? ': ' + e(r.nome) : ''}</span>`).join('') + '</div>' : '<p class="muted small">Nenhuma restrição das camadas do SIGMINE intersecta a área.</p>');
    }
    return h;
  };

  /* ---------- aba: geoquímica ---------- */
  V.geoquimica = function () {
    const R = B.state.R, G = B.state.D.geochem;
    if (!ok('geoq')) return sec('Geoquímica exploratória', V.status('geoq') || empty('Sem dados', ''));
    const Q = R.geoq;
    const na = Q.amostras.filter((s) => s.naArea).length;
    let h = `<div class="stats">${stat(Q.amostras.length, 'amostras no entorno')}${stat(na, 'na área')}${stat(Object.keys(G.el).length, 'elementos')}${stat(G.ranking.filter((x) => x.anomAOI > 0).length, 'com anomalia na área')}</div>`;
    if (Q.truncado) h += '<div class="callout warn small">Algum lote atingiu o limite de 2.000 registros do servidor; parte das amostras pode ter ficado de fora.</div>';
    const rk = G.ranking.slice(0, 14);
    if (rk.length) {
      h += sec('Elementos mais anômalos na área ' + B.tag('der'), `<figure class="figure">${V.barsH(rk.map((x) => ({ l: `${x.e.toUpperCase()} · ${x.nome}`, v: x.razao, t: '×' + B.fmt(x.razao, x.razao < 10 ? 2 : 0), c: x.razao >= 1 ? 'var(--hematite)' : 'var(--accent)' })), { ref: 1, refLabel: 'limiar', label: 'Razão entre o máximo na área e o limiar regional' })}<figcaption>Razão entre o maior teor dentro da área e o limiar regional (mediana + 2 desvios absolutos, em log). Acima de 1 = anomalia.</figcaption></figure>`);
    } else h += '<p class="muted small">Não há amostras dentro da área; as estatísticas abaixo descrevem o entorno.</p>';
    const rows = Object.values(G.el).sort((a, b) => (b.razao || 0) - (a.razao || 0)).map((x) => tr([`<b>${x.e.toUpperCase()}</b> <span class="muted xs">${e(x.nome)}</span>`, `${x.nAOI}/${x.n}`, B.fmtSig(x.sum.med), x.thr ? B.fmtSig(x.thr.thr) : '—', x.aoiMax != null ? B.fmtSig(x.aoiMax) : '—', e(x.unit), x.anomAOI ? `<b style="color:var(--hematite)">${x.anomAOI}</b>` : x.anom ? `<span class="muted">${x.anom}*</span>` : '·'], ['', 'n', 'n', 'n', 'n', '', 'n'], x.anomAOI ? 'class="anom"' : ''));
    h += sec('Estatística por elemento ' + B.tag('der'), tbl(['Elemento', 'n área/entorno', 'Mediana', 'Limiar', 'Máx. área', 'Unid.', 'Anom.'], rows, ['', 'n', 'n', 'n', 'n', '', 'n']) + '<p class="xs muted">* anomalias só no entorno. Sedimento de corrente (fração &lt; 80#), digestão com água-régia e leitura ICP-OES/MS (SGB). Valores abaixo do limite de detecção entram como metade do limite.</p>');
    const C = G.concAOI;
    if (C && C.nEntorno) {
      const mins = Object.entries(C.mineraisEntorno).sort((a, b) => b[1] - a[1]);
      let s = `<div class="stats">${stat(C.n, 'concentrados na área')}${stat(C.comOuro, 'com pintas de ouro')}${stat(C.pintasEntorno, 'pintas no entorno')}</div>`;
      s += '<div class="chips">' + mins.map(([m, n]) => `<span class="chip ${C.minerais[m] ? 'hot' : ''}">${e(B.cap(m.replace(/_/g, ' / ')))} <b>${C.minerais[m] || 0}/${n}</b></span>`).join('') + '</div><p class="xs muted" style="margin-top:6px">Minerais pesados em concentrados de bateia: amostras na área / no entorno. Destacados os presentes na área.</p>';
      h += sec('Concentrados de bateia ' + B.tag('obs'), s);
    }
    h += '<div class="actions"><button class="btn btn-sm" data-act="geoq-map">Mostrar amostras no mapa</button></div>';
    return h;
  };

  /* ---------- aba: geofísica ---------- */
  V.geofisica = function () {
    const R = B.state.R, GF = B.state.D.geof || {};
    let h = '';
    if (ok('aero')) {
      h += sec('Aerolevantamentos que cobrem o ponto ' + B.tag('obs'), R.aero.list.map((p) => `<div class="callout small"><b>${e(p.titulo)}</b><div class="muted xs">${e([p.metodos, p.espLV && 'linhas a ' + p.espLV + ' m', p.dirLV && 'direção ' + p.dirLV, p.altura && 'voo a ' + p.altura + ' m', p.ano, p.contratante].filter(Boolean).join(' · '))}</div>${p.link ? `<a class="xs" href="${e(p.link)}" target="_blank" rel="noopener">Baixar dados do projeto no GeoSGB</a>` : ''}</div>`).join(''));
    } else if (B.state.status.aero !== 'ok') h += V.status('aero', true) || '';
    if (ok('geof')) {
      const imgs = R.geof.imgs;
      const card = (G) => {
        const im = imgs[G.id], st = GF[G.id];
        if (!im || im.erro || im.cobertura < 0.05) return '';
        let cap = '';
        if (st && st.tern) cap = st.centro ? `K ${B.pct(st.centro[0])} · eTh ${B.pct(st.centro[1])} · eU ${B.pct(st.centro[2])}` : 'sem dado no centro';
        else if (st) cap = st.centro != null ? `centro: ${st.nivel} (${B.pct(st.centro)})` : 'sem dado no centro';
        return `<div class="imgcard"><button type="button" data-ov="gf_${G.id}" title="Mostrar no mapa"><img alt="${e(G.nome)}" src="${im.blobUrl || ''}"><div class="cap">${e(G.curto)}<span>${e(cap)}</span></div></button></div>`;
      };
      h += sec('Mosaicos aerogeofísicos do SGB ' + B.tag('obs'), `<div class="imgrow">${B.GEOF.map(card).join('')}</div><p class="xs muted" style="margin-top:6px">Recorte da área com 1 raio de margem; o ponto central fica no meio de cada imagem. Toque para ver no mapa. Percentuais = posição na escala de cores nacional (≈ percentil), derivada da cor do pixel.</p>`);
      const tern = GF.tern;
      const bullets = [];
      if (tern && tern.centro) bullets.push(`<b>Ternário:</b> ${e(tern.classe)}.`);
      if (GF.k && GF.thk && GF.k.centro != null && GF.thk.centro != null) bullets.push(GF.k.centro >= 0.6 && GF.thk.centro <= 0.4 ? '<b>K alto com Th/K baixo:</b> assinatura compatível com alteração hidrotermal potássica (sericitização/feldspatização).' : `<b>K e Th/K:</b> K ${GF.k.nivel}, Th/K ${GF.thk.nivel}; sem assinatura clara de alteração potássica.`);
      if (GF.mag && GF.mag.centro != null) bullets.push(`<b>Magnetometria:</b> campo ${GF.mag.nivel} no centro (posição ${B.pct(GF.mag.rankCentro)} dentro da janela local). ${GF.mag.nivel === 'alto' ? 'Corpos ricos em magnetita (máficas, formações ferríferas, skarns) são candidatos.' : GF.mag.nivel === 'baixo' ? 'Pode refletir rochas pobres em magnetita ou destruição de magnetita por alteração.' : ''}`);
      if (GF.asa && GF.asa.centro != null) bullets.push(`<b>Sinal analítico:</b> ${GF.asa.nivel} — ${GF.asa.nivel === 'alto' ? 'bordas de fontes magnéticas próximas (contatos, falhas).' : 'longe de bordas magnéticas fortes.'}`);
      if (bullets.length) h += sec('Leitura das assinaturas ' + B.tag('der'), `<ul class="small" style="margin:0;padding-left:18px;display:grid;gap:5px">${bullets.map((b) => `<li>${b}</li>`).join('')}</ul>`);
    } else h += sec('Mosaicos aerogeofísicos', V.status('geof') || '');
    if (ok('emag')) {
      const E = R.emag;
      h += sec('Anomalia magnética global — EMAG2v3 ' + B.tag('obs'), `<div class="stats">${stat(B.fmt(E.centro, 1) + ' nT', 'no centro')}${stat(B.fmt(E.st.min, 0) + ' a ' + B.fmt(E.st.max, 0), 'nT na janela')}${stat(B.fmt(E.centro - E.st.med, 1), 'nT acima da mediana local')}</div><p class="xs muted">Grade de 2 minutos de arco (≈ 3,7 km), continuada para 4 km de altitude: serve para o contexto regional, não para alvos pequenos.</p><div class="actions"><button class="btn btn-sm" data-ov="emag">Mostrar EMAG2 no mapa</button></div>`);
    } else h += V.status('emag', true) || '';
    if (ok('grav')) {
      const Gr = R.grav.list, sb = B.stats.summary(Gr.map((s) => s.bouguer));
      h += sec('Gravimetria terrestre ' + B.tag('obs'), `<div class="stats">${stat(Gr.length, 'estações')}${stat(B.fmt(Gr[0].bouguer, 1), 'mGal na mais próxima')}${stat(B.fmt(sb.min, 0) + ' a ' + B.fmt(sb.max, 0), 'mGal no entorno')}</div>` + tbl(['Dist.', 'Altitude (m)', 'Ar livre (mGal)', 'Bouguer (mGal)'], Gr.slice(0, 6).map((s) => tr([B.km(s.dist), B.fmt(s.alt, 0), B.fmt(s.ar, 1), B.fmt(s.bouguer, 1)], ['n', 'n', 'n', 'n'], `data-ll="${s.lat},${s.lon}"`)), ['n', 'n', 'n', 'n']));
    } else h += V.status('grav', true) || '';
    return h || empty('Sem geofísica', 'Nenhuma base geofísica respondeu para esta área.');
  };

  /* ---------- aba: relevo ---------- */
  V.relevo = function () {
    const R = B.state.R, T = B.state.D.terrain;
    let h = '';
    if (!T) return sec('Relevo', V.status('dem') || empty('Sem relevo', ''));
    const alt = R.alt && R.alt.altitude;
    h += `<div class="stats">${stat(B.fmt(alt != null ? alt : T.centro) + ' m', 'altitude no centro')}${stat(B.fmt(T.ez.min) + '–' + B.fmt(T.ez.max), 'm na área')}${stat(B.fmt(T.ez.max - T.ez.min) + ' m', 'amplitude')}${stat(B.fmt(T.es.mean, 1) + '°', 'declividade média')}</div>`;
    h += `<div class="actions"><button class="btn btn-primary btn-sm" data-act="v3d">Abrir bloco 3D</button></div>`;
    const cards = [['relevo', 'Relevo sombreado', 'hipsometria + sombra NW'], ['declive', 'Declividade', 'Horn, 0–35°'], ['drenagem', 'Drenagem', 'acumulação de fluxo D8']].map(([k, t, c]) => `<div class="imgcard"><button type="button" data-local="t_${k}"><img alt="${t}" src="${B.state.D.terrainURLs[k]}"><div class="cap">${t}<span>${c}</span></div></button></div>`).join('');
    h += sec('Modelos derivados do relevo ' + B.tag('der'), `<div class="imgrow">${cards}</div><p class="xs muted" style="margin-top:6px">Toque numa imagem para sobrepor ao mapa. A drenagem ajuda a ligar anomalias de sedimento de corrente às bacias de origem.</p>`);
    h += sec('Perfis pelo centro ' + B.tag('der'), `<figure class="figure">${V.profile([{ pts: T.perfis.we, c: 'var(--s1)' }, { pts: T.perfis.ns, c: 'var(--s2)' }])}${legend([['var(--s1)', 'Oeste → Leste'], ['var(--s2)', 'Norte → Sul']])}</figure>`);
    const dn = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const tot = T.dirs.reduce((a, b) => a + b, 0) || 1;
    h += sec('Orientação das encostas', `<figure class="figure">${V.barsH(T.dirs.map((v, i) => ({ l: 'voltadas para ' + dn[i], v: v / tot, t: B.pct(v / tot) })), { padL: 120, label: 'orientação das encostas' })}</figure>`);
    return h;
  };

  /* ---------- aba: espectral ---------- */
  V.espectral = function () {
    const R = B.state.R, SP = B.state.D.spectral;
    if (!ok('s2')) return sec('Sentinel-2', V.status('s2') || empty('Sem imagem', 'Nenhuma cena disponível.'));
    if (!SP) return '<p class="muted small"><span class="spinner"></span>Calculando índices…</p>';
    const it = R.s2.item;
    let h = `<div class="stats">${stat(it.data.split('-').reverse().join('/'), 'data da cena')}${stat(B.fmt(it.nuvem, 1) + '%', 'nuvens na cena')}${stat(B.pct(SP.vegFrac), 'da área com vegetação densa')}</div>`;
    if (SP.vegFrac > 0.5) h += '<div class="callout warn small">Mais da metade da área está coberta por vegetação densa (NDVI ≥ 0,35); os índices minerais valem só nas porções expostas.</div>';
    const card = (k, t, c) => SP.canvases[k] ? `<div class="imgcard"><button type="button" data-local="s_${k}"><img alt="${e(t)}" src="${B.state.D.spectralURLs[k]}"><div class="cap">${e(t)}<span>${e(c)}</span></div></button></div>` : '';
    h += sec('Imagens ' + B.tag('obs'), `<div class="imgrow">${card('rgb', 'Cor verdadeira', 'B04 B03 B02')}${card('razoes', 'Composição de razões', 'R B11/B12 · G B04/B02 · B B08/B11')}</div>`);
    h += sec('Índices minerais ' + B.tag('der'), `<div class="imgrow">${B.INDICES.map((I) => card(I.id, I.nome, I.formula + (SP.stats[I.id] ? ' · P95 ' + B.fmt(SP.stats[I.id].p95, 2) : ''))).join('')}</div>`);
    h += tbl(['Índice', 'Alvo', 'Mediana', 'P95'], B.INDICES.map((I) => { const s = SP.stats[I.id]; return tr([`<b>${e(I.nome)}</b><div class="xs muted mono">${e(I.formula)}</div>`, `<span class="small">${e(I.alvo)}</span>`, s ? B.fmt(s.med, 2) : '—', s ? B.fmt(s.p95, 2) : '—'], ['', '', 'n', 'n']); }), ['', '', 'n', 'n']);
    h += '<p class="xs muted">Estatística calculada só sobre pixels da área com NDVI &lt; 0,35. Razões de banda indicam grupos de minerais na superfície (óxidos de ferro, argilominerais), não teores; confirme em campo.</p>';
    return h;
  };

  /* ---------- aba: potencial ---------- */
  V.potencial = function () {
    const M = B.state.D.models;
    if (!M) return '<p class="muted small"><span class="spinner"></span>Aguardando dados…</p>';
    let h = `<p class="small">Cada modelo de depósito reúne as evidências que um geólogo de exploração procuraria: litologia hospedeira, ocorrências conhecidas, geoquímica de indicadores, estruturas, assinaturas geofísicas e espectrais. A pontuação é a média ponderada das evidências disponíveis, ajustada pela confiança (fração do peso que tinha dados). ${B.tag('inf')}</p>`;
    h += M.map((r) => {
      const icon = (s) => (s == null ? ['?', 'u'] : s >= 0.66 ? ['●', 'y'] : s >= 0.3 ? ['◐', 'p'] : ['○', 'n']);
      const ev = r.ev.map((x) => { const [c, k] = icon(x.s); return `<li><span class="ic ${k}" aria-hidden="true">${c}</span><span><b>${e(B.EV_LABEL[x.tipo])}</b> — ${e(x.nota)}</span><span class="w">${x.s == null ? '—' : B.fmt(x.s * 100, 0)} · p${B.fmt(x.w, 1)}</span></li>`; }).join('');
      return `<article class="model"><div class="model-top"><div><div class="model-name">${e(r.m.nome)}${r.obs ? ' <span class="chip hot" style="font-size:10.5px;padding:0 6px">ocorrência registrada</span>' : ''}${r.m.grupo === 'industrial' ? ' <span class="chip" style="font-size:10.5px;padding:0 6px">uso industrial</span>' : ''}</div><div class="model-sub">${e(r.m.sub)}</div></div><div class="model-score">${B.fmt(r.ajust * 100, 0)}<small>%</small></div></div><div class="bars"><span>Potencial</span><div class="bar"><i style="width:${B.pct(r.ajust)}"></i></div><span class="num">${B.classePot(r.ajust)}</span><span>Confiança</span><div class="bar conf"><i style="width:${B.pct(r.conf)}"></i></div><span class="num">${B.pct(r.conf)}</span></div><div class="xs muted">Minérios esperados: ${e(r.m.minerios.join(', '))}</div><details class="more"><summary>Evidências (${r.ev.filter((x) => x.s != null).length}/${r.ev.length} com dados)</summary><ul class="ev-list">${ev}</ul></details></article>`;
    }).join('');
    h += '<p class="xs muted">● favorável · ◐ parcial · ○ desfavorável · ? sem dados. “p” é o peso da evidência no modelo. Os pesos seguem a literatura de sistemas minerais e podem ser calibrados com depósitos conhecidos.</p>';
    return h;
  };

  /* ---------- aba: evidências ---------- */
  V.evidencias = function () {
    const S = B.state, all = S.ledgerAll(), f = S.ledgerFilter || 'todos';
    const counts = { todos: all.length };
    Object.keys(B.TIPOS).forEach((k) => (counts[k] = all.filter((x) => x.tipo === k).length));
    let h = `<div class="filters" role="group" aria-label="Filtrar evidências">${[['todos', 'Todas'], ['obs', 'Observadas'], ['der', 'Derivadas'], ['inf', 'Inferidas'], ['unk', 'Lacunas']].map(([k, t]) => `<button type="button" data-lf="${k}" aria-pressed="${f === k}">${t} ${counts[k]}</button>`).join('')}</div>`;
    const list = all.filter((x) => f === 'todos' || x.tipo === f);
    h += `<ul class="ledger">${list.map((x) => `<li>${B.tag(x.tipo)} <span class="xs muted">${e(x.tema)}</span><div style="margin-top:4px">${e(x.texto)}</div><div class="meta">${x.url ? `<a href="${e(x.url)}" target="_blank" rel="noopener">${e(x.fonte)}</a>` : e(x.fonte)}${x.escala ? ' · escala ' + e(x.escala) : ''}${x.ref ? ' · ' + e(x.ref) : ''}</div></li>`).join('')}</ul>`;
    const rows = B.PROVIDERS.map((p) => { const st = S.status[p.id]; const lbl = { ok: 'com dados', empty: 'sem registros', err: 'erro', off: 'fora da cobertura', run: 'consultando', wait: 'na fila' }[st] || '—'; return tr([`<b>${e(p.nome)}</b>`, e(p.fonte), `<span class="src" data-s="${st === 'wait' ? 'run' : st}"><i></i>${lbl}</span>${S.errors[p.id] ? `<div class="xs muted">${e(S.errors[p.id])}</div>` : ''}`, S.times[p.id] ? B.fmt(S.times[p.id] / 1000, 1) + ' s' : '—'], ['', '', '', 'n']); });
    h += sec('Cobertura por fonte', tbl(['Fonte', 'Instituição', 'Situação', 'Tempo'], rows, ['', '', '', 'n']));
    return h;
  };
})();

/* Bateia — bloco 3D (inspirado na cena 3D do Leapfrog): relevo real com cobertura
   intercambiável (satélite, geologia SGB, aerogeofísica, derivados) e ocorrências em pinos. */
(function () {
  'use strict';
  const B = window.B;
  const V3 = (B.v3d = {});
  let renderer, scene, camera, controls, terrain, walls, pinsGroup, outline, raf, ro, ctx;
  const texCache = new Map();

  V3.drapes = function () {
    const S = B.state, D = S.D, out = [['sat', 'Satélite (Esri)'], ['relevo', 'Relevo sombreado'], ['declive', 'Declividade']];

  async function texture(key) {

  function heightAt(dem, i, j) { return dem.grid[i * dem.nx + j]; }

  function build() {

    const pos = geo.attributes.position;

    const top = [], bot = [], left = [], right = [];

      const h = 3.2;

    });

  }

  function clear() {
    [terrain, walls, outline, pinsGroup].forEach((o) => { if (!o) return; scene.remove(o); o.traverse && o.traverse((x) => { if (x.geometry) x.geometry.dispose(); if (x.material && x.material !== terrain?.material) x.material.dispose && x.material.dispose(); }); });

  async function applyDrape(key) {

      const tex = await texture(key);

    } catch (e) { B.toast('Não foi possível carregar essa cobertura: ' + e.message); }
  }

  V3.open = async function () {

    const box = B.$('#viewer3d');
    box.hidden = false;

        ray.setFromCamera(mouse, camera);
        const hit = ray.intersectObjects(pinsGroup.children).find((h) => h.object.userData.tip);
        if (hit) { tip.innerHTML = hit.object.userData.tip; tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 10 + 'px'; tip.hidden = false; } else tip.hidden = true;
      });
      ro = new ResizeObserver(() => { const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); });

    }

      clear(); build();
      const sel = B.$('#v3dDrape');
      sel.innerHTML = V3.drapes().map(([k, t]) => `<option value="${k}">${B.esc(t)}</option>`).join('');

  /* modelo de elevação (AWS Terrain Tiles) para uma janela qualquer */
  async function demSampler(bb, res) {
    const lat0 = (bb[1] + bb[3]) / 2;
    let z = B.clamp(Math.round(Math.log2((156543.03 * Math.cos(lat0 * rad)) / res)), 5, 14);
    const tx = (lo, zz) => ((lo + 180) / 360) * 2 ** zz;
    const ty = (la, zz) => ((1 - Math.log(Math.tan(la * rad) + 1 / Math.cos(la * rad)) / Math.PI) / 2) * 2 ** zz;
    let x0, x1, y0, y1;
    for (;;) {
      x0 = Math.floor(tx(bb[0], z)); x1 = Math.floor(tx(bb[2], z)); y0 = Math.floor(ty(bb[3], z)); y1 = Math.floor(ty(bb[1], z));
      if ((x1 - x0 + 1) * (y1 - y0 + 1) <= 30 || z <= 5) break;
      z--;
    }
    const cw = (x1 - x0 + 1) * 256, ch = (y1 - y0 + 1) * 256;
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const g = cv.getContext('2d', { willReadFrequently: true });
    const tiles = [];
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) tiles.push([x, y]);
    const r = await B.pool(tiles, 6, async ([x, y]) => {
      const blob = await B.fetchBlob(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`, { timeout: 20000 });
      g.drawImage(await createImageBitmap(blob), (x - x0) * 256, (y - y0) * 256);
    });
    if (r.every((v) => v && v.__err)) throw new Error('o modelo de elevação não respondeu');
    const px = g.getImageData(0, 0, cw, ch).data;
    const at = (X, Y) => { const o = (Y * cw + X) * 4; return px[o] * 256 + px[o + 1] + px[o + 2] / 256 - 32768; };
    const sample = (la, lo) => {
      const X = (tx(lo, z) - x0) * 256 - 0.5, Y = (ty(la, z) - y0) * 256 - 0.5;
      const xa = B.clamp(Math.floor(X), 0, cw - 2), ya = B.clamp(Math.floor(Y), 0, ch - 2), fx = B.clamp(X - xa, 0, 1), fy = B.clamp(Y - ya, 0, 1);
      return at(xa, ya) * (1 - fx) * (1 - fy) + at(xa + 1, ya) * fx * (1 - fy) + at(xa, ya + 1) * (1 - fx) * fy + at(xa + 1, ya + 1) * fx * fy;
    };
    return { sample, z, res: (156543.03 * Math.cos(lat0 * rad)) / 2 ** z };
  }
