      if (o === undefined) oc = wait('Procurando ocorrências cadastradas…');
      else if (o.__err) oc = falha(o.__err, 'Cadastro de ocorrências');
      else if (!o.list.length) oc = `<p class="muted small">Nenhuma ocorrência cadastrada num raio de 10 km. Isso não prova ausência de minério. ${B.tag('unk')}</p>`;
      else {
        const n0 = o.list[0], cont = {};
        o.list.forEach((v) => v.subs.forEach((s) => (cont[s] = (cont[s] || 0) + 1)));
        oc = `<p class="small"><b>${E(n0.subs.join(', '))}</b> ${onde(n0)}${util(n0.status) ? ' — ' + E(n0.status) : ''}${n0.top ? ` (${E(n0.top)})` : ''}.</p>`;
        oc += `<p class="xs muted">${o.list.length} ocorrência(s) em 10 km: ${E(Object.entries(cont).sort((p, q) => q[1] - p[1]).slice(0, 5).map(([s, n]) => `${s} (${n})`).join(', '))}.</p><a href="#" class="small" data-act="occ">Ver lista e mapa</a>`;
      }
      x += h.sec('Ocorrência mais próxima', oc);
      // imagem de satélite
      const im = st.img;
      let ig = im === undefined ? wait('Consultando a data da imagem…') : im && !im.__err
        ? h.kv([['Satélite Esri', `<b>${E(im.data)}</b>${im.resTxt ? ' · ' + E(im.resTxt) + ' por pixel' : ''}${im.fonte ? ' · ' + E(im.fonte) : ''}`, 1], ['Idade', idade(im.dt)]])
        : '<p class="muted small">A Esri não informou a data da imagem neste ponto.</p>';
      ig += `<div class="actions">${btn('gsat', 'Ver no Google Maps')}${btn('gearth', 'Google Earth')}${B.map.googleDefs[B.map.base] ? '' : btn('gkey', 'Usar o Google no mapa')}</div>`;
      x += h.sec('Imagem de satélite', ig);
      x += rodape(lat, lon, 'local');
      setBody(t, x);
    };
    Object.assign(cur.acts, {
      gsat: () => abrir(`https://www.google.com/maps/@?api=1&map_action=map&center=${lat.toFixed(6)},${lon.toFixed(6)}&zoom=18&basemap=satellite`),
      gearth: () => abrir(`https://earth.google.com/web/search/${lat.toFixed(6)},${lon.toFixed(6)}`),
      gkey: () => C.chaveGoogle('Google — satélite'),
    });
    const run = (k, p) => p.then((v) => { st[k] = v; }, (e) => { st[k] = { __err: e }; }).then(draw);
    draw();
    run('img', B.map.imagemEsri(lat, lon));
    run('lugar', lugar(lat, lon));
    run('alt', altitude(lat, lon));
    if (br) { run('lito', litoNoPonto(lat, lon).then((r) => { if (!r.length) run('macro', macroNoPonto(lat, lon)); return r; })); run('anm', anmNoPonto(lat, lon)); }
    else run('macro', macroNoPonto(lat, lon));
    if (sa) run('tect', tectNoPonto(lat, lon).catch(() => null));
    run('occ', occPerto(lat, lon, 10));
  }

  /* 2. Informações da ANM */
  function showProc(p) {
    tmp.clearLayers();
    if (menuLL) L.circleMarker(menuLL, { radius: 6, color: '#fff', weight: 2, fillColor: css('--accent'), fillOpacity: 1, interactive: false }).addTo(tmp);
    const pl = L.polygon(p.rings, { color: css('--ochre'), weight: 2.4, fillOpacity: 0.18, interactive: false }).addTo(tmp);
    fit(pl.getBounds(), 17);
  }
  const procKml = (p) => kml('Processo ' + p.processo, p.rings.map((r, i) => kmlPoly(`${p.processo}${p.rings.length > 1 ? ' (' + (i + 1) + ')' : ''}`, r, [p.fase, p.subs, p.titular, p.areaHa != null ? B.fmt(p.areaHa, 2) + ' ha' : ''].filter(Boolean).join(' · '))).join(''));
  async function fichaANM(lat, lon) {
    const t = openInsp('Informações da ANM', 'Consultando o SIGMINE…', coordLine(lat, lon));
    pin(lat, lon);
    menuLL = [lat, lon];
    const procs = [];
    cur = { acts: Object.assign(commonActs(lat, lon), {
      ver: (el) => showProc(procs[+el.dataset.i]),
      kml: (el) => { const p = procs[+el.dataset.i]; B.download(`processo-${B.slug(p.processo)}.kml`, procKml(p), 'application/vnd.google-earth.kml+xml'); },
      sdm: () => abrir('https://sdm.anm.gov.br'),
    }) };
    if (!B.maybeBrazil(lat, lon)) { setTitle(t, 'Fora do Brasil'); setBody(t, '<p class="small">O SIGMINE da ANM cobre apenas o território brasileiro.</p>' + rodape(lat, lon, 'anm')); return; }
    const [ra, rr] = await Promise.allSettled([anmNoPonto(lat, lon), restrNoPonto(lat, lon)]);
    if (!live(t)) return;
    const h = H();
    let x = '';
    if (ra.status === 'rejected') { setTitle(t, 'SIGMINE indisponível'); x += falha(ra.reason, 'SIGMINE'); }
    else {
      const { dentro, perto } = ra.value;
      const card = (p, i, extra) => {
        procs[i] = p;
        return `<div class="proc">${h.kv([
          ['Processo', `<b class="mono">${E(p.processo)}</b> ${cpy(p.processo)}`, 1], ['Fase', p.fase], ['Substância', p.subs], ['Uso', p.uso], ['Titular', p.titular],
          ['Área', p.areaHa != null ? B.fmt(p.areaHa, 2) + ' ha' : null], ['Ano', p.ano], ['Último evento', p.evento], ['UF', p.uf], extra,
        ])}<div class="actions">${btn('ver', 'Mostrar no mapa', 0, `data-i="${i}"`)}${btn('kml', 'Baixar polígono (KML)', 0, `data-i="${i}"`)}</div></div>`;
      };
      if (dentro.length) {
        setTitle(t, dentro.length === 1 ? 'Dentro de 1 processo ativo' : `Dentro de ${dentro.length} processos ativos`);
        x += h.sec('Processo no ponto ' + B.tag('obs'), dentro.map((p, i) => card(p, i)).join(''));
      } else {
        setTitle(t, 'Fora de processos ativos');
        x += `<div class="callout good small">Nenhum processo ativo do SIGMINE contém este ponto. Isso <b>não garante área livre</b>: requerimentos recentes podem ainda não estar no mapa. Confira no SDM da ANM antes de requerer.</div>`;
        x += h.sec('Processos mais próximos (até 2 km) ' + B.tag('obs'), perto.length ? perto.map((p, i) => card(p, i, ['Distância', B.km(p.dist) + ' até o limite'])).join('') : '<p class="muted small">Nenhum processo ativo num raio de 2 km.</p>');
      }
    }
    if (rr.status === 'fulfilled') {
      const r = rr.value;
      x += h.sec('Restrições no ponto ' + B.tag('obs'), r.list.length
        ? `<div class="chips">${r.list.map((v) => `<span class="chip">${E(v.tipo)}${v.nome !== v.tipo ? ': ' + E(v.nome) : ''}${v.raio ? ` <b>${B.fmt(v.raio * 1000, 0)} m</b>` : ''}</span>`).join('')}</div>`
        : `<p class="small">Nenhuma unidade de conservação, terra indígena, território quilombola, área urbana, bloqueio ou reserva garimpeira neste ponto, e nenhuma caverna ou sítio arqueológico a menos de 300 m (${r.ok} de ${r.total} camadas consultadas).</p>`);
    }
    x += `<div class="actions">${btn('camada', 'Ligar camada de processos', 0, 'data-ov="anm"')}${btn('sdm', 'Abrir o SDM da ANM')}</div>`;
    x += `<p class="xs muted">SIGMINE (ANM) consultado em ${E(new Date().toLocaleString('pt-BR'))}. A situação dos processos muda diariamente.</p>`;
    x += rodape(lat, lon, 'anm');
    setBody(t, x);
  }

  /* 3. Coordenadas e cartografia */
  function fichaCoord(lat, lon) {
    const t = openInsp('Coordenadas e cartografia', dec(lat, lon), 'WGS 84 ≈ SIRGAS 2000');
    pin(lat, lon);
    const { u, mc, conv, k } = C.utmExtra(lat, lon);
    const mg = C.mgrs(lat, lon), fol = C.folhas(lat, lon);
    const utmTxt = `${u.zone}${u.band} ${Math.round(u.E)} ${Math.round(u.N)}`;
    const ponto = { nome: 'Ponto ' + dec(lat, lon), lat, lon };
    cur = { acts: Object.assign(commonActs(lat, lon), {
      folha: (el) => { const f = fol[+el.dataset.i]; tmp.clearLayers(); pin(lat, lon); const rc = L.rectangle([[f.bbox[1], f.bbox[0]], [f.bbox[3], f.bbox[2]]], { color: css('--violet'), weight: 2, fillOpacity: 0.06, interactive: false }).addTo(tmp); fit(rc.getBounds(), 15); B.toast(`Folha ${f.cod} (${f.esc})`); },
      gpx: () => B.download(`ponto_${lat.toFixed(5)}_${lon.toFixed(5)}.gpx`, gpx([ponto]), 'application/gpx+xml'),
      kmlpt: () => B.download(`ponto_${lat.toFixed(5)}_${lon.toFixed(5)}.kml`, kml('Ponto Bateia', kmlPt(ponto)), 'application/vnd.google-earth.kml+xml'),
      tudo: () => copy(cur.texto),
    }) };
    const linhas = [
      ['Decimal (lat, lon)', dec(lat, lon), dec(lat, lon)],
      ['Latitude', `${B.fmt(Math.abs(lat), 6)}° ${lat < 0 ? 'S' : 'N'}`, lat.toFixed(6)],
      ['Longitude', `${B.fmt(Math.abs(lon), 6)}° ${lon < 0 ? 'W' : 'E'}`, lon.toFixed(6)],
      ['Graus, min, seg', `${DMS(lat, 'N', 'S')} ${DMS(lon, 'E', 'W')}`, `${DMS(lat, 'N', 'S')} ${DMS(lon, 'E', 'W')}`],
      ['Graus e minutos (GPS)', `${ddm(lat, 'N', 'S')} ${ddm(lon, 'E', 'W')}`, `${ddm(lat, 'N', 'S')} ${ddm(lon, 'E', 'W')}`],
      ['UTM', utmTxt, utmTxt],
      ['UTM — Este (E)', B.fmt(u.E, 1) + ' m', u.E.toFixed(1)],
      ['UTM — Norte (N)', B.fmt(u.N, 1) + ' m', u.N.toFixed(1)],
      ['Zona / hemisfério', `${u.zone}${u.band} · ${u.south ? 'Sul' : 'Norte'} · MC ${Math.abs(mc)}° ${mc < 0 ? 'W' : 'E'}`, null],
      ['MGRS', mg || '—', mg],
      ['Convergência meridiana', dmsAng(conv), conv.toFixed(5)],
      ['Fator de escala (UTM)', B.fmt(k, 6), k.toFixed(6)],
    ];
    const draw = (alt) => {
      const h = H();
      let x = `<table class="ctab">${linhas.map(([a, b, c]) => crow(a, E(b), c)).join('')}${crow('Altitude', alt === undefined ? '…' : alt == null ? '—' : B.fmt(alt, 0) + ' m', alt != null && alt !== undefined ? String(Math.round(alt)) : null)}</table>`;
      x += '<p class="xs muted" style="margin-top:6px">Convergência = ângulo do Norte de quadrícula (UTM) para o Norte verdadeiro. Datum WGS 84, equivalente ao SIRGAS 2000 na precisão de GPS de mão.</p>';
      const S = B.state;
      if (S && S.aoi) {
        const d = B.geo.dist(S.aoi.lat, S.aoi.lon, lat, lon), az = B.geo.bearing(S.aoi.lat, S.aoi.lon, lat, lon);
        x += `<p class="small"><span class="muted">Do centro da análise atual:</span> ${B.km(d)}, azimute ${B.fmt(az, 0)}° (${rumo(az)}).</p>`;
      }
      if (fol.length) x += h.sec('Folhas topográficas (articulação IBGE)', `<table class="ctab">${fol.map((f, i) => `<tr data-act="folha" data-i="${i}" title="Mostrar a folha no mapa"><td>${E(f.esc)}</td><td class="v">${E(f.cod)}</td><td class="c">${cpy(f.cod)}</td></tr>`).join('')}</table><p class="xs muted">Toque numa escala para ver o limite da folha no mapa.</p>`);
      x += `<div class="actions">${btn('tudo', 'Copiar tudo')}${btn('gpx', 'Baixar GPX (GPS)')}${btn('kmlpt', 'Baixar KML')}</div>`;
      x += rodape(lat, lon, 'coord');
      cur.texto = linhas.map(([a, b]) => `${a}: ${b}`).concat(alt != null && alt !== undefined ? [`Altitude: ${Math.round(alt)} m`] : []).concat(fol.map((f) => `Folha ${f.esc}: ${f.cod}`)).join('\n');
      setBody(t, x);
    };
    draw(undefined);
    altitude(lat, lon).then(draw, () => draw(null));
  }

  /* 4. Ocorrências minerais próximas */
  async function fichaOcc(lat, lon, km) {
    const t = openInsp('Ocorrências minerais próximas', `Raio de ${km} km`, coordLine(lat, lon));
    pin(lat, lon);
    let list = [];
    cur = { acts: Object.assign(commonActs(lat, lon), {
      raio: (el) => fichaOcc(lat, lon, +el.dataset.km),
      ir: (el) => { const o = list[+el.dataset.i]; map.setView([o.lat, o.lon], Math.max(map.getZoom(), 14)); },
    }) };
    const [ro, rd] = await Promise.allSettled([occPerto(lat, lon, km), B.maybeBrazil(lat, lon) ? depositos(lat, lon) : Promise.resolve([])]);
    if (!live(t)) return;
    const h = H();
    let x = `<div class="chips" role="group" aria-label="Raio">${[5, 10, 20, 50].map((k) => `<button type="button" class="chip${k === km ? ' hot' : ''}" data-act="raio" data-km="${k}">${k} km</button>`).join('')}</div>`;
    if (ro.status === 'rejected') x += falha(ro.reason, 'Cadastro de ocorrências');
    else {
      list = ro.value.list;
      tmp.clearLayers(); pin(lat, lon);
      L.circle([lat, lon], { radius: km * 1000, color: css('--accent'), weight: 1.5, dashArray: '5 5', fill: false, interactive: false }).addTo(tmp);
      list.slice(0, 500).forEach((o, i) => L.circleMarker([o.lat, o.lon], { radius: 6, color: '#fff', weight: 1.2, fillColor: o.classe ? B.map.cor(o.classe) : '#fff', fillOpacity: 0.95, bubblingMouseEvents: false }).bindTooltip(`${i + 1}. ${o.subs.join(', ')} — ${B.km(o.dist)}`).addTo(tmp));
      fit(L.latLngBounds(list.slice(0, 500).map((o) => [o.lat, o.lon]).concat([[lat, lon]])).extend(L.latLng(lat, lon).toBounds(km * 2000)), 14);
      setTitle(t, `${list.length} ocorrência(s) num raio de ${km} km`);
      const cont = {};
      list.forEach((o) => o.subs.forEach((s) => (cont[s] = (cont[s] || 0) + 1)));
      if (list.length) {
        x += `<div class="chips" style="margin:8px 0">${Object.entries(cont).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([s, n]) => `<span class="chip">${E(s)} <b>${n}</b></span>`).join('')}</div>`;
        x += `<ol class="olist">${list.slice(0, 40).map((o, i) => `<li data-act="ir" data-i="${i}"><span class="d">${distRumo(o)}</span><b>${i + 1}. ${E(o.subs.join(', '))}</b><div class="xs muted">${E([o.status, o.imp, o.top, o.mun].filter(util).join(' · '))}${o.host ? '<br>Hospedeira: ' + E(o.host) : ''}</div></li>`).join('')}</ol>`;
        if (list.length > 40) x += `<p class="xs muted">Mostrando as 40 mais próximas de ${list.length}.</p>`;
      } else x += `<p class="muted small" style="margin-top:8px">Nenhuma ocorrência cadastrada neste raio. Ausência de cadastro não é ausência de minério. ${B.tag('unk')}</p>`;
      x += `<p class="xs muted">Fonte: ${E(ro.value.fonte)}. Distância e rumo a partir do ponto marcado.</p>`;
    }
    if (rd.status === 'fulfilled' && rd.value.length) {
      x += h.sec('Depósitos com recurso mais próximos', `<ul class="olist">${rd.value.map((d) => `<li data-act="fly" data-ll="${d.lat},${d.lon}"><span class="d">${distRumo(d)}</span><b>${E(d.nome || 'Depósito')}</b><div class="xs muted">${E([d.subs, d.tipo, d.porte, d.status].filter(Boolean).join(' · '))}</div></li>`).join('')}</ul><p class="xs muted">SGB — Recursos Minerais do Brasil (PDAC 2026), até 150 km.</p>`);
    }
    x += rodape(lat, lon, 'occ');
    setBody(t, x);
  }

  /* 5. Geofísica no ponto */
  async function fichaGeof(lat, lon) {
    const t = openInsp('Geofísica no ponto', 'Lendo os mosaicos do SGB…', coordLine(lat, lon));
    pin(lat, lon);
    cur = { acts: commonActs(lat, lon) };
    const br = B.maybeBrazil(lat, lon);
    const [rg, re, rv, ra] = await Promise.allSettled([br ? geofNoPonto(lat, lon) : Promise.resolve([]), emagPt(lat, lon), br ? gravPerto(lat, lon) : Promise.resolve([]), br ? aeroNoPonto(lat, lon) : Promise.resolve([])]);
    if (!live(t)) return;
    const h = H();
    let x = '';
    const nivel = (v) => (v >= 0.72 ? 'alto' : v >= 0.45 ? 'intermediário' : 'baixo');
    if (br) {
      const g = rg.status === 'fulfilled' ? rg.value : [];
      const ok = g.filter((v) => v && !v.__err && !v.sem);
      setTitle(t, ok.length ? `${ok.length} de ${B.GEOF.length} mosaicos cobrem o ponto` : 'Sem cobertura aerogeofísica');
      if (rg.status === 'rejected') x += falha(rg.reason, 'Aerogeofísica do SGB');
      else {
        const rows = g.map((v, i) => {
          const G = B.GEOF[i];
          if (!v || v.__err) return `<tr><td>${E(G.curto)}</td><td colspan="2" class="muted xs">não respondeu</td></tr>`;
          if (v.sem) return `<tr><td>${E(G.curto)}</td><td colspan="2" class="muted xs">sem cobertura</td></tr>`;
          const sw = `<span class="swatch" style="background:rgb(${v.rgb.join(',')})"></span>`;
          if (v.tern) return `<tr><td>${E(G.curto)}</td><td colspan="2">${sw}<span class="xs">K ${B.pct(v.tern[0])} · eTh ${B.pct(v.tern[1])} · eU ${B.pct(v.tern[2])}</span></td></tr>`;
          if (v.rel == null) return `<tr><td>${E(G.curto)}</td><td colspan="2" class="muted xs">cor fora da escala</td></tr>`;
          return `<tr><td>${E(G.curto)}</td><td>${sw}<span class="gbar"><i style="width:${B.pct(v.rel)}"></i></span></td><td class="v">${B.pct(v.rel)} · ${nivel(v.rel)}</td></tr>`;
        }).join('');
        x += h.sec('Mosaicos aerogeofísicos do SGB ' + B.tag('der'), `<table class="ctab geo">${rows}</table><p class="xs muted">Posição na escala de cores nacional (0–100 %), lida na cor do pixel: é relativa, não o valor físico (nT, %K, ppm).</p>`);
        const tern = g.find((v) => v && v.tern);
        if (tern && B.ternarioClasse) x += `<p class="small"><span class="muted">Ternário K–eTh–eU:</span> ${E(B.ternarioClasse(tern.tern))}.</p>`;
      }
      if (ra.status === 'fulfilled' && ra.value.length) x += h.sec('Aerolevantamento que cobre o ponto ' + B.tag('obs'), ra.value.map((a) => `<p class="small"><b>${E(a.titulo || 'Projeto')}</b><br><span class="xs muted">${E([a.metodos, a.espLV && 'linhas a ' + a.espLV + ' m', a.altura && 'voo a ' + a.altura + ' m', a.ano].filter(Boolean).join(' · '))}</span>${a.link ? `<br><a class="xs" href="${E(a.link)}" target="_blank" rel="noopener">Dados do projeto no GeoSGB</a>` : ''}</p>`).join(''));
    } else setTitle(t, 'Fora da cobertura do SGB');
    const em = re.status === 'fulfilled' ? re.value : null;
    let gl = h.kv([['EMAG2v3 (NOAA)', em != null ? B.fmt(em, 1) + ' nT — anomalia magnética a 4 km de altitude' : 'sem valor']]);
    if (rv.status === 'fulfilled' && rv.value.length) { const s = rv.value[0]; gl += h.kv([['Gravimetria', `Bouguer ${B.fmt(s.bouguer, 1)} mGal, ar livre ${B.fmt(s.ar, 1)} mGal`], ['Estação mais próxima', `${B.km(s.dist)} · ${B.fmt(s.alt, 0)} m de altitude · ${rv.value.length} estação(ões) em 25 km`]]); }
    x += h.sec('Campo regional ' + B.tag('obs'), gl);
    x += rodape(lat, lon, 'geof');
    setBody(t, x);
  }

  /* ---------- Meus pontos ---------- */
  const CATS = [['alvo', 'Alvo de prospecção', '--s4'], ['amostra', 'Amostra', '--s1'], ['aflora', 'Afloramento', '--s3'], ['lavra', 'Lavra ou garimpo', '--s8'], ['acesso', 'Acesso ou apoio', '--s7'], ['outro', 'Outro', '--unk']];
  const catOf = (id) => CATS.find((c) => c[0] === id) || CATS[CATS.length - 1];
  const getPts = () => B.store.get('pontos', []);
  const setPts = (l) => { B.store.set('pontos', l); drawPts(); };
  function drawPts() {
    if (!ptsL) return;
    ptsL.clearLayers();
    getPts().forEach((p) => {
      L.circleMarker([p.lat, p.lon], { radius: 6.5, color: '#fff', weight: 2, fillColor: css(catOf(p.cat)[2]), fillOpacity: 1, bubblingMouseEvents: false })
        .bindTooltip(E(p.nome), { direction: 'top', offset: [0, -6] })
        .on('click', () => fichaPonto(p.id)).addTo(ptsL);
    });
  }
  function fichaSalvar(lat, lon) {
    const t = openInsp('Salvar em Meus pontos', dec(lat, lon), coordLine(lat, lon));
    pin(lat, lon);
    const n = getPts().length + 1;
    cur = { acts: Object.assign(commonActs(lat, lon), {
      gravar: () => {
        const f = B.$('#inspBody form');
        const p = { id: Date.now().toString(36), nome: f.nome.value.trim() || 'Ponto ' + n, cat: f.cat.value, obs: f.obs.value.trim(), lat, lon, data: new Date().toISOString() };
        setPts(getPts().concat([p]));
        B.toast(`“${p.nome}” salvo em Meus pontos.`);
        fichaMeus();
      },
    }) };
    setBody(t, `<form class="form" onsubmit="return false"><label>Nome<input name="nome" maxlength="80" value="Ponto ${n}" autocomplete="off"></label><label>Categoria<select name="cat">${CATS.map((c) => `<option value="${c[0]}">${E(c[1])}</option>`).join('')}</select></label><label>Observação<textarea name="obs" maxlength="600" placeholder="Ex.: veio de pegmatito com turmalina verde, direção N30E"></textarea></label><div class="actions">${btn('gravar', 'Salvar ponto', 1)}${btn('meus', 'Ver Meus pontos')}</div></form><p class="xs muted">Os pontos ficam guardados neste navegador e podem ser exportados para KML (Google Earth), GPX (GPS de mão) e CSV.</p>`);
    cur.acts.meus = fichaMeus;
    setTimeout(() => { const i = B.$('#inspBody input[name="nome"]'); if (i) { i.focus(); i.select(); } }, 30);
  }
  function fichaPonto(id) {
    const p = getPts().find((x) => x.id === id);
    if (!p) return;
    const t = openInsp('Ponto salvo', p.nome, coordLine(p.lat, p.lon));
    pin(p.lat, p.lon);
    menuLL = [p.lat, p.lon];
    cur = { acts: Object.assign(commonActs(p.lat, p.lon), { meus: fichaMeus }) };
    setBody(t, H().kv([['Categoria', catOf(p.cat)[1]], ['Observação', p.obs], ['Salvo em', new Date(p.data).toLocaleString('pt-BR')], ['Coordenadas', `<span class="mono">${dec(p.lat, p.lon)}</span> ${cpy(dec(p.lat, p.lon))}`, 1]]) + `<div class="actions">${btn('meus', 'Todos os pontos')}</div>` + rodape(p.lat, p.lon, 'salvar'));
  }
  function fichaMeus() {
    const l = getPts();
    const t = openInsp('Meus pontos', l.length ? `${l.length} ponto(s) salvo(s)` : 'Nenhum ponto salvo', 'Guardados neste navegador');
    tmp.clearLayers();
    let confirma = null;
    const exp = (fmt) => {
      const pts = getPts();
      if (!pts.length) { B.toast('Nenhum ponto para exportar.'); return; }
      const base = 'bateia-meus-pontos-' + new Date().toISOString().slice(0, 10);
      if (fmt === 'kml') B.download(base + '.kml', kml('Meus pontos — Bateia', pts.map(kmlPt).join('')), 'application/vnd.google-earth.kml+xml');
      if (fmt === 'gpx') B.download(base + '.gpx', gpx(pts), 'application/gpx+xml');
      if (fmt === 'csv') B.download(base + '.csv', csv(['nome', 'categoria', 'latitude', 'longitude', 'utm', 'observacao', 'data'], pts.map((p) => { const u = B.toUTM(p.lat, p.lon); return [p.nome, catOf(p.cat)[1], p.lat.toFixed(6).replace('.', ','), p.lon.toFixed(6).replace('.', ','), `${u.zone}${u.band} ${Math.round(u.E)} ${Math.round(u.N)}`, p.obs, p.data.slice(0, 10)]; })), 'text/csv');
    };
    cur = { acts: {
      ver: (el) => fichaPonto(el.dataset.id),
      ir: (el) => { const p = getPts().find((x) => x.id === el.dataset.id); if (p) { map.setView([p.lat, p.lon], Math.max(map.getZoom(), 15)); pin(p.lat, p.lon); } },
      analisar: (el) => { const p = getPts().find((x) => x.id === el.dataset.id); if (p) { closeInsp(); B.app.runPoint(p.lat, p.lon, null, p.nome); } },
      apagar: (el) => {
        if (confirma !== el.dataset.id) { confirma = el.dataset.id; el.textContent = 'Confirmar'; el.classList.add('danger'); return; }
        setPts(getPts().filter((x) => x.id !== el.dataset.id)); fichaMeus();
      },
      kml: () => exp('kml'), gpx: () => exp('gpx'), csv: () => exp('csv'),
      todos: () => { const pts = getPts(); if (pts.length) fit(L.latLngBounds(pts.map((p) => [p.lat, p.lon])).pad(0.1), 15); },
    } };
    if (!l.length) { setBody(t, '<p class="small">Clique com o botão direito no mapa e escolha <b>Salvar em Meus pontos</b> para guardar alvos, amostras, afloramentos e acessos.</p>'); return; }
    setBody(t, `<div class="actions">${btn('todos', 'Ver todos no mapa')}${btn('kml', 'KML')}${btn('gpx', 'GPX')}${btn('csv', 'CSV')}</div><ul class="olist">${l.slice().reverse().map((p) => `<li data-act="ver" data-id="${p.id}"><span class="d"><span class="swatch" style="background:var(${catOf(p.cat)[2]})"></span>${E(catOf(p.cat)[1])}</span><b>${E(p.nome)}</b><div class="xs muted mono">${dec(p.lat, p.lon)}</div>${p.obs ? `<div class="xs">${E(p.obs)}</div>` : ''}<div class="actions" style="margin:6px 0 0">${btn('ir', 'Ir', 0, `data-id="${p.id}"`)}${btn('analisar', 'Analisar', 0, `data-id="${p.id}"`)}${btn('apagar', 'Apagar', 0, `data-id="${p.id}"`)}</div></li>`).join('')}</ul>`);
  }

  /* ---------- imagens do Google (Map Tiles API, chave do usuário) ---------- */
  C.chaveGoogle = function (nome, erro) {

    const t = openInsp('Mapa-base', 'Imagens de satélite do Google', 'Google Map Tiles API · chave guardada só neste navegador');

      gravar: async () => {
        if (enviando) return;

        if (!/^[\w-]{30,60}$/.test(k)) { B.toast('Cole a chave de API completa (começa com “AIza”).'); f.key.focus(); return; }
        enviando = true;
        const b = f.querySelector('[data-act="gravar"]');
        b.disabled = true; b.textContent = 'Testando a chave…';
        M.setGoogleKey(k);
        const ok = await M.setBase(n);
        enviando = false;
        if (ok) { closeInsp(); B.toast(`${n} ativado no mapa.`); }
      },
      esri: () => { M.setBase('Satélite (Esri)'); closeInsp(); },

      console: () => abrir('https://console.cloud.google.com/google/maps-apis/api-list'),

    } };
    const passos = [
      'Entre no <b>Google Cloud Console</b> com sua conta Google, crie um projeto e cadastre o faturamento (o Google exige, mesmo dentro da cota grátis).',
      'Em <b>APIs e serviços → Biblioteca</b>, ative a <b>Map Tiles API</b>.',
      'Em <b>Credenciais</b>, crie uma <b>chave de API</b>. Restrinja a chave à Map Tiles API e, em “Sites”, a <span class="mono">http://localhost:8765/*</span> (ou ao endereço do seu site).',
      'Cole a chave aqui embaixo e clique em <b>Testar e usar</b>.',
    ];
    setBody(t, `${erro ? `<div class="callout warn small"><b>O Google recusou:</b> ${E(erro)}.</div>` : ''}
      <p class="small">O Google só libera as imagens dele para outros programas pela <b>Map Tiles API</b>, com uma chave sua. A cota grátis é de <b>100 mil blocos de imagem por mês</b> (uma tela cheia usa de 20 a 40 blocos); acima disso o Google cobra US$ 0,60 por mil.</p>
      <ol class="passos small">${passos.map((p) => `<li>${p}</li>`).join('')}</ol>
      <div class="actions">${btn('console', 'Abrir o Google Cloud Console')}${btn('ajuda', 'Guia do Google')}</div>
      <form class="form" onsubmit="return false" autocomplete="off">
        <label>Chave de API<input name="key" class="mono" spellcheck="false" autocapitalize="off" placeholder="AIza…" value="${E(M.googleKey())}"></label>
        <label>Mapa<select name="tipo">${nomes.map((n) => `<option ${n === sel ? 'selected' : ''}>${E(n)}</option>`).join('')}</select></label>
        <div class="actions">${btn('gravar', 'Testar e usar', 1)}${M.googleDefs[M.base] ? btn('esri', 'Voltar ao satélite Esri') : ''}${tem ? btn('remover', 'Remover chave') : ''}</div>
      </form>
      <p class="xs muted">A chave fica só neste navegador e só é enviada ao Google (tile.googleapis.com). O Google não informa a data das imagens; para comparar datas, a ficha <b>Informações do local</b> mostra a data da imagem Esri no ponto, e o Google Earth Pro tem o histórico de imagens.</p>`);
    setTimeout(() => { const i = B.$('#inspBody input[name="key"]'); if (i) i.focus(); }, 30);

  /* ---------- desenho: polígono, medição e perfil ---------- */
  function startDraw(kind, lat, lon) {
    endDraw();
    closeInsp();
    map.closePopup();
    mode = { kind, pts: [[lat, lon]], done: false, mouse: null };
    map.doubleClickZoom.disable();
    map.getContainer().classList.add('desenhando');
    redraw();
  }
  function endDraw() {
    if (!mode) return;
    mode = null;
    drawL.clearLayers();
    bar.hidden = true;
    map.getContainer().classList.remove('desenhando');
    setTimeout(() => map.doubleClickZoom.enable(), 300);
  }
  C.endDraw = endDraw;
  const lenKm = (pts) => pts.reduce((s, p, i) => (i ? s + B.geo.dist(pts[i - 1][0], pts[i - 1][1], p[0], p[1]) : 0), 0);
  function redraw() {
    if (!mode) return;
    drawL.clearLayers();
    const col = css(mode.kind === 'medida' ? '--violet' : '--accent');
    const pts = mode.pts;
    if (mode.kind === 'poligono' && pts.length > 2) L.polygon(pts, { color: col, weight: 2.5, fillOpacity: 0.12, interactive: false }).addTo(drawL);
    else if (pts.length > 1) L.polyline(pts, { color: col, weight: 2.5, interactive: false }).addTo(drawL);
    mode.rubber = L.polyline([], { color: col, weight: 1.5, dashArray: '5 6', interactive: false }).addTo(drawL);
    pts.forEach((p, i) => {
      const first = i === 0 && mode.kind === 'poligono' && pts.length > 2;
      const m = L.circleMarker(p, { radius: first ? 7 : 4.5, color: col, weight: 2, fillColor: '#fff', fillOpacity: 1, bubblingMouseEvents: false }).addTo(drawL);
      if (first) m.bindTooltip('Clique para fechar o polígono', { direction: 'top' }).on('click', finish);
    });
    if (mode.kind === 'medida' && pts.length > 1) {
      let acc = 0;
      pts.forEach((p, i) => { if (!i) return; acc += B.geo.dist(pts[i - 1][0], pts[i - 1][1], p[0], p[1]); L.tooltip({ permanent: true, direction: 'right', className: 'medida-tip', offset: [6, 0] }).setLatLng(p).setContent(B.km(acc)).addTo(drawL); });
    }
    rubber();
    renderBar();
  }
  function rubber() {
    if (!mode || !mode.rubber) return;
    if (mode.done || !mode.mouse) { mode.rubber.setLatLngs([]); return; }
    const last = mode.pts[mode.pts.length - 1];
    mode.rubber.setLatLngs(mode.kind === 'poligono' && mode.pts.length > 1 ? [last, mode.mouse, mode.pts[0]] : [last, mode.mouse]);
  }
  function renderBar() {
    if (!mode) return;
    const pts = mode.pts, n = pts.length;
    const b = (d, label, primary) => `<button type="button" class="btn btn-sm${primary ? ' btn-primary' : ''}" data-d="${d}">${E(label)}</button>`;
    let h = '';
    if (mode.kind === 'poligono') {
      const per = n > 1 ? lenKm(pts.concat([pts[0]])) : 0;
      h = `<div class="db-top"><b>Polígono</b><span class="mono">${n} vértice(s)${n > 2 ? ` · ${area(B.geo.areaKm2(pts))} · perímetro ${B.km(per)}` : ''}</span></div><div class="db-btns">${n > 2 ? b('ok', 'Concluir e analisar', 1) : ''}${b('undo', 'Desfazer')}${n > 2 ? b('kml', 'Baixar KML') : ''}${b('cancel', 'Cancelar')}</div><div class="hint">Clique para adicionar vértices · duplo clique, Enter ou botão direito conclui · Backspace desfaz · Esc cancela</div>`;
    } else if (mode.kind === 'medida') {
      const tot = lenKm(pts), seg = n > 1 ? B.geo.dist(pts[n - 2][0], pts[n - 2][1], pts[n - 1][0], pts[n - 1][1]) : 0;
      const az = n > 1 ? B.geo.bearing(pts[n - 2][0], pts[n - 2][1], pts[n - 1][0], pts[n - 1][1]) : null;
      h = `<div class="db-top"><b>${mode.done ? 'Medição concluída' : 'Medindo'}</b><span class="mono">total ${B.km(tot)}${n > 1 ? ` · último trecho ${B.km(seg)}, rumo ${B.fmt(az, 0)}° ${rumo(az)}` : ''}${n > 2 ? ` · área se fechar ${area(B.geo.areaKm2(pts))}` : ''}</span></div><div class="db-btns">${mode.done ? '' : b('undo', 'Desfazer')}${n > 1 ? b('copy', 'Copiar') + b('kml', 'Baixar KML') : ''}${b('cancel', 'Encerrar', mode.done)}</div><div class="hint">${mode.done ? 'Esc ou Encerrar limpa a medição' : 'Clique para adicionar pontos · duplo clique ou Enter conclui · Backspace desfaz · Esc encerra'}</div>`;
    } else {
      h = `<div class="db-top"><b>Perfil topográfico</b><span>Clique no ponto final do perfil</span></div><div class="db-btns">${b('cancel', 'Cancelar')}</div><div class="hint">Esc cancela</div>`;
    }
    bar.innerHTML = h;
    bar.hidden = false;
  }
  function undo() {
    if (!mode || mode.done) return;
    if (mode.pts.length > 1) { mode.pts.pop(); redraw(); } else endDraw();
  }
  const dedupe = (pts) => pts.filter((p, i) => !i || map.latLngToContainerPoint(p).distanceTo(map.latLngToContainerPoint(pts[i - 1])) >= 4);
  function finish() {
    if (!mode || mode.done) return;
    mode.pts = dedupe(mode.pts);
    if (mode.kind === 'poligono') {
      if (mode.pts.length < 3) { B.toast('O polígono precisa de pelo menos 3 vértices.'); return; }
      const ring = mode.pts.slice();
      endDraw();
      C.ultimoPoligono = ring;
      B.toast(`Polígono de ${area(B.geo.areaKm2(ring))} — analisando…`);
      B.app.run(B.makeAOI({ features: [{ type: 'Polygon', coords: ring, name: 'Polígono desenhado' }], nome: 'Polígono desenhado' }));
      return;
    }
    if (mode.kind === 'medida') { mode.done = true; mode.mouse = null; redraw(); return; }
    endDraw();
  }
  function onBar(ev) {
    const d = ev.target.closest('[data-d]');
    if (!d || !mode) return;
    const k = d.dataset.d;
    if (k === 'undo') undo();
    if (k === 'cancel') endDraw();
    if (k === 'ok') finish();
    if (k === 'copy') { const pts = mode.pts; copy(`Distância total: ${B.km(lenKm(pts))}` + (pts.length > 2 ? ` · área do polígono fechado: ${area(B.geo.areaKm2(pts))}` : '')); }
    if (k === 'kml') {
      const pts = mode.pts;
      if (mode.kind === 'poligono') B.download('poligono-bateia.kml', kml('Polígono — Bateia', kmlPoly('Polígono desenhado', pts, area(B.geo.areaKm2(pts)))), 'application/vnd.google-earth.kml+xml');
      else B.download('medicao-bateia.kml', kml('Medição — Bateia', kmlLine(`Medição ${B.km(lenKm(pts))}`, pts)), 'application/vnd.google-earth.kml+xml');
    }
  }

  /* 6. Perfil topográfico */
  const ticks = (a, b, n) => {
    const span = b - a || 1, st0 = Math.pow(10, Math.floor(Math.log10(span / n)));
    const st = [1, 2, 2.5, 5, 10].map((m) => m * st0).find((s) => span / s <= n) || st0 * 10;
    const out = [];
    for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(6));
    return out;
  };
  function perfilSVG(prof) {
    const W = 356, Ht = 200, l = 44, r = 10, tp = 14, bt = 28;
    const Lkm = prof[prof.length - 1].d, zs = prof.map((p) => p.z);
    const zmin = Math.min(...zs), zmax = Math.max(...zs), m = Math.max(10, (zmax - zmin) * 0.1);
    const y0 = zmin - m, y1 = zmax + m;
    const X = (d) => l + (d / Lkm) * (W - l - r), Y = (z) => tp + (1 - (z - y0) / (y1 - y0)) * (Ht - tp - bt);
    const line = prof.map((p, i) => `${i ? 'L' : 'M'}${X(p.d).toFixed(1)},${Y(p.z).toFixed(1)}`).join('');
    const areaP = line + `L${X(Lkm).toFixed(1)},${Ht - bt}L${l},${Ht - bt}Z`;
    let s = `<svg class="perfil" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Perfil topográfico de A a B">`;
    ticks(y0, y1, 4).forEach((v) => (s += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" class="pg"/><text x="${l - 6}" y="${Y(v) + 3.5}" text-anchor="end" class="pt">${B.fmt(v)}</text>`));
    ticks(0, Lkm, 5).forEach((v) => (s += `<text x="${X(v)}" y="${Ht - bt + 15}" text-anchor="middle" class="pt">${B.fmt(v, v % 1 ? 1 : 0)}</text>`));
    s += `<text x="${W - r}" y="${Ht - 3}" text-anchor="end" class="pt">km</text><text x="4" y="10" class="pt">m</text>`;
    s += `<path d="${areaP}" class="pa"/><path d="${line}" class="pl"/>`;
    s += `<text x="${X(0) + 3}" y="${Y(prof[0].z) - 7}" class="pab">A</text><text x="${X(Lkm) - 3}" y="${Y(prof[prof.length - 1].z) - 7}" text-anchor="end" class="pab">B</text>`;
    s += `<g class="phov" visibility="hidden"><line class="pc" y1="${tp}" y2="${Ht - bt}"/><circle r="4" class="pd"/><text class="pr" y="${tp + 10}"></text></g>`;
    s += `<rect x="${l}" y="${tp}" width="${W - l - r}" height="${Ht - tp - bt}" fill="transparent" class="pcap"/></svg>`;
    return { svg: s, X, Y, W, l, r };
  }
  function bindPerfil(prof, geo) {
    const svg = B.$('#inspBody svg.perfil');
    if (!svg) return;
    const g = svg.querySelector('.phov'), cap = svg.querySelector('.pcap');
    const ln = g.querySelector('.pc'), dot = g.querySelector('.pd'), txt = g.querySelector('.pr');
    const Lkm = prof[prof.length - 1].d;
    const move = (ev) => {
      const r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * geo.W;
      const f = B.clamp((sx - geo.l) / (geo.W - geo.l - geo.r), 0, 1);
      const p = prof[Math.round(f * (prof.length - 1))];
      const x = geo.X(p.d), y = geo.Y(p.z);
      g.setAttribute('visibility', 'visible');
      ln.setAttribute('x1', x); ln.setAttribute('x2', x);
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      txt.textContent = `${B.fmt(p.d, Lkm < 10 ? 2 : 1)} km · ${B.fmt(p.z)} m`;
      const right = x > geo.W * 0.6;
      txt.setAttribute('x', right ? x - 6 : x + 6); txt.setAttribute('text-anchor', right ? 'end' : 'start');
      if (!hoverM) hoverM = L.circleMarker([p.lat, p.lon], { radius: 6, color: '#fff', weight: 2, fillColor: css('--hematite'), fillOpacity: 1, interactive: false }).addTo(tmp);
      else hoverM.setLatLng([p.lat, p.lon]);
    };
    cap.addEventListener('pointermove', move);
    cap.addEventListener('pointerdown', move);
    cap.addEventListener('pointerleave', () => { g.setAttribute('visibility', 'hidden'); if (hoverM) { tmp.removeLayer(hoverM); hoverM = null; } });
  }
  async function fichaPerfil(a, b) {
    const Lkm = B.geo.dist(a[0], a[1], b[0], b[1]);
    const t = openInsp('Perfil topográfico', `${B.km(Lkm)} de A até B`, `A ${dec(a[0], a[1])} → B ${dec(b[0], b[1])}`);
    tmp.clearLayers(); hoverM = null;
    const col = css('--accent');
    L.polyline([a, b], { color: col, weight: 3, interactive: false }).addTo(tmp);
    [[a, 'A'], [b, 'B']].forEach(([p, s]) => L.marker(p, { interactive: false, icon: L.divIcon({ className: 'ab-pin', html: s, iconSize: [20, 20] }) }).addTo(tmp));
    let prof = null;
    cur = { acts: {
      csv: () => prof && B.download('perfil-bateia.csv', csv(['distancia_km', 'latitude', 'longitude', 'altitude_m'], prof.map((p) => [p.d.toFixed(3).replace('.', ','), p.lat.toFixed(6).replace('.', ','), p.lon.toFixed(6).replace('.', ','), Math.round(p.z)])), 'text/csv'),
      kml: () => B.download('perfil-bateia.kml', kml('Perfil — Bateia', kmlLine(`Perfil ${B.km(Lkm)}`, [a, b])), 'application/vnd.google-earth.kml+xml'),
      faixa: () => { closeInsp(); B.app.run(B.makeAOI({ features: [{ type: 'LineString', coords: [a, b], name: 'Faixa do perfil' }], raioKm: 1, nome: 'Faixa do perfil A–B' })); },
      inverter: () => fichaPerfil(b, a),
      novo: () => startDraw('perfil', a[0], a[1]),
    } };
    if (Lkm < 0.03) { setBody(t, '<p class="small">Os pontos estão muito próximos. Escolha um ponto final mais distante.</p>'); return; }
    try {
      const N = 240;
      const pts = Array.from({ length: N }, (_, i) => { const f = i / (N - 1); return { lat: a[0] + (b[0] - a[0]) * f, lon: a[1] + (b[1] - a[1]) * f, d: f * Lkm }; });
      const bb = B.geo.expand(B.geo.bboxOf(pts.map((p) => [p.lat, p.lon])), 0.3);
      const s = await demSampler(bb, Math.max(8, (Lkm * 1000) / N));
      if (!live(t)) return;
      prof = pts.map((p) => Object.assign(p, { z: s.sample(p.lat, p.lon) }));
      const zs = prof.map((p) => p.z);
      const sm = zs.map((z, i) => (zs[Math.max(0, i - 1)] + z + zs[Math.min(zs.length - 1, i + 1)]) / 3);
      let sobe = 0, desce = 0, incl = 0, inclMax = 0;
      const dx = (Lkm * 1000) / (N - 1);
      for (let i = 1; i < N; i++) { const dz = sm[i] - sm[i - 1]; if (dz > 0) sobe += dz; else desce -= dz; incl += Math.abs(dz); }
      for (let i = 4; i < N; i += 1) inclMax = Math.max(inclMax, Math.abs(sm[i] - sm[i - 4]) / (4 * dx));
      const zmin = Math.min(...zs), zmax = Math.max(...zs);
      const iMin = zs.indexOf(zmin), iMax = zs.indexOf(zmax);
      const geo = perfilSVG(prof);
      const h = H();
      const az = B.geo.bearing(a[0], a[1], b[0], b[1]);
      let x = `<div class="stats">${h.stat(B.km(Lkm), 'comprimento')}${h.stat(B.fmt(zmin) + '–' + B.fmt(zmax), 'cotas (m)')}${h.stat((zs[N - 1] - zs[0] >= 0 ? '+' : '') + B.fmt(zs[N - 1] - zs[0]) + ' m', 'desnível A→B')}</div>`;
      x += `<figure class="figure">${geo.svg}<figcaption>Passe o dedo ou o mouse no gráfico para ver o ponto no mapa. Exagero vertical automático.</figcaption></figure>`;
      x += h.kv([
        ['Rumo A→B', `${B.fmt(az, 0)}° (${rumo(az)})`], ['Subida acumulada', B.fmt(sobe) + ' m'], ['Descida acumulada', B.fmt(desce) + ' m'],
        ['Inclinação média', B.fmt((Math.atan(incl / (Lkm * 1000)) / rad), 1) + '°'], ['Inclinação máxima', B.fmt(Math.atan(inclMax) / rad, 1) + '° (trechos de ' + B.fmt(4 * dx, 0) + ' m)'],
        ['Ponto mais alto', `${B.fmt(zmax)} m a ${B.km(prof[iMax].d)} de A`], ['Ponto mais baixo', `${B.fmt(zmin)} m a ${B.km(prof[iMin].d)} de A`],
        ['Modelo de elevação', `AWS Terrain Tiles, ≈ ${B.fmt(s.res, 0)} m por pixel`],
      ]);
      x += `<div class="actions">${btn('faixa', 'Analisar faixa de 1 km ao longo do perfil', 1)}${btn('inverter', 'Inverter A e B')}${btn('novo', 'Novo perfil a partir de A')}${btn('csv', 'CSV')}${btn('kml', 'KML')}</div>`;
      setBody(t, x);
      bindPerfil(prof, geo);
      fit(L.latLngBounds([a, b]).pad(0.1), 16);
    } catch (e) { setBody(t, falha(e, 'Modelo de elevação')); }
  }

  /* ---------- inicialização ---------- */
  C.init = function () {
    map = B.map.L;
    menu = B.$('#ctxmenu'); insp = B.$('#insp'); bar = B.$('#drawbar');
    tmp = L.layerGroup().addTo(map);
    drawL = L.layerGroup().addTo(map);
    ptsL = L.layerGroup().addTo(map);
    drawPts();
    [menu, insp, bar].forEach((el) => { L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el); el.addEventListener('contextmenu', (ev) => ev.stopPropagation()); });

    map.on('contextmenu', (e) => {
      const lat = e.latlng.lat, lon = wrap(e.latlng.lng);
      if (mode) { if (mode.kind === 'perfil' || mode.done) endDraw(); else finish(); return; }
      map.closePopup();
      const oe = e.originalEvent || {};
      const pt = oe.clientX != null ? [oe.clientX, oe.clientY] : (() => { const r = map.getContainer().getBoundingClientRect(); return [r.left + e.containerPoint.x, r.top + e.containerPoint.y]; })();
      C.openMenu(lat, lon, pt[0], pt[1]);
    });
    map.on('click', (e) => {
      if (!mode || mode.done) return;
      const ll = [e.latlng.lat, wrap(e.latlng.lng)];
      if (mode.kind === 'perfil') { const a = mode.pts[0]; endDraw(); fichaPerfil(a, ll); return; }
      const last = mode.pts[mode.pts.length - 1];
      if (last && map.latLngToContainerPoint(last).distanceTo(e.containerPoint) < 4) return;
      mode.pts.push(ll);
      redraw();
    });
    map.on('dblclick', (e) => { if (mode && !mode.done) { L.DomEvent.stop(e); finish(); } });
    map.on('mousemove', (e) => { if (mode && !mode.done) { mode.mouse = [e.latlng.lat, wrap(e.latlng.lng)]; rubber(); } });
    map.on('movestart zoomstart', closeMenu);

    menu.addEventListener('click', onMenuClick);
    menu.addEventListener('keydown', (ev) => {
      const items = Array.from(menu.querySelectorAll('.ctx-item, .ctx-mini, .ctx-raios button'));
      const i = items.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      if (ev.key === 'Tab') { ev.preventDefault(); items[(i + (ev.shiftKey ? -1 : 1) + items.length) % items.length].focus(); }
    });
    document.addEventListener('pointerdown', (ev) => { if (!menu.hidden && !menu.contains(ev.target)) closeMenu(); }, true);
    window.addEventListener('resize', closeMenu);
    window.addEventListener('blur', closeMenu);
    bar.addEventListener('click', onBar);
    B.$('#inspClose').addEventListener('click', closeInsp);
    B.$('#inspBody').addEventListener('click', (ev) => {
      const cp = ev.target.closest('[data-copy]');
      if (cp) { ev.stopPropagation(); copy(cp.dataset.copy); return; }
      const el = ev.target.closest('[data-act]');
      if (!el) return;
      if (el.tagName === 'A') ev.preventDefault();
      const fn = cur.acts && cur.acts[el.dataset.act];
      if (fn) fn(el, ev);
    });
    B.$('#inspBody').addEventListener('submit', (ev) => { ev.preventDefault(); if (cur.acts.gravar) cur.acts.gravar(); });
    document.addEventListener('keydown', (ev) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName || '');
      if (ev.key === 'Escape') {
        if (!menu.hidden) { closeMenu(); return; }
        if (mode) { endDraw(); return; }
        if (!insp.hidden && B.$('#viewer3d').hidden && !typing) closeInsp();
        return;
      }
      if (typing || !mode || mode.done) return;
      if (ev.key === 'Enter') { ev.preventDefault(); finish(); }
      if (ev.key === 'Backspace') { ev.preventDefault(); undo(); }
    });
  };
})();

/* Bateia — orquestração: entrada, execução paralela das fontes, derivação e renderização. */
(function () {
  'use strict';
  const B = window.B;
  const APP = (B.app = {});
  const S = (B.state = { R: {}, D: {}, status: {}, errors: {}, times: {}, tab: 'sintese', runId: 0, L: new B.Ledger(), LD: [] });
  S.ledgerAll = () => S.L.items.concat(S.LD);

  /* ---------- tema ---------- */
  const applyTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
  applyTheme(B.store.get('tema', null));

  /* ---------- renderização ---------- */
  let renderT = null;
  APP.render = function () {
    clearTimeout(renderT);
    renderT = setTimeout(APP.renderNow, 60);
  };
  APP.renderNow = function () {
    renderSources();
    if (!S.aoi) return;
    const body = B.$('#tabBody');
    const fn = B.view[S.tab];
    const scroll = body.scrollTop;
    try { body.innerHTML = fn ? fn() : ''; } catch (err) { console.error(err); body.innerHTML = `<div class="callout warn">Erro ao montar esta aba: ${B.esc(err.message)}</div>`; }
    body.scrollTop = scroll;
    // contadores nas abas
    const cnt = {
      minerios: (S.D.subs || []).length,
      geoquimica: S.D.geochem ? S.D.geochem.ranking.filter((x) => x.anomAOI > 0).length : 0,
      evidencias: S.ledgerAll().length,
    };
    B.$$('#tabs button').forEach((b) => {
      const n = cnt[b.dataset.tab];
      const base = b.dataset.label || (b.dataset.label = b.textContent);
      b.innerHTML = B.esc(base) + (n ? `<span class="cnt">${n}</span>` : '');
    });
  };
  function renderSources() {
    const chips = B.PROVIDERS.map((p) => {
      const st = S.status[p.id] || 'off';
      const lbl = { ok: 'com dados', empty: 'sem registros na área', err: 'erro: ' + (S.errors[p.id] || ''), off: 'fora da cobertura', run: 'consultando', wait: 'na fila' }[st];
      return `<span class="src" data-s="${st === 'wait' ? 'run' : st}" title="${B.esc(p.fonte + ' — ' + lbl)}"><i></i>${B.esc(p.nome)}</span>`;
    }).join('');
    const n = B.PROVIDERS.length, c = (k) => B.PROVIDERS.filter((p) => S.status[p.id] === k).length;
    const ok = c('ok'), run = c('run'), err = c('err'), off = c('off'), done = n - run;
    const resumo = !S.aoi ? 'Fontes de dados' : `${ok} de ${n} fontes com dados${run ? ` · ${run} consultando` : ''}${err ? ` · ${err} com erro` : ''}${off ? ` · ${off} fora da cobertura` : ''}`;
    B.$('#sources').innerHTML = `<details class="src-wrap" ${S.srcOpen ? 'open' : ''}><summary><span class="src-prog" aria-hidden="true"><i style="width:${(done / n) * 100}%"></i></span><span>${resumo}</span></summary><div class="src-list">${chips}</div></details>`;
    B.$('#sources details').addEventListener('toggle', (ev) => (S.srcOpen = ev.target.open));
  }
  function setTab(t) {
    S.tab = t;
    B.$$('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    B.$('#tabBody').scrollTop = 0;
    APP.renderNow();
  }

  /* ---------- derivação (recalculada a cada fonte que chega) ---------- */
  function derive() {
    const R = S.R, D = S.D, a = S.aoi, LD = [];
    const add = (tipo, tema, texto, fonte, extra) => LD.push(Object.assign({ tipo, tema, texto, fonte }, extra || {}));
    if (R.dem && !D.terrain) {
      try {
        D.terrain = B.terrain(R.dem, a);
        D.terrainURLs = {};
        Object.entries(D.terrain.canvases).forEach(([k, c]) => { D.terrainURLs[k] = c.toDataURL('image/png'); });
        B.map.setLocal('t_relevo', 'Relevo sombreado (calculado)', D.terrain.canvases.relevo, R.dem.bbox);
        B.map.setLocal('t_declive', 'Declividade (calculada)', D.terrain.canvases.declive, R.dem.bbox);
        B.map.setLocal('t_drenagem', 'Drenagem (calculada)', D.terrain.canvases.drenagem, R.dem.bbox);
      } catch (e) { console.error(e); }
    }
    if (D.terrain) add('der', 'Relevo', `Na área, a altitude varia de ${B.fmt(D.terrain.ez.min)} a ${B.fmt(D.terrain.ez.max)} m (amplitude ${B.fmt(D.terrain.ez.max - D.terrain.ez.min)} m); declividade média ${B.fmt(D.terrain.es.mean, 1)}° e máxima ${B.fmt(D.terrain.es.max, 0)}°.`, 'Bateia — derivado do modelo de elevação');
    if (R.s2 && R.s2.bands && !D.spectral) {
      try {
        D.spectral = B.spectral(R.s2);
        D.spectralURLs = {};
        Object.entries(D.spectral.canvases).forEach(([k, c]) => { D.spectralURLs[k] = c.toDataURL('image/png'); });
        const nomes = { rgb: 'Sentinel-2 cor verdadeira', razoes: 'Sentinel-2 composição de razões', fe3: 'Óxidos de ferro (B04/B02)', fe2: 'Ferro ferroso', oh: 'Argilominerais (B11/B12)', gossan: 'Índice gossan', ndvi: 'NDVI' };
        Object.entries(D.spectral.canvases).forEach(([k, c]) => B.map.setLocal('s_' + k, nomes[k] || k, c, R.s2.llb || R.s2.bbox));
      } catch (e) { console.error(e); }
    }
    if (D.spectral) {
      const st = D.spectral.stats;
      if (st.fe3 && st.oh) add('der', 'Sensoriamento remoto', `Índices nas partes expostas: óxidos de ferro B04/B02 P95 = ${B.fmt(st.fe3.p95, 2)}; argilominerais B11/B12 P95 = ${B.fmt(st.oh.p95, 2)}; vegetação densa em ${B.pct(D.spectral.vegFrac)} da área.`, 'Bateia — derivado do Sentinel-2');
    }
    if (R.geof) D.geof = B.geofStats(R.geof, a);
    const GF = D.geof || {};
    if (GF.tern && GF.tern.classe) add('der', 'Geofísica', `Ternário K–eTh–eU no centro: ${GF.tern.classe}.`, 'Bateia — leitura da cor do mosaico ternário SGB');
    ['mag', 'k', 'th', 'u'].forEach((k) => { const g = GF[k]; if (g && g.centro != null) add('der', 'Geofísica', `${B.GEOF.find((x) => x.id === k).nome}: nível ${g.nivel} no centro (≈ ${B.pct(g.centro)} da escala nacional; ${B.pct(g.rankCentro)} na janela local).`, 'Bateia — leitura da cor do mosaico SGB'); });
    if (R.geoq) {
      D.geochem = B.geochem(R.geoq);
      D.geochem.ranking.filter((x) => x.anomAOI > 0).slice(0, 6).forEach((x) => add('der', 'Geoquímica', `${x.nome} (${x.e.toUpperCase()}): máximo de ${B.fmtSig(x.aoiMax)} ${x.unit} na área, ${B.fmt(x.razao, 1)}× o limiar regional de ${B.fmtSig(x.thr.thr)} ${x.unit} (${x.anomAOI} amostra(s) anômala(s)).`, 'Bateia — estatística robusta sobre dados SGB'));
    }
    if (R.estr && R.estr.lines.length) {
      const dom = R.estr.rose.map((v, i) => [v, i]).sort((x, y) => y[0] - x[0])[0];
      add('der', 'Estrutural', `Direção estrutural dominante no entorno: ${dom[1] * 10}°–${dom[1] * 10 + 10}° (azimute), ${B.pct(dom[0] / (R.estr.kmTotal || 1))} do comprimento total de traços.`, 'Bateia — roseta dos traços SGB');
    }
    D.subs = B.substancias(R);
    D.facts = B.buildFacts(R, D, a);
    D.models = B.scoreModels(D.facts);
    D.models.filter((r) => r.ajust >= 0.35).slice(0, 4).forEach((r) => {
      const fav = r.ev.filter((x) => x.s != null && x.s >= 0.6).map((x) => B.EV_LABEL[x.tipo].toLowerCase());
      add('inf', 'Potencial mineral', `Compatibilidade com ${r.m.nome.toLowerCase()}: ${B.pct(r.ajust)} (confiança ${B.pct(r.conf)}).${fav.length ? ' Evidências favoráveis: ' + fav.join(', ') + '.' : ''}`, 'Bateia — modelos de sistemas minerais');
    });
    Object.entries(S.status).forEach(([id, st]) => {
      const p = B.PROVIDERS.find((x) => x.id === id);
      if (st === 'err') add('unk', 'Cobertura', `${p.nome} (${p.fonte}) não respondeu: ${S.errors[id]}. Os resultados dependentes dela estão incompletos.`, p.fonte);
      if (st === 'off') add('unk', 'Cobertura', `${p.nome} (${p.fonte}) não cobre esta região.`, p.fonte);
    });
    S.LD = LD;
  }

  /* ---------- execução ---------- */
  APP.run = async function (aoi, label) {
    const id = ++S.runId;
    Object.assign(S, { aoi, R: {}, D: {}, status: {}, errors: {}, times: {}, L: new B.Ledger(), LD: [], when: Date.now(), ledgerFilter: 'todos' });
    B.cacheClear();
    B.map.drawAOI(aoi);
    const cf = B.coordFormats(aoi.lat, aoi.lon);
    B.$('#aoiTitle').textContent = aoi.nome || label || 'Ponto analisado';
    B.$('#aoiCoords').textContent = `${cf.dec} · ${cf.utm} · ${aoi.tipo === 'ponto' ? 'raio ' + B.km(aoi.raioKm) : B.fmt(aoi.areaKm2, 1) + ' km²'}`;
    const btn = B.$('#btnRun');
    btn.disabled = true; btn.textContent = 'Analisando…';
    const br = B.maybeBrazil(aoi.lat, aoi.lon), sa = B.maybeSouthAmerica(aoi.lat, aoi.lon);
    const t0 = performance.now();
    const ctx = { aoi, L: S.L };
    B.PROVIDERS.forEach((p) => { S.status[p.id] = (p.br && !br) || (p.sa && !sa) ? 'off' : 'run'; });
    setTab(S.tab);
    const jobs = B.PROVIDERS.filter((p) => S.status[p.id] === 'run').map(async (p) => {
      const ts = performance.now();
      try {
        const data = await p.run(ctx);
        if (id !== S.runId) return;
        S.R[p.id] = data;
        S.status[p.id] = data && data._n ? 'ok' : 'empty';
        S.times[p.id] = performance.now() - ts;
        try {
          if (S.status[p.id] === 'ok') {
            if (['occ', 'mrds', 'anm', 'estr', 'aflora', 'grav', 'tect'].includes(p.id)) B.map.drawResult(p.id, data, aoi);
            if (p.id === 'geoq') B.map.drawGeochem(data, B.geochem(data));
          }
        } catch (e) { console.error(e); }
        if (p.id === 'local' && data.cc) {
          S.aoi.pais = data.cc;
          if (!aoi.nome) B.$('#aoiTitle').textContent = [data.municipio, data.uf].filter(Boolean).join(' / ') || data.pais || 'Ponto analisado';
        }
      } catch (err) {
        if (id !== S.runId) return;
        console.warn(p.id, err);
        S.status[p.id] = 'err';
        S.errors[p.id] = err.message || String(err);
        S.times[p.id] = performance.now() - ts;
      }
      if (S.R.local && S.R.local.cc && S.R.local.cc !== 'br') B.PROVIDERS.forEach((q) => { if (q.br && S.status[q.id] === 'empty') S.status[q.id] = 'off'; });
      derive();
      APP.render();
    });
    await Promise.all(jobs);
    if (id !== S.runId) return;
    derive();
    APP.renderNow();
    btn.disabled = false; btn.textContent = 'Analisar';
    const nOk = Object.values(S.status).filter((x) => x === 'ok').length;
    B.toast(`Análise concluída em ${B.fmt((performance.now() - t0) / 1000, 0)} s — ${nOk} fontes com dados.`);
  };

  APP.runPoint = function (lat, lon, raio, nome) {
    const r = raio || +B.$('#raio').value;
    B.$('#q').value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    B.$('#raio').value = String(r);
    const hist = B.store.get('historico', []).filter((h) => h.q !== B.$('#q').value);
    hist.unshift({ q: B.$('#q').value, r, nome: nome || null });
    B.store.set('historico', hist.slice(0, 10));
    try { history.replaceState(null, '', '?q=' + encodeURIComponent(B.$('#q').value) + '&r=' + r); } catch (e) { /* file:// */ }
    return APP.run(B.makeAOI({ lat, lon, raioKm: r, nome }));
  };

  async function onSubmit(ev) {
    ev.preventDefault();
    const txt = B.$('#q').value.trim();
    if (!txt) { B.toast('Digite coordenadas ou o nome de um local.'); return; }
    const c = B.parseCoords(txt);
    if (c) return APP.runPoint(c.lat, c.lon);
    try {
      B.toast('Procurando “' + txt + '”…');
      const g = await B.geocode(txt);
      if (!g) { B.toast('Não reconheci essas coordenadas nem encontrei o local. Use, por exemplo, -7.0804, -36.8446.'); return; }
      APP.runPoint(g.lat, g.lon, null, g.nome.split(',').slice(0, 2).join(','));
    } catch (e) { B.toast('Falha ao buscar o local: ' + e.message); }
  }

  async function onFile(ev) {
    const file = ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    try {
      const feats = await B.readFile(file);
      if (!feats.length) { B.toast('O arquivo não tem pontos, linhas ou polígonos legíveis.'); return; }
      const aoi = B.makeAOI({ features: feats, raioKm: +B.$('#raio').value, nome: file.name.replace(/\.(kmz|kml|geojson|json)$/i, '') });
      B.$('#q').value = `${aoi.lat.toFixed(6)}, ${aoi.lon.toFixed(6)}`;
      B.toast(`${file.name}: ${feats.length} feição(ões) — ${aoi.tipo === 'poligono' ? 'analisando o polígono' : aoi.tipo === 'linha' ? 'analisando a faixa ao longo da linha' : 'analisando o ponto'}.`);
      APP.run(aoi);
    } catch (e) { B.toast('Não consegui ler o arquivo: ' + e.message); }
  }

  /* ---------- eventos ---------- */
  APP.init = function () {
    B.map.init();
    B.ctx.init();
    B.$('#queryForm').addEventListener('submit', onSubmit);
    B.$('#file').addEventListener('change', onFile);
    B.$('#btnTheme').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark';
      applyTheme(nx); B.store.set('tema', nx); APP.renderNow();
    };
    B.$('#hintRow').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-q]'); if (!b) return;
      const c = B.parseCoords(b.dataset.q);
      APP.runPoint(c.lat, c.lon, +b.dataset.r, b.textContent.split('·')[0].trim());
    });
    B.$('#tabs').addEventListener('click', (ev) => { const b = ev.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
    const body = B.$('#tabBody');
    body.addEventListener('click', (ev) => {
      const t = ev.target;
      const go = t.closest('[data-go]'); if (go) { ev.preventDefault(); setTab(go.dataset.go); return; }
      const ov = t.closest('[data-ov]'); if (ov) { B.map.showOverlay(ov.dataset.ov, true); revealMap(); B.toast('Camada ligada no mapa. Use “Camadas” para ajustar.'); return; }
      const lc = t.closest('[data-local]'); if (lc) { B.map.soloLocal(lc.dataset.local); revealMap(); return; }
      const act = t.closest('[data-act]');
      if (act && act.dataset.act === 'v3d') { B.v3d.open(); return; }
      if (act && act.dataset.act === 'geoq-map') { B.map.L.fitBounds([[S.aoi.ctx[1], S.aoi.ctx[0]], [S.aoi.ctx[3], S.aoi.ctx[2]]]); revealMap(); return; }
      const lf = t.closest('[data-lf]'); if (lf) { S.ledgerFilter = lf.dataset.lf; APP.renderNow(); return; }
      const ex = t.closest('[data-exp]'); if (ex) { B.report.export(ex.dataset.exp); return; }
      if (t.closest('a')) return;
      const ll = t.closest('[data-ll]'); if (ll) { const [la, lo] = ll.dataset.ll.split(',').map(Number); B.map.flyTo(la, lo); revealMap(); }
    });
    function revealMap() { if (matchMedia('(max-width: 820px)').matches) B.$('.mapwrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

    // ponto inicial: ?q= na URL, último analisado ou exemplo
    let q = null, r = null;
    try { const u = new URLSearchParams(location.search); q = u.get('q'); r = +u.get('r') || null; } catch (e) { /* sem URL */ }
    const hist = B.store.get('historico', []);
    if (!q && hist.length) { q = hist[0].q; r = hist[0].r; }
    if (!q) { q = '-7.080444, -36.844558'; r = 5; }
    const c = B.parseCoords(q);
    if (c) APP.runPoint(c.lat, c.lon, r || 5, !hist.length && q.startsWith('-7.080444') ? 'Povoado de São José da Batalha (PB)' : null);
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', APP.init);
  else APP.init();
})();

</script>
