<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bateia</title>
<meta name="description" content="Bateia — plataforma aberta de prospecção mineral: geologia, ocorrências, geoquímica, geofísica, relevo e sensoriamento remoto a partir de coordenadas ou KML/KMZ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cellipse cx=%2720%27 cy=%2722%27 rx=%2717%27 ry=%279%27 fill=%27%23E4ECEB%27 stroke=%27%232E403E%27 stroke-width=%272%27/%3E%3Ccircle cx=%2723.5%27 cy=%2721%27 r=%273.2%27 fill=%27%2308899A%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: bancada de trabalho — mapa à esquerda ocupando a tela, caderno de análise à direita;
   no celular, mapa em cima e caderno embaixo. Paleta inspirada na turmalina Paraíba (acento),
   ocre do ouro e vermelho da hematita sobre neutros cinza-mineral. */
:root{
  --bg:#ECF1F0; --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E4ECEB;
  --ink:#122220; --ink-2:#2E403E; --muted:#58696A; --line:#D2DCDB; --line-2:#E3E9E8;
  --accent:#08899A; --accent-strong:#056E7C; --accent-soft:#D5EFF2; --on-accent:#FFFFFF;
  --ochre:#A97508; --hematite:#B0462A; --violet:#5653C2;
  --ok:#1D7A4C; --warn:#9A6400; --bad:#B13838;
  --obs:#08899A; --der:#5653C2; --inf:#A97508; --unk:#7A898A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --map-bg:#C9D3D2; --shadow:0 1px 2px rgba(10,30,30,.08),0 6px 24px rgba(10,30,30,.08);
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --panel-w:470px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1416; --surface:#121C1F; --surface-2:#172327; --surface-3:#1E2D32;
    --ink:#E2ECEA; --ink-2:#C2D0CE; --muted:#90A3A3; --line:#26373B; --line-2:#1E2C30;
    --accent:#2CC3D5; --accent-strong:#5ED6E4; --accent-soft:#0E3A40; --on-accent:#061416;
    --ochre:#E0AD3B; --hematite:#E27A59; --violet:#9C98F0;
    --ok:#4CC08A; --warn:#E1A53A; --bad:#EE7272;
    --obs:#2CC3D5; --der:#9C98F0; --inf:#E0AD3B; --unk:#7F9193;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --map-bg:#1A2427; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#121C1F; --surface-2:#172327; --surface-3:#1E2D32;
  --ink:#E2ECEA; --ink-2:#C2D0CE; --muted:#90A3A3; --line:#26373B; --line-2:#1E2C30;
  --accent:#2CC3D5; --accent-strong:#5ED6E4; --accent-soft:#0E3A40; --on-accent:#061416;
  --ochre:#E0AD3B; --hematite:#E27A59; --violet:#9C98F0;
  --ok:#4CC08A; --warn:#E1A53A; --bad:#EE7272;
  --obs:#2CC3D5; --der:#9C98F0; --inf:#E0AD3B; --unk:#7F9193;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --map-bg:#1A2427; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* ---------- topo ---------- */
.topbar{display:flex;align-items:center;gap:18px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;flex:none}
.bm-pan{fill:var(--surface-3);stroke:var(--ink-2);stroke-width:1.4}
.bm-ring{fill:none;stroke:var(--muted);stroke-width:1}
.bm-gem{fill:var(--accent)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-weight:780;font-stretch:122%;font-size:21px;letter-spacing:-.01em}
.brand-sub{font-size:11.5px;color:var(--muted);font-stretch:92%;letter-spacing:.02em}
.query{flex:1;display:flex;gap:8px;min-width:260px;flex-wrap:wrap}
.query input{flex:1 1 320px;min-width:0;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-family:var(--f-mono);font-size:13px}
.query input::placeholder{color:var(--muted);font-family:var(--f-ui);font-size:13px}
.query select{height:38px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-primary[disabled]{opacity:.6;cursor:progress}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.top-actions{display:flex;gap:6px}

.hint-row{display:flex;gap:8px;align-items:center;padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--surface-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.hint-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:none}
.chip-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip-btn:hover{border-color:var(--accent);color:var(--accent-strong)}

/* ---------- bancada ---------- */
.workbench{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);min-height:0}
.mapwrap{position:relative;min-height:0;background:var(--map-bg)}
.map{position:absolute;inset:0}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}

.aoi-head{padding:14px 18px 10px;border-bottom:1px solid var(--line-2)}
.aoi-title{font-weight:720;font-stretch:112%;font-size:18px;line-height:1.2;text-wrap:balance}
.aoi-coords{margin-top:4px;color:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
.sources{padding:8px 18px;border-bottom:1px solid var(--line-2)}
.src-wrap summary{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
.src-wrap summary::-webkit-details-marker{display:none}
.src-wrap summary::after{content:"ver fontes";margin-left:auto;color:var(--accent-strong);font-size:11.5px}
.src-wrap[open] summary::after{content:"ocultar"}
.src-prog{width:64px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.src-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.src-list{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.src i{width:7px;height:7px;border-radius:50%;background:var(--unk);flex:none}
.src[data-s="run"] i{background:var(--accent);animation:pulse 1s infinite ease-in-out}
.src[data-s="ok"] i{background:var(--ok)}
.src[data-s="ok"]{color:var(--ink-2)}
.src[data-s="empty"] i{background:transparent;border:1.5px solid var(--muted)}
.src[data-s="err"] i{background:var(--bad)}
.src[data-s="off"]{opacity:.55}
.src[data-s="off"] i{background:transparent;border:1.5px dashed var(--unk)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.src[data-s="run"] i{animation:none}}

.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 9px 9px;font-size:13px;font-weight:560;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .cnt{font-family:var(--f-mono);font-size:10.5px;margin-left:4px;color:var(--muted)}
.tab-body{flex:1;overflow:auto;padding:16px 18px 40px;min-height:0}

/* ---------- conteúdo ---------- */
.sec{margin:0 0 22px}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .rule{flex:1;height:1px;background:var(--line-2)}
.sec h4{margin:14px 0 6px;font-size:13.5px;font-weight:680}
.lead{font-size:15.5px;line-height:1.45;margin:0 0 6px;text-wrap:pretty}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
p{margin:0 0 8px}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:6px 0 4px}
.stat{padding:8px 10px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line-2)}
.stat b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11px;color:var(--muted)}
.callout{padding:10px 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;margin:8px 0}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.callout.good{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.callout.info{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--muted)}
.chip.hot{border-color:var(--accent);background:var(--accent-soft)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:3px;white-space:nowrap;vertical-align:1px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.obs{color:var(--obs);background:color-mix(in srgb,var(--obs) 12%,transparent)}
.tag.der{color:var(--der);background:color-mix(in srgb,var(--der) 13%,transparent)}
.tag.inf{color:var(--inf);background:color-mix(in srgb,var(--inf) 14%,transparent)}
.tag.unk{color:var(--unk);background:color-mix(in srgb,var(--unk) 14%,transparent)}
.tag.unk::before{background:transparent;border:1.5px dashed currentColor;width:4px;height:4px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r);margin:6px 0}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tr.anom td{background:color-mix(in srgb,var(--hematite) 9%,transparent)}
.tbl tr[data-ll]{cursor:pointer}
.tbl tr[data-ll]:hover td{background:var(--surface-2)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.2);vertical-align:-2px;margin-right:6px}

.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;position:relative}
.bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar.conf > i{background:var(--unk)}

.model{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;margin:0 0 10px;background:var(--surface)}
.model-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.model-name{font-weight:700;font-size:14.5px}
.model-sub{font-size:12px;color:var(--muted)}
.model-score{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.model-score small{font-size:11px;color:var(--muted);margin-left:2px}
.model .bars{display:grid;grid-template-columns:72px 1fr 40px;gap:6px 8px;align-items:center;margin:9px 0 6px;font-size:11.5px;color:var(--muted)}
.model .bars .num{text-align:right;color:var(--ink-2)}
.ev-list{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;display:grid;gap:3px}
.ev-list li{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:baseline}
.ev-list .ic{font-family:var(--f-mono);text-align:center}
.ev-list .ic.y{color:var(--ok)} .ev-list .ic.p{color:var(--warn)} .ev-list .ic.n{color:var(--muted)} .ev-list .ic.u{color:var(--unk)}
.ev-list .w{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
details.more{margin-top:6px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--accent-strong)}

.ledger{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ledger li{padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px;background:var(--surface)}
.ledger .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.figure{margin:8px 0 4px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);padding:8px;overflow-x:auto}
.figure svg{display:block;max-width:100%;height:auto}
.figure figcaption,.cap{font-size:11.5px;color:var(--muted);margin-top:4px}
.imgrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.imgcard{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.imgcard img,.imgcard canvas{display:block;width:100%;aspect-ratio:1;object-fit:cover;image-rendering:auto;background:var(--surface-3)}
.imgcard .cap{padding:6px 8px;margin:0;font-size:11.5px;color:var(--ink-2)}
.imgcard .cap span{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.imgcard button{all:unset;display:block;cursor:pointer}
.imgcard button:focus-visible{outline:2px solid var(--accent)}

.empty{padding:28px 6px;text-align:center;color:var(--muted);font-size:13px}
.empty strong{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

/* ---------- mapa ---------- */
.map-panel{position:absolute;top:10px;right:10px;z-index:500;max-width:min(300px,calc(100% - 20px))}
.map-panel-toggle{display:flex;align-items:center;gap:6px;margin-left:auto;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:600;font-size:13px}
.map-panel-toggle svg{width:17px;height:17px}
.map-panel-body{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;max-height:min(62vh,560px);overflow:auto;font-size:12.5px}
.map-panel-body h5{margin:10px 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.map-panel-body h5:first-child{margin-top:0}
.map-panel-body label{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer}
.map-panel-body .base-sub{margin:7px 0 2px;padding-top:6px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.map-panel-body .base-nota{margin:4px 0 2px 21px;font-size:11.5px}
.map-panel-body .base-nota a{color:var(--accent)}
.glogo{margin:0 0 6px 10px!important;line-height:0;pointer-events:none}
.glogo img{height:18px;width:auto;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
.leaflet-container.g-on ~ .map-readout,.mapwrap:has(.g-on) .map-readout{bottom:46px}
.passos{margin:6px 0 8px;padding-left:20px;display:grid;gap:4px}
.passos li{line-height:1.45}
.map-panel-body .opacity{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted)}
.map-panel-body .opacity input{flex:1}
.map-readout{position:absolute;left:10px;bottom:22px;z-index:500;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-family:var(--f-mono);font-size:11.5px;pointer-events:none}
.map-readout:empty{display:none}
.leaflet-container{background:var(--map-bg);font-family:var(--f-ui)}
.leaflet-bar a,.leaflet-control-zoom a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.45;max-width:300px}
.leaflet-popup-content h6{margin:0 0 4px;font-size:13px}
.leaflet-control-scale-line{background:color-mix(in srgb,var(--surface) 80%,transparent);border-color:var(--ink-2);color:var(--ink)}

/* ---------- menu do botão direito ---------- */
.ctxmenu{position:fixed;z-index:2500;width:344px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;font-size:13px}
.ctx-head{display:flex;align-items:center;gap:8px;padding:5px 6px 7px 10px;border-bottom:1px solid var(--line-2);margin-bottom:2px}
.ctx-head .mono{font-size:12px;color:var(--ink-2);flex:1;min-width:0}
.ctx-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:7px 10px 2px;display:flex;justify-content:space-between}
.ctx-hint{text-transform:none;letter-spacing:0;font-size:10.5px;padding-right:2px}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:5px 10px;border-radius:5px;cursor:pointer;text-align:left;min-height:31px;color:var(--ink)}
.ctx-item:hover,.ctx-item:focus-visible{background:var(--surface-2);outline:none}
.ctx-item svg{width:16px;height:16px;flex:none;color:var(--muted)}
.ctx-item:hover svg,.ctx-item:focus-visible svg{color:var(--accent-strong)}
.ctx-item .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 7px}
.ctx-row{display:flex;align-items:center;gap:4px;padding-right:4px}
.ctx-row .ctx-item{flex:1;min-width:0}
.ctx-raios{display:flex;gap:2px;flex:none}
.ctx-raios button{border:1px solid var(--line);background:var(--surface);border-radius:4px;font-family:var(--f-mono);font-size:11px;min-width:22px;height:22px;padding:0 3px;cursor:pointer;color:var(--ink-2)}
.ctx-raios button:hover,.ctx-raios button:focus-visible{border-color:var(--accent);outline:none}
.ctx-raios button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ctx-sep{height:1px;background:var(--line-2);margin:4px 6px}
.ctx-mini{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 8px;font-size:11.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.ctx-mini:hover,.ctx-mini:focus-visible{border-color:var(--accent);color:var(--accent-strong);outline:none}

/* ---------- ficha do ponto (sobre o mapa) ---------- */
.insp{position:absolute;z-index:600;top:10px;left:54px;width:min(384px,calc(100% - 64px));max-height:calc(100% - 52px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.insp-head{display:flex;gap:10px;align-items:flex-start;padding:10px 8px 9px 14px;border-bottom:1px solid var(--line-2);flex:none}
.insp-ttl{min-width:0;flex:1}
.insp-kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-strong);font-weight:650}
.insp-title{font-weight:700;font-stretch:108%;font-size:15.5px;line-height:1.25;margin-top:1px;text-wrap:balance}
.insp-sub{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.insp-x{flex:none;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:5px}
.insp-x:hover{background:var(--surface-2);color:var(--ink)}
.insp-body{overflow:auto;padding:12px 14px 14px;font-size:13px;min-height:0}
.insp-body .sec{margin-bottom:14px}
.insp-body .kv{grid-template-columns:minmax(96px,34%) 1fr;font-size:12.5px}
.insp-foot{border-top:1px solid var(--line-2);padding-top:10px;margin-bottom:0}
.insp-foot .btn-sm{height:28px;padding:0 9px;font-size:12px}
.insp-body a[data-act]{display:inline-block;margin-top:4px}
.cpy{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;line-height:1;vertical-align:-3px}
.cpy svg{width:14px;height:14px}
.cpy:hover{color:var(--accent-strong)}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.ctab td{padding:5px 4px;border-bottom:1px solid var(--line-2);vertical-align:top}
.ctab tr:last-child td{border-bottom:0}
.ctab td:first-child{color:var(--muted);width:36%}
.ctab td.v{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.ctab td.c{width:22px;text-align:right}
.ctab tr[data-act]{cursor:pointer}
.ctab tr[data-act]:hover td{background:var(--surface-2)}
.ctab.geo td:first-child{width:28%}
.ctab.geo td:nth-child(2){display:flex;align-items:center;gap:6px}
.gbar{flex:1;height:7px;border-radius:4px;background:var(--surface-3);position:relative;overflow:hidden;min-width:50px}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.olist{list-style:none;margin:6px 0;padding:0;display:grid;gap:6px}
.olist li{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;cursor:pointer;font-size:12.5px}
.olist li:hover{background:var(--surface-2)}
.olist .d{float:right;margin-left:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.proc{border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;margin:0 0 8px}
.proc .actions{margin-bottom:0}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.chip[data-act]{cursor:pointer}
.form{display:grid;gap:9px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:7px 9px;font-size:13px;color:var(--ink);width:100%}
.form textarea{min-height:64px;resize:vertical}
svg.perfil{display:block;width:100%;height:auto;touch-action:none}
svg.perfil .pg{stroke:var(--line-2)}
svg.perfil .pt{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
svg.perfil .pa{fill:var(--accent);fill-opacity:.14}
svg.perfil .pl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
svg.perfil .pab{fill:var(--ink);font-size:11px;font-weight:700}
svg.perfil .pc{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
svg.perfil .pd{fill:var(--hematite);stroke:var(--surface);stroke-width:1.5}
svg.perfil .pr{fill:var(--ink);font-size:11px;font-family:var(--f-mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.ab-pin{display:grid!important;place-items:center;background:var(--ink);color:var(--surface);border:2px solid #fff;border-radius:50%;font:700 11px/1 var(--f-ui);box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* ---------- barra de desenho ---------- */
.drawbar{position:absolute;z-index:650;left:50%;transform:translateX(-50%);bottom:48px;display:grid;justify-items:center;gap:7px;width:max-content;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:9px 12px 8px;font-size:12.5px;text-align:center}
.drawbar b{font-weight:700}
.drawbar .db-top{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;justify-content:center}
.drawbar .db-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.drawbar .mono{font-size:12px}
.drawbar .hint{color:var(--muted);font-size:11px}
.leaflet-container.desenhando,.leaflet-container.desenhando .leaflet-interactive{cursor:crosshair}
.medida-tip{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-family:var(--f-mono);font-size:11px;padding:1px 5px;box-shadow:none}
.medida-tip::before{display:none}

/* ---------- 3D ---------- */
.viewer3d{position:fixed;inset:0;z-index:2000;background:#0B1214;display:flex;flex-direction:column;color:#E2ECEA;padding-top:env(safe-area-inset-top,0px)}
.v3d-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #22343A;font-size:13px;background:#101A1D}
.v3d-bar strong{font-stretch:115%;font-size:15px}
.v3d-bar label{display:flex;gap:8px;align-items:center;color:#A9BDBD}
.v3d-bar select{background:#18262A;border:1px solid #2B4046;border-radius:4px;padding:4px 6px;color:#E2ECEA}
.v3d-bar .btn{color:#E2ECEA;border-color:#2B4046;height:32px;margin-left:auto}
.v3d-bar .btn:hover{background:#18262A}
.v3d-bar output{font-family:var(--f-mono);min-width:3.5em}
.v3d-canvas{flex:1;min-height:0;position:relative}
.v3d-canvas canvas{display:block;width:100%;height:100%}
.v3d-tip{position:fixed;z-index:2001;pointer-events:none;background:#101A1DEE;border:1px solid #2B4046;border-radius:4px;padding:5px 8px;font-size:12px;max-width:260px}
.v3d-legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:#A9BDBD;background:#101A1DCC;border:1px solid #22343A;border-radius:4px;padding:6px 9px;max-width:min(420px,calc(100% - 32px))}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3000;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- relatório ---------- */
.report{font-size:13.5px;line-height:1.55}
.report h1{font-stretch:115%;font-size:22px;margin:0 0 4px;line-height:1.2}
.report h2{font-size:15px;margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.report table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.report th,.report td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.report th{background:var(--surface-2)}

@media (max-width:980px){
  :root{--panel-w:400px}
}
@media (max-width:820px){
  .app{height:auto;min-height:100%}
  .workbench{grid-template-columns:minmax(0,1fr)}
  .mapwrap{height:58vh;min-height:340px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .tab-body{overflow:visible}
  .brand-sub{display:none}
  .topbar{gap:10px}
  .query{min-width:100%;order:3}
  .top-actions{margin-left:auto}
  .query input{flex-basis:100%}
  .insp{position:fixed;z-index:1500;left:0;right:0;bottom:0;top:auto;width:auto;max-height:62vh;border-radius:12px 12px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 28px rgba(10,30,30,.18)}
  .drawbar{max-width:calc(100% - 16px);bottom:8px}
}
@media print{
  .topbar,.hint-row,.mapwrap,.sources,.tabs,.aoi-head,.actions,.viewer3d,.toast,.ctxmenu{display:none!important}
  .app,.workbench,.panel,.tab-body{display:block;height:auto;overflow:visible;border:0}
  body{background:#fff;color:#000}
}

</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="22" rx="17" ry="9" class="bm-pan"/>
        <ellipse cx="20" cy="22" rx="11" ry="5.2" class="bm-ring"/>
        <ellipse cx="20" cy="22" rx="5" ry="2.4" class="bm-ring"/>
        <circle cx="23.5" cy="21.2" r="2.1" class="bm-gem"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Bateia</span>
        <span class="brand-sub">Prospecção mineral por coordenada</span>
      </div>
    </div>

    <form class="query" id="queryForm" autocomplete="off">
      <label class="sr" for="q">Coordenadas, UTM ou local</label>
      <input id="q" name="q" type="text" spellcheck="false"
        placeholder="-7.0804, -36.8446 · 7°04'49&quot;S 36°50'40&quot;W · 24M 738085 9216806 · nome do local">
      <label class="sr" for="raio">Raio de análise</label>
      <select id="raio" name="raio" title="Raio da área de interesse">
        <option value="1">1 km</option>
        <option value="2">2 km</option>
        <option value="5" selected>5 km</option>
        <option value="10">10 km</option>
        <option value="20">20 km</option>
        <option value="40">40 km</option>
      </select>
      <button class="btn btn-primary" id="btnRun" type="submit">Analisar</button>
      <label class="btn btn-ghost file-btn" for="file" title="Carregar KML, KMZ ou GeoJSON">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M5.5 7.5 10 3l4.5 4.5M4 13v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        KML / KMZ
      </label>
      <input id="file" type="file" accept=".kml,.kmz,.geojson,.json" hidden>
    </form>

    <div class="top-actions">
      <button class="btn btn-ghost" id="btnTheme" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="hint-row" id="hintRow">
    <span class="hint-label">Exemplos</span>
    <button type="button" class="chip-btn" data-q="-7.080444, -36.844558" data-r="5">São José da Batalha (PB) · turmalina</button>
    <button type="button" class="chip-btn" data-q="-20.1167, -43.9000" data-r="10">Quadrilátero Ferrífero (MG) · ferro/ouro</button>
    <button type="button" class="chip-btn" data-q="-6.0703, -50.1650" data-r="10">Carajás (PA) · ferro/cobre</button>
    <button type="button" class="chip-btn" data-q="-16.7300, -42.0150" data-r="10">Vale do Jequitinhonha (MG) · lítio</button>
    <button type="button" class="chip-btn" data-q="39.7475, -105.5150" data-r="10">Colorado (EUA) · fora do Brasil</button>
  </div>

  <main class="workbench">
    <section class="mapwrap" aria-label="Mapa">
      <div id="map" class="map"></div>
      <div class="map-panel" id="layerPanel">
        <button class="map-panel-toggle" id="layerToggle" type="button" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3 2.5 7 10 11l7.5-4L10 3zM2.5 10.5 10 14.5l7.5-4M2.5 14 10 18l7.5-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Camadas
        </button>
        <div class="map-panel-body" id="layerBody" hidden></div>
      </div>
      <div class="map-readout" id="readout" aria-live="polite"></div>
      <div class="drawbar" id="drawbar" role="toolbar" aria-label="Ferramenta de desenho" hidden></div>
      <aside class="insp" id="insp" aria-label="Ficha do ponto" hidden>
        <header class="insp-head">
          <div class="insp-ttl">
            <div class="insp-kicker" id="inspKicker"></div>
            <div class="insp-title" id="inspTitle"></div>
            <div class="insp-sub" id="inspSub"></div>
          </div>
          <button class="insp-x" id="inspClose" type="button" aria-label="Fechar a ficha">×</button>
        </header>
        <div class="insp-body" id="inspBody"></div>
      </aside>
    </section>

    <section class="panel" aria-label="Resultados">
      <div class="aoi-head" id="aoiHead">
        <div class="aoi-title" id="aoiTitle">Nenhuma área analisada</div>
        <div class="aoi-coords" id="aoiCoords">Digite coordenadas, clique no mapa ou carregue um KML/KMZ.</div>
      </div>
      <div class="sources" id="sources" aria-label="Fontes de dados"></div>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="sintese" aria-selected="true">Síntese</button>
        <button role="tab" data-tab="geologia">Geologia</button>
        <button role="tab" data-tab="minerios">Minérios</button>
        <button role="tab" data-tab="geoquimica">Geoquímica</button>
        <button role="tab" data-tab="geofisica">Geofísica</button>
        <button role="tab" data-tab="relevo">Relevo e 3D</button>
        <button role="tab" data-tab="espectral">Espectral</button>
        <button role="tab" data-tab="potencial">Potencial</button>
        <button role="tab" data-tab="evidencias">Evidências</button>
        <button role="tab" data-tab="relatorio">Relatório</button>
      </nav>
      <div class="tab-body" id="tabBody"></div>
    </section>
  </main>

  <div class="viewer3d" id="viewer3d" hidden>
    <div class="v3d-bar">
      <strong>Bloco 3D</strong>
      <label>Cobertura
        <select id="v3dDrape"></select>
      </label>
      <label>Exagero vertical
        <input id="v3dExag" type="range" min="1" max="8" step="0.5" value="2.5">
        <output id="v3dExagOut">2,5×</output>
      </label>
      <label class="chk"><input id="v3dPins" type="checkbox" checked> Ocorrências</label>
      <button class="btn btn-ghost" id="v3dClose" type="button">Fechar</button>
    </div>
    <div class="v3d-canvas" id="v3dCanvas"></div>
    <div class="v3d-tip" id="v3dTip" hidden></div>
    <div class="v3d-legend" id="v3dLegend"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="ctxmenu" id="ctxmenu" role="menu" aria-label="Opções do ponto" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* Bateia — núcleo: utilidades, rede, cache, matemática geográfica e o
   livro de evidências (modelo herdado do REA: observado / derivado / inferido / desconhecido). */
(function () {
  'use strict';
  const B = (window.B = window.B || {});
  B.VERSION = '1.0.0';

  /* ---------- DOM ---------- */
  B.$ = (s, r = document) => r.querySelector(s);
  B.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  B.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  B.toast = (msg, ms = 3200) => {
    const t = B.$('#toast');
    if (!t) return;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(B._toastT);
    B._toastT = setTimeout(() => (t.hidden = true), ms);
  };

  /* ---------- números e formatação (pt-BR) ---------- */
  const nf = {};
  B.fmt = (v, d = 0) => {
    if (v == null || !isFinite(v)) return '—';
    const k = 'd' + d;
    nf[k] = nf[k] || new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
    return nf[k].format(v);
  };
  B.fmtSig = (v) => {
    if (v == null || !isFinite(v)) return '—';
    const a = Math.abs(v);
    return B.fmt(v, a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3);
  };
  B.km = (v) => (v == null || !isFinite(v) ? '—' : v < 1 ? B.fmt(v * 1000, 0) + ' m' : B.fmt(v, v < 10 ? 1 : 0) + ' km');
  B.pct = (v, d = 0) => (v == null || !isFinite(v) ? '—' : B.fmt(v * 100, d) + '%');
  /* SGB devolve "-36,937803" e "Null" como texto */
  B.num = (v) => {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).trim();
    if (!s || /^null$/i.test(s)) return null;
    const n = parseFloat(s.replace(/\s/g, '').replace(',', '.'));
    return isFinite(n) ? n : null;
  };
  B.clean = (v) => {
    if (v == null) return null;
    const s = String(v).trim();
    return !s || /^(null|none|n\/a|-)$/i.test(s) || s === ' ' ? null : s;
  };
  B.cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  B.norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  B.uniq = (a) => Array.from(new Set(a));
  B.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  B.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ---------- estatística ---------- */
  B.stats = {
    sorted: (a) => a.filter((v) => v != null && isFinite(v)).sort((x, y) => x - y),
    q(sorted, p) {
      if (!sorted.length) return null;
      const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
    },
    summary(arr) {
      const s = B.stats.sorted(arr);
      if (!s.length) return null;

      if (this.tipo === 'linha') return B.geo.distToLine(la, lo, this.line) <= this.bufferKm;
      return B.geo.dist(this.lat, this.lon, la, lo) <= this.raioKm;
    };
    aoi.dist = function (la, lo) { return B.geo.dist(this.lat, this.lon, la, lo); };
    aoi.areaKm2 = aoi.areaKm2 || (aoi.tipo === 'ponto' ? Math.PI * aoi.raioKm * aoi.raioKm : B.geo.bboxKm(aoi.bbox).reduce((a, b) => a * b, 1));
    return aoi;
  };
})();

/* Bateia — provedores de dados. Cada provedor consulta uma fonte pública, normaliza a
   resposta e registra evidências. Fontes e endpoints foram mapeados observando as
   requisições do próprio GeoSGB (método REA de observação de website). */
(function () {
  'use strict';
  const B = window.B;
  const SGB = 'https://geoportal.sgb.gov.br/server/rest/services/';
  const SGBI = 'https://geoportal.sgb.gov.br/image/rest/services/';
  const ANM = 'https://geo.anm.gov.br/arcgis/rest/services/SIGMINE/';
  const MRDS = 'https://energy.usgs.gov/arcgis/rest/services/MRData/Mineral_Resource_Data_System/FeatureServer/3';
  B.URLS = { SGB, SGBI, ANM, MRDS };
  const env = (b) => b.map((v) => +v.toFixed(6)).join(',');
  const rad = Math.PI / 180;

  /* ---------- ArcGIS REST ---------- */
  B.ags = {
    identifyEnv(svc, bbox, o = {}) {
      const p = { f: 'json', geometry: env(bbox), geometryType: 'esriGeometryEnvelope', sr: 4326, layers: o.layers || 'all', tolerance: 0, mapExtent: env(bbox), imageDisplay: '800,800,96', returnGeometry: !!o.returnGeometry, maxAllowableOffset: o.maxOffset, layerDefs: o.layerDefs ? JSON.stringify(o.layerDefs) : null };
      return B.fetchJSON(svc + '/identify?' + B.qs(p), { timeout: o.timeout || 30000 }).then((j) => j.results || []);
    },
    identifyPt(svc, lat, lon, o = {}) {
      const d = o.extentDeg || 0.05;
      const p = { f: 'json', geometry: `${lon},${lat}`, geometryType: 'esriGeometryPoint', sr: 4326, layers: o.layers || 'all', tolerance: o.tolPx == null ? 1 : o.tolPx, mapExtent: env([lon - d, lat - d, lon + d, lat + d]), imageDisplay: '400,400,96', returnGeometry: !!o.returnGeometry };
      return B.fetchJSON(svc + '/identify?' + B.qs(p), { timeout: o.timeout || 25000 }).then((j) => j.results || []);
    },
    query(layer, bbox, o = {}) {
      const p = { f: 'json', where: o.where || '1=1', geometry: env(bbox), geometryType: 'esriGeometryEnvelope', inSR: 4326, outSR: 4326, spatialRel: 'esriSpatialRelIntersects', outFields: o.outFields || '*', returnGeometry: o.returnGeometry !== false, maxAllowableOffset: o.maxOffset };
      return B.fetchJSON(layer + '/query?' + B.qs(p), { timeout: o.timeout || 30000 }).then((j) => ({ features: j.features || [], truncado: !!j.exceededTransferLimit }));
    },
    imageURL(svc, bbox, w, h, image = true) {
      const p = image
        ? { f: 'image', bbox: env(bbox), bboxSR: 4326, imageSR: 4326, size: `${w},${h}`, format: 'png', interpolation: 'RSP_BilinearInterpolation' }
        : { f: 'image', bbox: env(bbox), bboxSR: 4326, imageSR: 4326, size: `${w},${h}`, format: 'png32', transparent: true, dpi: 96 };
      return svc + (image ? '/exportImage?' : '/export?') + B.qs(p);
    },
  };
  const A = (a, k) => B.clean(a[k]);

  /* ---------- tabelas de apoio ---------- */
  B.MRDS_CODES = { AU: 'ouro', AG: 'prata', CU: 'cobre', PB: 'chumbo', ZN: 'zinco', FE: 'ferro', MN: 'manganês', W: 'tungstênio', SN: 'estanho', TA: 'tântalo', NB: 'nióbio', BE: 'berílio', LI: 'lítio', U: 'urânio', TH: 'tório', REE: 'terras raras', REO: 'terras raras', NI: 'níquel', CR: 'cromo', CO: 'cobalto', PGE: 'platinoides', PT: 'platina', PD: 'paládio', MO: 'molibdênio', BA: 'bário', BRT: 'barita', F: 'flúor', FLR: 'fluorita', P: 'fosfato', PHO: 'fosfato', GEM: 'gemas', KAO: 'caulim', CLY: 'argila', STN: 'rocha (cantaria)', SDG: 'areia e cascalho', LST: 'calcário', DIA: 'diamante', QTZ: 'quartzo', MIC: 'mica', FLD: 'feldspato', GRF: 'grafita', TLC: 'talco', ASB: 'amianto', VRM: 'vermiculita', AL: 'alumínio', BX: 'bauxita', TI: 'titânio', ZR: 'zircônio', BI: 'bismuto', SB: 'antimônio', AS: 'arsênio', HG: 'mercúrio', MG: 'magnésio', MGS: 'magnesita', GYP: 'gipsita', SALT: 'sal', K: 'potássio', COL: 'carvão', V: 'vanádio', CD: 'cádmio', GE: 'germânio', GA: 'gálio', IN: 'índio', TE: 'telúrio', SE: 'selênio', S: 'enxofre', PYR: 'pirita', DOL: 'dolomito', MRB: 'mármore', GRN: 'granito', PER: 'perlita', ZEO: 'zeólita', BEN: 'bentonita', SIL: 'sílica', IRN: 'ferro', CS: 'césio', RB: 'rubídio', SC: 'escândio', Y: 'ítrio', HF: 'háfnio', RE: 'rênio', CLN: 'caulim', ABR: 'abrasivos', GAR: 'granada', CRN: 'coríndon', CYN: 'cianita', AND: 'andaluzita', SLM: 'silimanita', BOR: 'boro', NA: 'sódio', IOD: 'iodo', BR: 'bromo', N: 'nitrato', WOL: 'wolastonita', ORN: 'rocha ornamental' };

  /* ---------- 1. Localidade ---------- */
  async function local(ctx) {
    const { aoi } = ctx;
    const j = await B.fetchJSON('https://nominatim.openstreetmap.org/reverse?' + B.qs({ lat: aoi.lat, lon: aoi.lon, format: 'jsonv2', zoom: 10, 'accept-language': 'pt-BR' }), { timeout: 15000 });
    const a = j.address || {};
    return {
      municipio: a.city || a.town || a.village || a.municipality || a.county || null,
      uf: a.state || null, pais: a.country || null, cc: (a.country_code || '').toLowerCase(), regiao: a.region || a.state_district || null,
      nome: j.display_name, _n: 1,
    };
  }

  /* ---------- 2. Litoestratigrafia (SGB) ---------- */
  const parseUnit = (a) => ({
    sigla: A(a, 'Sigla da unidade'), nome: A(a, 'Nome da unidade'), hierarquia: A(a, 'Hierarquia'),
    litotipos: A(a, 'Litótipos'), legenda: A(a, 'Legenda'), pai: A(a, 'Nome da unidade pai'),
    idadeMin: B.num(a['Idade mínima']), idadeMax: B.num(a['Idade máxima']),
    eon: A(a, 'Eon máximo'), eraMax: A(a, 'Era máxima'), eraMin: A(a, 'Era mínima'),
    perMax: A(a, 'Período máximo'), perMin: A(a, 'Período mínimo'),
    ambiente: A(a, 'Ambiente tectônico'), subambiente: A(a, 'Sub-ambiente tectônico'),
    mapa: A(a, 'Mapa'), escalaMapa: A(a, 'Escala'),
  });
  B.parseUnit = parseUnit;
  const LITO =[['100000', '1:100.000'], ['250000', '1:250.000'], ['1000000', '1:1.000.000']];
  B.litoSvc = (k) => SGB + 'geologia/litoestratigrafia_' + k + '/MapServer';

  async function lito(ctx) {
    const { aoi, L } = ctx;
    const pts = await Promise.all(LITO.map(([k, esc]) =>
      B.ags.identifyPt(B.litoSvc(k), aoi.lat, aoi.lon, { tolPx: 0, extentDeg: 0.02 })
        .then((r) => ({ k, esc, u: r[0] ? parseUnit(r[0].attributes) : null }))
        .catch((e) => ({ k, esc, err: e.message }))));
    const pontual = pts.filter((p) => p.u).map((p) => Object.assign({ escala: p.esc, k: p.k }, p.u));
    if (!pontual.length) return { _n: 0, pontual: [], area: [] };
    const best = pontual[0];
    const svc = B.litoSvc(best.k);
    const [wKm] = B.geo.bboxKm(aoi.bbox);
    const res = await B.ags.identifyEnv(svc, aoi.bbox, { returnGeometry: true, maxOffset: Math.max(0.0002, wKm / 111 / 400), timeout: 40000 });
    const polys = res.map((r) => ({ u: parseUnit(r.attributes), rings: B.geo.ringsLL(r.geometry && r.geometry.rings) }));
    // fração de área por amostragem em grade
    const N = 44, b = aoi.bbox, cnt = {}, colorVotes = {};
    let inside = 0;
    let img = null;
    try {
      const blob = await B.fetchBlob(B.ags.imageURL(svc, b, N * 4, N * 4, false), { timeout: 25000 });
      img = await B.blobToImageData(blob);
    } catch (e) { img = null; }
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const lon = b[0] + ((j + 0.5) / N) * (b[2] - b[0]), lat = b[3] - ((i + 0.5) / N) * (b[3] - b[1]);
      if (!aoi.contains(lat, lon)) continue;
      inside++;
      const hit = polys.find((p) => p.rings.length && B.geo.inRings(lat, lon, p.rings));
      if (!hit) continue;
      const key = hit.u.sigla || hit.u.nome;
      cnt[key] = (cnt[key] || 0) + 1;
      if (img) {
        const px = Math.min(img.w - 1, Math.floor(((j + 0.5) / N) * img.w)), py = Math.min(img.h - 1, Math.floor(((i + 0.5) / N) * img.h));
        const o = (py * img.w + px) * 4, d = img.data;
        if (d[o + 3] > 200) {
          const c = `${d[o]},${d[o + 1]},${d[o + 2]}`;
          if (!(d[o] < 40 && d[o + 1] < 40 && d[o + 2] < 40)) { colorVotes[key] = colorVotes[key] || {}; colorVotes[key][c] = (colorVotes[key][c] || 0) + 1; }
        }
      }
    }
    const seen = new Map();
    polys.forEach((p) => {
      const key = p.u.sigla || p.u.nome;
      if (!seen.has(key)) seen.set(key, Object.assign({}, p.u, { rings: [] }));
      seen.get(key).rings.push(...p.rings);
    });
    const area = Array.from(seen.entries()).map(([key, u]) => {
      const votes = colorVotes[key] || {};
      const col = Object.entries(votes).sort((x, y) => y[1] - x[1])[0];
      return Object.assign(u, { key, frac: inside ? (cnt[key] || 0) / inside : 0, cor: col ? `rgb(${col[0]})` : null });
    }).sort((x, y) => y.frac - x.frac);
    const fonte = 'SGB — Litoestratigrafia ' + best.escala;
    L.add('obs', 'Geologia', `No ponto central aflora ${best.sigla || ''} ${best.nome ? '— ' + best.nome : ''}${best.litotipos ? ' (' + best.litotipos.toLowerCase() + ')' : ''}.`, fonte, { url: svc, escala: best.escala, ref: best.mapa });
    if (area.length > 1) L.add('obs', 'Geologia', `${area.length} unidades litoestratigráficas intersectam a área; a dominante é ${area[0].sigla} (${B.pct(area[0].frac)} da área amostrada).`, fonte, { url: svc, escala: best.escala });
    if (best.idadeMax) L.add('obs', 'Geologia', `Idade da unidade central: ${B.fmt(best.idadeMin)}–${B.fmt(best.idadeMax)} Ma (${best.eraMax || ''}${best.perMax ? ', ' + best.perMax : ''}).`, fonte, { url: svc });
    return { _n: area.length, pontual, area, svc, escala: best.escala };
  }

  /* ---------- 3. Macrostrat (cobertura global, escala pequena) ---------- */
  async function macro(ctx) {
    const { aoi, L } = ctx;
    const j = await B.fetchJSON('https://macrostrat.org/api/v2/geologic_units/map?' + B.qs({ lat: aoi.lat, lng: aoi.lon }), { timeout: 20000 });
    const d = ((j.success && j.success.data) || []).map((u) => ({ nome: u.name, lito: u.lith, de: u.b_int_name, ate: u.t_int_name, idadeMax: u.b_age, idadeMin: u.t_age, desc: u.descrip, cor: u.color, escala: u.scale, strat: u.strat_name, fonte: u.source_id }));
    if (d.length) L.add('obs', 'Geologia', `Macrostrat: ${d[0].nome} — ${d[0].lito} (${d[0].de}${d[0].ate && d[0].ate !== d[0].de ? '–' + d[0].ate : ''}).`, 'Macrostrat (mapa global, escala ' + (d[0].escala || 'pequena') + ')', { url: 'https://macrostrat.org' });
    return { _n: d.length, unidades: d };
  }

  /* ---------- 4. Estruturas (falhas, zonas de cisalhamento, lineamentos) ---------- */
  async function estruturas(ctx) {
    const { aoi, L } = ctx;
    const win = B.geo.expand(aoi.bbox, Math.max(5, aoi.raioKm));
    const { features, truncado } = await B.ags.query(SGB + 'geologia/Estruturas_GIS_Brasil_2004/MapServer/0', win, { maxOffset: 0.0004, outFields: 'TIPO_ESTRU,NMESTRUTUR,ANG_NORTE,MERGULHO,EVENTO_ORO,REGIME_TEC,SENTIDO_DE,NOME_MAPA,ESCALA' });
    const lines = [];
    features.forEach((f) => ((f.geometry && f.geometry.paths) || []).forEach((p) => lines.push({ pts: p.map(([x, y]) => [y, x]), tipo: B.clean(f.attributes.TIPO_ESTRU) || 'Estrutura', nome: B.clean(f.attributes.NMESTRUTUR), evento: B.clean(f.attributes.EVENTO_ORO), regime: B.clean(f.attributes.REGIME_TEC), mapa: B.clean(f.attributes.NOME_MAPA) })));
    const rose = new Array(18).fill(0), tipos = {};
    let nearest = null, inAOI = 0, kmTotal = 0;
    lines.forEach((l) => {
      for (let i = 1; i < l.pts.length; i++) {
        const a = l.pts[i - 1], b = l.pts[i];
        const len = B.geo.dist(a[0], a[1], b[0], b[1]);
        const az = B.geo.bearing(a[0], a[1], b[0], b[1]) % 180;
        rose[Math.floor(az / 10) % 18] += len;
        kmTotal += len;
      }
      const d = B.geo.distToLine(aoi.lat, aoi.lon, l.pts);
      l.dist = d;
      if (!nearest || d < nearest.dist) nearest = l;
      const hits = aoi.tipo === 'ponto' ? d <= aoi.raioKm : l.pts.some((p) => aoi.contains(p[0], p[1]));
      l.naArea = hits;
      if (hits) { inAOI++; tipos[l.tipo] = (tipos[l.tipo] || 0) + 1; }
    });
    const fonte = 'SGB — Estruturas GIS Brasil (1:1.000.000)';
    if (lines.length) {
      L.add('obs', 'Estrutural', `${inAOI} traço(s) estrutural(is) mapeado(s) na área; o mais próximo do centro (${nearest.tipo.toLowerCase()}) está a ${B.km(nearest.dist)}.`, fonte, { url: SGB + 'geologia/Estruturas_GIS_Brasil_2004/MapServer', escala: '1:1.000.000' });
    } else {
      L.add('unk', 'Estrutural', `Nenhuma estrutura cartografada a menos de ${B.km(Math.max(5, aoi.raioKm))} na escala 1:1.000.000. Estruturas menores não aparecem nessa escala.`, fonte);
    }
    return { _n: lines.length, lines, rose, tipos, nearest: nearest ? { dist: nearest.dist, tipo: nearest.tipo, nome: nearest.nome } : null, inAOI, kmTotal, truncado };
  }

  /* ---------- 5. Contexto tectônico (Mapa Tectônico da América do Sul — SGB/CGMW) ---------- */
  async function tectonica(ctx) {
    const { aoi, L } = ctx;
    const svc = SGB + 'sigs_especiais/tecams/MapServer';
    const reg = B.geo.expand(aoi.bbox, 120);
    const [ptR, kimb, dikes, sut] = await Promise.all([
      B.ags.identifyPt(svc, aoi.lat, aoi.lon, { layers: 'all:20', tolPx: 0, extentDeg: 0.5 }).catch(() => []),
      B.ags.query(svc + '/3', reg, { outFields: 'source,age' }).catch(() => ({ features: [] })),
      B.ags.query(svc + '/5', B.geo.expand(aoi.bbox, 40), { outFields: 'type,age', maxOffset: 0.002 }).catch(() => ({ features: [] })),
      B.ags.query(svc + '/6', B.geo.expand(aoi.bbox, 150), { outFields: 'type,obs', maxOffset: 0.005 }).catch(() => ({ features: [] })),
    ]);
    const u = ptR[0] ? ptR[0].attributes : null;
    const kimberlitos = kimb.features.map((f) => ({ lat: f.geometry.y, lon: f.geometry.x, idade: B.clean(f.attributes.age), dist: aoi.dist(f.geometry.y, f.geometry.x) })).sort((a, b) => a.dist - b.dist);
    const minDistLines = (fs) => {
      let m = null;
      fs.forEach((f) => ((f.geometry && f.geometry.paths) || []).forEach((p) => { const d = B.geo.distToLine(aoi.lat, aoi.lon, p.map(([x, y]) => [y, x])); if (m == null || d < m) m = d; }));
      return m;
    };
    const out = {
      _n: (u ? 1 : 0) + kimberlitos.length,
      ambiente: u ? B.clean(u.tec_env) : null, ciclo: u ? B.clean(u.tec_cycle) : null,
      kimberlitos, diquesN: dikes.features.length, diquesDist: minDistLines(dikes.features), suturaDist: minDistLines(sut.features),
    };
    if (out.ambiente) L.add('obs', 'Tectônica', `Domínio tectônico: ${out.ambiente}${out.ciclo ? ' — ciclo ' + out.ciclo : ''}.`, 'Mapa Tectônico da América do Sul (SGB/CGMW, 1:5.000.000)', { url: svc });
    if (kimberlitos.length) L.add('obs', 'Tectônica', `Kimberlito cadastrado mais próximo a ${B.km(kimberlitos[0].dist)}.`, 'Mapa Tectônico da América do Sul — kimberlitos', { url: svc });
    if (out.suturaDist != null) L.add('obs', 'Tectônica', `Zona de sutura mais próxima a ${B.km(out.suturaDist)}.`, 'Mapa Tectônico da América do Sul', { url: svc });
    return out;
  }

  /* ---------- 6. Afloramentos descritos (GEOBANK) ---------- */
  async function afloramentos(ctx) {
    const { aoi, L } = ctx;
    const res = await B.ags.identifyEnv(SGB + 'geologia/afloramentos/MapServer', aoi.bbox, { returnGeometry: true, timeout: 35000 });
    const list = res.map((r) => {
      const a = r.attributes, lat = r.geometry ? r.geometry.y : B.num(a.Y), lon = r.geometry ? r.geometry.x : B.num(a.X);
      return { lat, lon, id: A(a, 'Id do afloramento'), top: A(a, 'Toponímia'), mun: A(a, 'Município'), uf: A(a, 'Uf'), tipo: A(a, 'Tipo'), desc: A(a, 'Descrição'), rochas: A(a, 'Rochas'), geologo: A(a, 'Geólogo'), data: A(a, 'Data de cadastro'), projeto: A(a, 'Projeto'), campo: A(a, 'Nº de campo'), dist: aoi.dist(lat, lon) };
    }).filter((x) => x.lat != null && aoi.contains(x.lat, x.lon)).sort((a, b) => a.dist - b.dist);
    if (list.length) {
      const near = list[0];
      L.add('obs', 'Campo', `${list.length} afloramento(s) descrito(s) por geólogos do SGB na área. Mais próximo (${B.km(near.dist)}): ${near.rochas || near.tipo || ''}${near.desc ? ' — “' + near.desc.slice(0, 160) + (near.desc.length > 160 ? '…' : '') + '”' : ''}`, 'SGB — GEOBANK Afloramentos', { url: SGB + 'geologia/afloramentos/MapServer' });
    }
    return { _n: list.length, list, truncado: res.length >= 1000 };
  }

  /* ---------- 7. Ocorrências minerais (SGB) ---------- */
  async function ocorrencias(ctx) {
    const { aoi, L } = ctx;
    const res = await B.ags.identifyEnv(SGB + 'geologia/ocorrencias/MapServer', aoi.ctx, { returnGeometry: true, timeout: 40000 });
    const list = res.map((r) => {
      const a = r.attributes, lat = r.geometry ? r.geometry.y : B.num(a.Y), lon = r.geometry ? r.geometry.x : B.num(a.X);
      const subs = (A(a, 'Substâncias minerais') || 'Não informada').split(/\s*,\s*/).filter(Boolean);
      return {
        lat, lon, subs, classe: A(a, 'Classes utilitárias'), status: A(a, 'Status econômico'), imp: A(a, 'Importância'),
        top: A(a, 'Toponímia'), mun: A(a, 'Município'), uf: A(a, 'Uf'), host: A(a, 'Rochas hospedeiras'), encaixante: A(a, 'Rochas encaixantes'),
        morfo: A(a, 'Morfologia'), textura: A(a, 'Texturas'), alteracao: A(a, 'Alterações'), mina: A(a, 'Situação da mina'), garimpo: A(a, 'Situação do garimpo'),
        metodo: A(a, 'Método de geoposicionamento'), provincia: A(a, 'Privíncia mineral') || A(a, 'Província mineral'), id: A(a, 'Id da ocorrência'),
        dist: aoi.dist(lat, lon), fonte: 'SGB',
      };
    }).filter((o) => o.lat != null);
    list.forEach((o) => (o.naArea = aoi.contains(o.lat, o.lon)));
    list.sort((a, b) => a.dist - b.dist);
    const na = list.filter((o) => o.naArea);
    const fonte = 'SGB — GEOBANK Ocorrências de Recursos Minerais';
    if (na.length) {
      const bySub = {};
      na.forEach((o) => o.subs.forEach((s) => (bySub[s] = (bySub[s] || 0) + 1)));
      const top = Object.entries(bySub).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([s, n]) => `${s} (${n})`).join(', ');
      L.add('obs', 'Recursos minerais', `${na.length} ocorrência(s) mineral(is) cadastrada(s) na área: ${top}.`, fonte, { url: SGB + 'geologia/ocorrencias/MapServer' });
      const minas = na.filter((o) => /mina|garimpo|dep[oó]sito/i.test((o.status || '') + ' ' + (o.imp || '')));
      if (minas.length) L.add('obs', 'Recursos minerais', `${minas.length} registro(s) classificados como mina, garimpo ou depósito.`, fonte);
    } else {
      L.add('unk', 'Recursos minerais', `Nenhuma ocorrência cadastrada pelo SGB dentro da área (${list.length} no entorno de ${B.km(aoi.ctxKm)}). A ausência de cadastro não prova ausência de minério.`, fonte);
    }
    return { _n: list.length, list, naArea: na.length, truncado: res.length >= 1000 };
  }

  /* ---------- 8. USGS MRDS (global) ---------- */
  async function mrds(ctx) {
    const { aoi, L } = ctx;
    const { features } = await B.ags.query(MRDS, aoi.ctx, { outFields: 'dep_id,site_name,dev_stat,code_list,url', timeout: 45000 });
    const list = features.map((f) => {
      const codes = String(f.attributes.code_list || '').trim().split(/\s+/).filter(Boolean);
      const lat = f.geometry.y, lon = f.geometry.x;

  /* ---------- 12. Geoquímica exploratória (SGB) ---------- */
  B.ELEMENTOS = ['au', 'ag', 'as', 'sb', 'bi', 'te', 'w', 'mo', 'cu', 'pb', 'zn', 'ni', 'co', 'cr', 'sn', 'li', 'cs', 'ta', 'nb', 'be', 'rb', 'b', 'ba', 'la', 'ce', 'y', 'u', 'th', 'p', 'fe', 'mn', 'v', 'ti'];
  const MINERAIS_BATEIA = ['ouro', 'cassiterita', 'columbita', 'tantalita', 'columbita_tantalita', 'scheelita', 'wolframita', 'turmalina', 'berilo', 'gahnita', 'monazita', 'xenotimio', 'cinabrio', 'pirita', 'pirita_limonita', 'magnetita', 'cromita', 'ilmenita', 'rutilo', 'zircao', 'granadas', 'topazio', 'corindon', 'barita', 'galena', 'calcopirita', 'malaquita', 'espodumenio', 'lepidolita', 'diamante', 'platina', 'molibdenita', 'fluorita', 'apatita', 'hematita', 'limonita', 'anatasio'];
  async function geoquimica(ctx) {
    const { aoi, L } = ctx;
    const svc = SGB + 'geologia/geoq_externa/MapServer';
    const win = aoi.ctx;
    const groups = [];
    for (let i = 0; i < B.ELEMENTOS.length; i += 4) groups.push(B.ELEMENTOS.slice(i, i + 4));
    let truncado = false;
    const recs = await B.pool(groups, 4, (g) => B.ags.identifyEnv(svc, win, { layers: 'all:19', layerDefs: { 19: `analito IN (${g.map((e) => `'${e}'`).join(',')})` }, timeout: 40000 }).then((r) => { if (r.length >= 2000) truncado = true; return r; }));
    const amostras = new Map();
    let falhas = 0;
    recs.forEach((r) => {
      if (!r || r.__err) { falhas++; return; }
      r.forEach(({ attributes: a }) => {
        const id = a.amostra || a.numero_de_campo;
        const lat = B.num(a.latitude), lon = B.num(a.longitude);
        if (lat == null || lon == null) return;
        if (!amostras.has(id)) amostras.set(id, { id, campo: B.clean(a.numero_de_campo), lat, lon, projeto: B.clean(a.projeto_publicacao) || B.clean(a.projeto_amostragem), classe: B.clean(a.classe), leitura: B.clean(a.leitura), abertura: B.clean(a.abertura), data: B.clean(a.data_de_analise), lab: B.clean(a.laboratorio), el: {}, dist: aoi.dist(lat, lon), naArea: aoi.contains(lat, lon) });
        const q = B.clean(a.qualificador);
        let v = B.num(a.valor);
        if (v == null) return;
        const menor = q && /</.test(q);
        if (menor) v = v / 2;
        amostras.get(id).el[a.analito] = { v, u: B.clean(a.unidade) || '', menor };
      });
    });
    const list = Array.from(amostras.values());
    // pintas de ouro e mineralometria (concentrados de bateia)
    const [pintas, mineral] = await Promise.all([
      B.ags.identifyEnv(svc, win, { layers: 'all:14', timeout: 30000 }).catch(() => []),
      B.ags.identifyEnv(svc, win, { layers: 'all:16', layerDefs: { 16: `analito IN (${MINERAIS_BATEIA.map((m) => `'${m}'`).join(',')})` }, timeout: 30000 }).catch(() => []),
    ]);
    const conc = new Map();
    const addConc = (a, kind) => {
      const lat = B.num(a.latitude), lon = B.num(a.longitude);
      if (lat == null) return;
      const id = a.amostra || a.numero_de_campo;
      if (!conc.has(id)) conc.set(id, { id, lat, lon, campo: B.clean(a.numero_de_campo), projeto: B.clean(a.projeto_publicacao), minerais: {}, pintasAu: 0, naArea: aoi.contains(lat, lon), dist: aoi.dist(lat, lon) });
      const c = conc.get(id);
      if (kind === 'pintas') c.pintasAu += B.num(a.quantidade) || 0;
      else c.minerais[a.analito] = B.clean(a.valor) || 'presente';
    };
    pintas.forEach((r) => addConc(r.attributes, 'pintas'));
    mineral.forEach((r) => addConc(r.attributes, 'mineral'));
    const concentrados = Array.from(conc.values());
    const fonte = 'SGB — Geoquímica exploratória (sedimento de corrente, ICP-OES/MS; concentrados de bateia)';
    const na = list.filter((s) => s.naArea);
    if (list.length) L.add('obs', 'Geoquímica', `${list.length} amostra(s) de sedimento de corrente no entorno de ${B.km(aoi.ctxKm)} (${na.length} dentro da área).`, fonte, { url: svc });
    else L.add('unk', 'Geoquímica', 'Sem amostras de sedimento de corrente do SGB na área e no entorno. Falta de amostragem não indica ausência de anomalia.', fonte);
    if (concentrados.length) {
      const ouro = concentrados.filter((c) => c.pintasAu > 0);
      L.add('obs', 'Geoquímica', `${concentrados.length} concentrado(s) de bateia no entorno${ouro.length ? `; ${ouro.length} com pintas de ouro` : ''}.`, fonte, { url: svc });
    }
    return { _n: list.length + concentrados.length, amostras: list, concentrados, truncado, falhas };
  }

  /* ---------- 15. Imagens geofísicas nacionais (SGB ImageServer) ---------- */
  B.GEOF = [
    { id: 'mag', svc: 'geofisica_mag', nome: 'Campo magnético anômalo', curto: 'Magnetometria', tipo: 'rainbow' },
    { id: 'asa', svc: 'geofisica_sinal', nome: 'Amplitude do sinal analítico', curto: 'Sinal analítico', tipo: 'rainbow' },
    { id: 'dv1', svc: 'geofisica_1dv', nome: 'Primeira derivada vertical', curto: '1ª derivada', tipo: 'gray' },
    { id: 'k', svc: 'geofisica_kperc', nome: 'Potássio (K)', curto: 'K', tipo: 'rainbow' },
    { id: 'th', svc: 'geofisica_eth', nome: 'Tório equivalente (eTh)', curto: 'eTh', tipo: 'rainbow' },
    { id: 'u', svc: 'geofisica_eu', nome: 'Urânio equivalente (eU)', curto: 'eU', tipo: 'rainbow' },
    { id: 'thk', svc: 'geofisica_thk', nome: 'Razão Th/K', curto: 'Th/K', tipo: 'rainbow' },
    { id: 'ct', svc: 'geofisica_ct', nome: 'Contagem total (gama)', curto: 'Contagem total', tipo: 'rainbow' },
    { id: 'tern', svc: 'geofisica_ternario', nome: 'Composição ternária K–eTh–eU', curto: 'Ternário', tipo: 'ternario' },
    { id: 'boug', svc: 'geofisica_anomalia_bouguer_brasil', nome: 'Anomalia Bouguer (Brasil)', curto: 'Bouguer', tipo: 'rainbow' },
  ];
  /* Converte a cor da paleta pseudo-arco-íris (azul → ciano → verde → amarelo → vermelho → magenta)
     numa intensidade relativa 0–1. É um valor DERIVADO da imagem, não a medida física. */
  B.rgbToRel = function (r, g, b, tipo) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx / 255, s = mx ? (mx - mn) / mx : 0;
    if (tipo === 'gray') return mx < 3 ? null : (r + g + b) / 765;
    if (s < 0.18) return v > 0.88 ? 1 : null;
    let h;
    const d = mx - mn;
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
    if (h > 245) h -= 360; // magenta/rosa = topo da escala
    return B.clamp(((240 - h) / 300), 0, 1);
  };
  async function geofImgs(ctx) {
    const { aoi, L } = ctx;
    const win = B.geo.expand(aoi.bbox, Math.max(aoi.raioKm, 3));
    const [wk, hk] = B.geo.bboxKm(win);
    const W = 120, H = Math.max(40, Math.round(120 * hk / wk));
    const out = {};
    await B.pool(B.GEOF, 4, async (G) => {
      const url = B.ags.imageURL(SGBI + G.svc + '/ImageServer', win, W, H, true);
      try {
        const blob = await B.fetchBlob(url, { timeout: 30000 });
        const img = await B.blobToImageData(blob);
        const rel = new Float32Array(W * H).fill(NaN), tern = G.tipo === 'ternario' ? new Float32Array(W * H * 3).fill(NaN) : null;
        let cov = 0, covAOI = 0, nAOI = 0;
        const inAOI = new Uint8Array(W * H);
        for (let i = 0; i < H; i++) for (let j = 0; j < W; j++) {
          const k = i * W + j, o = k * 4, d = img.data;
          const lat = win[3] - ((i + 0.5) / H) * (win[3] - win[1]), lon = win[0] + ((j + 0.5) / W) * (win[2] - win[0]);
          if (aoi.contains(lat, lon)) { inAOI[k] = 1; nAOI++; }
          if (d[o + 3] < 128) continue;
          if (tern) { tern[k * 3] = d[o] / 255; tern[k * 3 + 1] = d[o + 1] / 255; tern[k * 3 + 2] = d[o + 2] / 255; cov++; if (inAOI[k]) covAOI++; continue; }
          const v = B.rgbToRel(d[o], d[o + 1], d[o + 2], G.tipo);
          if (v != null) { rel[k] = v; cov++; if (inAOI[k]) covAOI++; }
        }
        out[G.id] = { G, url, win, W, H, rel, tern, inAOI, cobertura: cov / (W * H), coberturaAOI: nAOI ? covAOI / nAOI : 0, blobUrl: URL.createObjectURL(blob) };
      } catch (e) { out[G.id] = { G, erro: e.message }; }
    });
    const ok = Object.values(out).filter((x) => x.cobertura > 0.05);
    if (ok.length) L.add('obs', 'Geofísica', `Imagens aerogeofísicas do SGB disponíveis para ${ok.map((x) => x.G.curto).join(', ')}.`, 'SGB — Mosaicos aerogeofísicos nacionais (ImageServer)', { url: SGBI });
    else L.add('unk', 'Geofísica', 'Sem cobertura dos mosaicos aerogeofísicos do SGB nesta área.', 'SGB — Mosaicos aerogeofísicos');
    return { _n: ok.length, imgs: out, win, W, H };
  }

  /* ---------- 16. EMAG2v3 — anomalia magnética global (NOAA) ---------- */
  async function emag2(ctx) {
    const { aoi, L } = ctx;
    const win = B.geo.expand(aoi.bbox, Math.max(15, aoi.raioKm * 2));
    const n = 9, pts = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) pts.push([win[0] + (j / (n - 1)) * (win[2] - win[0]), win[3] - (i / (n - 1)) * (win[3] - win[1])]);
    pts.push([aoi.lon, aoi.lat]);
    const geom = { points: pts, spatialReference: { wkid: 4326 } };
    const j = await B.fetchJSON('https://gis.ngdc.noaa.gov/arcgis/rest/services/EMAG2v3/ImageServer/getSamples?' + B.qs({ f: 'json', geometry: JSON.stringify(geom), geometryType: 'esriGeometryMultipoint', returnFirstValueOnly: true }), { timeout: 30000 });
    const vals = (j.samples || []).map((s) => B.num(s.value));
    const centro = vals[vals.length - 1];
    const grid = vals.slice(0, n * n);
    const st = B.stats.summary(grid);
    if (!st) return { _n: 0 };
    if (centro != null) L.add('obs', 'Geofísica', `Anomalia magnética (EMAG2v3, 4 km de altitude, malha de 2'): ${B.fmt(centro, 1)} nT no centro; no entorno ${B.fmt(st.min, 0)} a ${B.fmt(st.max, 0)} nT.`, 'NOAA NCEI — EMAG2v3', { url: 'https://www.ncei.noaa.gov/products/earth-magnetic-model-anomaly-grid-2' });
    return { _n: grid.filter((v) => v != null).length, centro, grid, n, win, st };
  }

  /* ---------- 17. Modelo digital de elevação (AWS Terrain Tiles / Terrarium) ---------- */
  async function dem(ctx) {
    const { aoi, L } = ctx;
    const b = aoi.tipo === 'ponto' ? aoi.bbox : B.geo.expand(aoi.bbox, Math.max(...B.geo.bboxKm(aoi.bbox)) * 0.08);
    const lonW = b[2] - b[0];
    let z = B.clamp(Math.round(Math.log2((640 * 360) / (lonW * 256))), 4, 14);
    const tx = (lon, zz) => ((lon + 180) / 360) * 2 ** zz;
    const ty = (lat, zz) => ((1 - Math.log(Math.tan(lat * rad) + 1 / Math.cos(lat * rad)) / Math.PI) / 2) * 2 ** zz;
    let x0, x1, y0, y1;
    for (;;) {
      x0 = Math.floor(tx(b[0], z)); x1 = Math.floor(tx(b[2], z)); y0 = Math.floor(ty(b[3], z)); y1 = Math.floor(ty(b[1], z));
      if ((x1 - x0 + 1) * (y1 - y0 + 1) <= 25 || z <= 4) break;
      z--;
    }
    const cw = (x1 - x0 + 1) * 256, ch = (y1 - y0 + 1) * 256;
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    const g = cv.getContext('2d', { willReadFrequently: true });
    const tiles = [];
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) tiles.push([x, y]);
    await B.pool(tiles, 6, async ([x, y]) => {
      const blob = await B.fetchBlob(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`, { timeout: 20000 });
      const bmp = await createImageBitmap(blob);
      g.drawImage(bmp, (x - x0) * 256, (y - y0) * 256);
    });
    const px = g.getImageData(0, 0, cw, ch).data;
    const elevAt = (X, Y) => { const o = (Y * cw + X) * 4; return px[o] * 256 + px[o + 1] + px[o + 2] / 256 - 32768; };
    const sample = (lat, lon) => {
      const X = (tx(lon, z) - x0) * 256 - 0.5, Y = (ty(lat, z) - y0) * 256 - 0.5;
